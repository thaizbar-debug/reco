    if(hPm2.length>=10)crossHtml+='<div class="dm-src"><div class="src-lbl">Transacciones</div><div class="src-val" style="color:var(--amber)">$'+fmtNum(Math.round(medH))+'</div><div class="src-sub">'+fmtNum(hPm2.length)+' registros · Cerradas</div></div>';
    if(latB)crossHtml+='<div class="dm-src"><div class="src-lbl">BCRP Oficial</div><div class="src-val" style="color:var(--green)">$'+fmtNum(latB.precio_promedio_usd_m2||0)+'</div><div class="src-sub">'+bYrs[bYrs.length-1].replace('_est',' (est.)')+' · Promedio</div></div>';
    crossHtml+='</div>';
  }

  // Percentiles
  const pctHtml=pm2.length>=10?'<div style="display:flex;gap:8px;flex-wrap:wrap;font-size:.78rem;margin-bottom:8px">'+
    ['P10',_mktPct(pm2,.1),'P25',_mktPct(pm2,.25),'Mediana',med,'P75',_mktPct(pm2,.75),'P90',_mktPct(pm2,.9)]
    .reduce((acc,v,i,a)=>{if(i%2===0){const lbl=v,val=a[i+1],isMed=lbl==='Mediana';
      acc+='<div style="flex:1;min-width:70px;padding:8px;background:'+(isMed?'var(--primary-light)':'var(--bg)')+';border-radius:var(--r);text-align:center"><div style="color:'+(isMed?'var(--blue)':'var(--txt-muted)')+(isMed?';font-weight:600':'')+'">'
        +lbl+'</div><div style="font-weight:700'+(isMed?';color:var(--blue)':'')+'">$'+fmtNum(Math.round(val))+'</div></div>';}return acc;},'')+'</div>':'';

  return`
    <div class="kpi-grid" style="display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:14px;margin-bottom:20px">
      <div class="section-card"><div class="card-body" style="text-align:center;padding:18px 12px">
        <div style="font-size:1.6rem;font-weight:800;color:var(--blue)">$${fmtNum(Math.round(med))}</div>
        <div style="font-size:.72rem;color:var(--txt-muted);font-weight:600;margin:4px 0">Mediana USD/m²</div>
        <div style="font-size:.68rem;color:var(--txt-muted)">Oferta Venta · Lima</div>
        <div style="margin-top:6px">${_dmSBadge(pm2.length)}</div>
      </div></div>
      <div class="section-card"><div class="card-body" style="text-align:center;padding:18px 12px">
        <div style="font-size:1.6rem;font-weight:800;color:var(--green)">${fmtNum(totalAct)}</div>
        <div style="font-size:.72rem;color:var(--txt-muted);font-weight:600;margin:4px 0">Propiedades Activas</div>
        <div style="font-size:.68rem;color:var(--txt-muted)">${fmtNum(nV)} venta · ${fmtNum(nA)} alquiler</div>
      </div></div>
      <div class="section-card"><div class="card-body" style="text-align:center;padding:18px 12px">
        <div style="font-size:1.6rem;font-weight:800;color:var(--amber)">${fmtNum(hist.length)}</div>
        <div style="font-size:.72rem;color:var(--txt-muted);font-weight:600;margin:4px 0">Transacciones Hist.</div>
        <div style="font-size:.68rem;color:var(--txt-muted)">${fmtNum(hPm2.length)} con precio/m²</div>
      </div></div>
      <div class="section-card"><div class="card-body" style="text-align:center;padding:18px 12px">
        <div style="font-size:1.6rem;font-weight:800;color:var(--purple)">${hPm2.length>=10?'$'+fmtNum(Math.round(medH)):'—'}</div>
        <div style="font-size:.72rem;color:var(--txt-muted);font-weight:600;margin:4px 0">Mediana Hist. USD/m²</div>
        <div style="font-size:.68rem;color:var(--txt-muted)">Transacciones cerradas</div>
        ${hPm2.length>=10?'<div style="margin-top:6px">'+_dmSBadge(hPm2.length)+'</div>':''}
      </div></div>
      ${latB?`<div class="section-card"><div class="card-body" style="text-align:center;padding:18px 12px">
        <div style="font-size:1.6rem;font-weight:800;color:var(--blue)">$${fmtNum(latB.precio_promedio_usd_m2||0)}</div>
        <div style="font-size:.72rem;color:var(--txt-muted);font-weight:600;margin:4px 0">BCRP Depto Lima</div>
        <div style="font-size:.68rem;color:var(--txt-muted)">${bYrs[bYrs.length-1].replace('_est',' (est.)')} · Fuente oficial</div>
      </div></div>`:''}
    </div>

    ${crossHtml?`<div class="section-card" style="margin-bottom:20px">
      <div class="card-header"><h3>${IC.chart} Comparativa Multi-fuente (R-CROSS-01)</h3><span style="font-size:.68rem;color:var(--txt-muted)">Mediana USD/m² por fuente · Lima</span></div>
      <div class="card-body">${crossHtml}
        <div style="font-size:.68rem;color:var(--txt-muted);margin-top:8px;font-style:italic">Cada fuente refleja una población diferente. Oferta = precios publicación. Transacciones = precios cerrados. BCRP = promedio departamental oficial.</div>
      </div>
    </div>`:''}

    <div class="section-card" style="margin-bottom:20px">
      <div class="card-header"><h3>Distribución Precio/m² — Oferta Venta Lima</h3><span style="font-size:.68rem;color:var(--txt-muted)">Percentiles (excl. outliers)</span></div>
      <div class="card-body">${pctHtml||'<p style="color:var(--txt-muted);font-size:.82rem">Muestra insuficiente para distribución</p>'}</div>
    </div>

    <div class="grid-2" style="margin-bottom:20px">
      <div class="section-card">
        <div class="card-header"><h3>${IC.chart} Por Tipo de Propiedad</h3></div>
        <div class="card-body">${typeEnt.length?renderPieChart(typeEnt,120):'Sin datos'}</div>
      </div>
      <div class="section-card">
        <div class="card-header"><h3>${IC.trendUp} Ranking Distrital</h3><span style="font-size:.68rem;color:var(--txt-muted)">${fmtNum(dRank.length)} distritos · ≥3 registros</span></div>
        <div class="card-body no-pad" style="overflow-x:auto;max-height:420px">
          <table class="data-table"><thead><tr><th>#</th><th>Distrito</th><th>n</th><th>Mediana</th><th>P25–P75</th><th>Muestra</th><th></th></tr></thead><tbody>
            ${dRank.slice(0,25).map((d,i)=>`<tr style="cursor:pointer" onclick="_dmNav('distrito','${esc(d.name).replace(/'/g,"\\'")}')">
              <td>${i+1}</td>
              <td><strong>${esc(d.name)}</strong></td>
              <td>${fmtNum(d.count)}</td>
              <td style="font-weight:700;color:var(--blue)">$${fmtNum(Math.round(d.med))}</td>
              <td style="font-size:.72rem">${d.p25?'$'+fmtNum(Math.round(d.p25))+' — $'+fmtNum(Math.round(d.p75)):'—'}</td>
              <td>${_dmSBadge(d.n)}</td>

// ── I-02: District Pricing Benchmark ──
function _dmRenderDistrito(){
  // Build district list
  const allDists=[...new Set(_pubs.filter(p=>p.op==='Venta'&&p.department==='Lima'&&p.cur==='$'&&p.price>0&&p.area>0&&p.district).map(p=>p.district))].sort();
  if(!allDists.length)return'<div class="dm-empty"><p>No hay datos de oferta para calcular benchmarks distritales.</p></div>';

  const distSel=_dmDist||allDists[0];
  const tipos=[...new Set(_pubs.filter(p=>p.op==='Venta'&&p.district===distSel&&p.cur==='$'&&p.price>0&&p.area>0).map(p=>p.type||'Otro'))].sort();

  // Selector bar
  const selBar=`<div class="filter-bar" style="margin-bottom:20px">
    <select onchange="_dmNav('distrito',this.value,'','')" style="padding:6px 12px;border:1px solid var(--border);border-radius:var(--r);font-size:.82rem;background:var(--bg-card);color:var(--txt)">
      ${allDists.map(d=>`<option value="${esc(d)}"${d===distSel?' selected':''}>${esc(d)}</option>`).join('')}
    </select>
    ${tipos.length>1?`<select onchange="_dmNav('distrito',undefined,this.value,'')" style="padding:6px 12px;border:1px solid var(--border);border-radius:var(--r);font-size:.82rem;background:var(--bg-card);color:var(--txt)">
      <option value="">Todos los tipos</option>
      ${tipos.map(t=>`<option value="${esc(t)}"${t===_dmTipo?' selected':''}>${esc(t)}</option>`).join('')}
    </select>`:''}
    ${_dmTipo?'<button class="btn btn-outline btn-sm" onclick="_dmNav(\'distrito\',undefined,\'\',\'\')">Limpiar</button>':''}
  </div>`;

  // Calculate benchmark
  let vDist=_pubs.filter(p=>p.op==='Venta'&&p.district===distSel&&p.cur==='$'&&p.price>0&&p.area>0);
  if(_dmTipo)vDist=vDist.filter(p=>p.type===_dmTipo);
  const rawPm2=vDist.map(p=>p.price/p.area);
  const pm2=_dmClean(rawPm2);
  const n=pm2.length;

  // Insufficient data
  if(n<10){
    const rawN=rawPm2.length;
    return selBar+`<div class="section-card"><div class="card-body"><div class="dm-empty">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="width:48px;height:48px;margin-bottom:14px;opacity:.4"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg>
      <p><strong>Datos insuficientes</strong></p>
      <p>Se requieren al menos 10 registros para generar un benchmark confiable${_dmTipo?' para '+esc(_dmTipo):''} en ${esc(distSel)}.</p>
      <p style="font-size:.78rem;margin-top:8px">${_dmSBadge(rawN)}</p>
      ${_dmTipo?'<p style="margin-top:12px"><button class="btn btn-outline btn-sm" onclick="_dmNav(\'distrito\',undefined,\'\')">Ver todos los tipos</button></p>':''}
    </div></div></div>`;
  }

  const med=_mktMedian(pm2);
  const p10=_mktPct(pm2,.1),p25=_mktPct(pm2,.25),p75=_mktPct(pm2,.75),p90=_mktPct(pm2,.9);
  const iqr=p75-p25;
  const disp=med>0?(iqr/med*100):0;
  const dispFlag=disp>40;

  // By-type breakdown (unfiltered)
  const byType={};
  _pubs.filter(p=>p.op==='Venta'&&p.district===distSel&&p.cur==='$'&&p.price>0&&p.area>0).forEach(p=>{
    const t=p.type||'Otro';
    if(!byType[t])byType[t]={pm2:[],n:0};
    byType[t].pm2.push(p.price/p.area);byType[t].n++;
  });
  const typeRows=Object.entries(byType).map(([t,d])=>{
    const c=_dmClean(d.pm2);
    return{type:t,med:c.length>=3?_mktMedian(c):null,n:c.length,rawN:d.n};
  }).sort((a,b)=>b.rawN-a.rawN);

  // Cross-reference sources (R-CROSS-01: label each clearly)
  const crossParts=[];
  crossParts.push({label:'Oferta Reco',val:med,n:n,sub:'Asking · '+(_dmTipo||'Todos'),color:'var(--blue)'});

  const histAll=_marketData.histMarket?.historicos||[];
  const histD=histAll.filter(h=>_dmND(h.distrito,'hist')===distSel&&h.precio_m2_usd>0);
  if(histD.length>=10){
    const hc=_dmClean(histD.map(h=>h.precio_m2_usd));
    crossParts.push({label:'Transacciones',val:_mktMedian(hc),n:hc.length,sub:'Cerradas',color:'var(--amber)'});
  }

  if(_marketData.bcrp?.por_distrito_2025){
    for(const[bk,bv]of Object.entries(_marketData.bcrp.por_distrito_2025)){
      if(_dmND(bk,'bcrp')===distSel){
        crossParts.push({label:'BCRP 2025',val:bv.mediana_usd_m2,n:null,sub:'Depto · Mediana',color:'var(--green)'});
        break;
      }
    }
  }

  const tas=_marketData.tasFull||_marketData.tasaciones;
  if(tas?.distritos){
    for(const[tk,tv]of Object.entries(tas.distritos)){
      if(_dmND(tk,'tas')===distSel){
        const yrs=Object.keys(tv.años||{}).sort();
        const lat=yrs.length?tv.años[yrs[yrs.length-1]]:null;
        if(lat&&lat.mediana_usd_m2){
          crossParts.push({label:'Tasación '+yrs[yrs.length-1],val:lat.mediana_usd_m2,n:lat.n||null,sub:'Valor referencial',color:'var(--purple)'});
        }
        break;
      }
    }
  }

  const nSrc=crossParts.length;
  const qPct=rawPm2.length?(pm2.length/rawPm2.length*100):0;
  const conf=_dmConf(n,nSrc,'distrito',90,qPct);

  // Properties list for I-06 navigation
  const props=_pubs.filter(p=>p.op==='Venta'&&p.district===distSel&&p.cur==='$'&&p.price>0&&p.area>0)
    .map(p=>({id:p.id,address:p.address||p.desc||'Sin dirección',type:p.type||'Otro',price:p.price,area:p.area,ppm2:p.price/p.area,beds:p.beds||0}))
    .sort((a,b)=>b.ppm2-a.ppm2);

  return selBar+`
    <div class="kpi-grid" style="display:grid;grid-template-columns:repeat(auto-fit,minmax(155px,1fr));gap:14px;margin-bottom:20px">
      <div class="section-card"><div class="card-body" style="text-align:center;padding:16px 12px">
        <div style="font-size:1.8rem;font-weight:800;color:var(--blue)">$${fmtNum(Math.round(med))}</div>
        <div style="font-size:.72rem;color:var(--txt-muted);font-weight:600">Mediana USD/m²</div>
        <div style="margin-top:6px">${_dmSBadge(n)}</div>
      </div></div>
      <div class="section-card"><div class="card-body" style="text-align:center;padding:16px 12px">
        <div style="font-size:1.8rem;font-weight:800;color:var(--green)">$${fmtNum(Math.round(p25))}</div>
        <div style="font-size:.72rem;color:var(--txt-muted);font-weight:600">P25</div>
      </div></div>
      <div class="section-card"><div class="card-body" style="text-align:center;padding:16px 12px">
        <div style="font-size:1.8rem;font-weight:800;color:var(--amber)">$${fmtNum(Math.round(p75))}</div>
        <div style="font-size:.72rem;color:var(--txt-muted);font-weight:600">P75</div>
      </div></div>
      <div class="section-card"><div class="card-body" style="text-align:center;padding:16px 12px">
        <div style="font-size:1.8rem;font-weight:800;color:${dispFlag?'var(--red)':'var(--txt)'}">${disp.toFixed(0)}%</div>
        <div style="font-size:.72rem;color:var(--txt-muted);font-weight:600">Dispersión IQR</div>
        ${dispFlag?'<div style="font-size:.68rem;color:var(--red);margin-top:4px">⚠ Alta dispersión</div>':''}
      </div></div>
    </div>

    <div class="section-card" style="margin-bottom:20px">
      <div class="card-header"><h3>Distribución Precio/m² — ${esc(distSel)}</h3><span style="font-size:.68rem;color:var(--txt-muted)">${_dmTipo?esc(_dmTipo)+' · ':''}Percentiles (excl. outliers)</span></div>
      <div class="card-body">
        <div style="display:flex;gap:8px;flex-wrap:wrap;font-size:.78rem">
          ${[['P10',p10],['P25',p25],['Mediana',med],['P75',p75],['P90',p90]].map(([lbl,v])=>{
            const isM=lbl==='Mediana';
            return'<div style="flex:1;min-width:70px;padding:8px;background:'+(isM?'var(--primary-light)':'var(--bg)')+';border-radius:var(--r);text-align:center"><div style="color:'+(isM?'var(--blue)':'var(--txt-muted)')+(isM?';font-weight:600':'')+'">'
              +lbl+'</div><div style="font-weight:700'+(isM?';color:var(--blue)':'')+'">$'+fmtNum(Math.round(v))+'</div></div>';
          }).join('')}
        </div>
      </div>
    </div>

    ${crossParts.length>1?`<div class="section-card" style="margin-bottom:20px">
      <div class="card-header"><h3>${IC.chart} Comparativa Multi-fuente (R-CROSS-01)</h3><span style="font-size:.68rem;color:var(--txt-muted)">${esc(distSel)} · USD/m²</span></div>
      <div class="card-body">
        <div class="dm-cross">${crossParts.map(c=>'<div class="dm-src"><div class="src-lbl">'+esc(c.label)+'</div><div class="src-val" style="color:'+c.color+'">$'+fmtNum(Math.round(c.val))+'</div><div class="src-sub">'+esc(c.sub)+(c.n?' · n='+fmtNum(c.n):'')+'</div></div>').join('')}</div>
        <div style="font-size:.68rem;color:var(--txt-muted);margin-top:8px;font-style:italic">Cada fuente refleja una población diferente. Las medianas no son directamente comparables entre fuentes (R-COMP-01).</div>
      </div>
    </div>`:''}

    ${typeRows.length>1?`<div class="section-card" style="margin-bottom:20px">
      <div class="card-header"><h3>Segmentación por Tipo</h3><span style="font-size:.68rem;color:var(--txt-muted)">${esc(distSel)}</span></div>
      <div class="card-body no-pad" style="overflow-x:auto">
        <table class="data-table"><thead><tr><th>Tipo</th><th>Propiedades</th><th>Mediana USD/m²</th><th>Muestra</th></tr></thead><tbody>
          ${typeRows.map(t=>`<tr${t.n>=3?' style="cursor:pointer" onclick="_dmNav(\'distrito\',undefined,\''+esc(t.type).replace(/'/g,"\\'")+'\')"':''}>
            <td><strong>${esc(t.type)}</strong></td>
            <td>${fmtNum(t.rawN)}</td>
            <td style="font-weight:700">${t.med!==null?'$'+fmtNum(Math.round(t.med)):'<span style="color:var(--txt-muted)">n<3</span>'}</td>
            <td>${_dmSBadge(t.n)}</td>
          </tr>`).join('')}
        </tbody></table>
      </div>
    </div>`:''}

    <div class="section-card" style="margin-bottom:20px">
      <div class="card-header"><h3>Propiedades en ${esc(distSel)}</h3><span style="font-size:.68rem;color:var(--txt-muted)">${fmtNum(props.length)} propiedades · Seleccionar para ver posición</span></div>
      <div class="card-body no-pad" style="max-height:400px;overflow-y:auto">
        ${props.length?props.slice(0,30).map(p=>{
          const inRange=p.ppm2>=p25&&p.ppm2<=p75;
          const above=p.ppm2>p75;
          const clr=inRange?'var(--green)':above?'var(--amber)':'var(--blue)';
          return`<div class="dm-prop-row" onclick="_dmNav('posicion',undefined,undefined,'${esc(p.id).replace(/'/g,"\\'")}')">
            <div style="flex:1;min-width:0"><div style="font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${esc(truncate(p.address,50))}</div><div style="font-size:.72rem;color:var(--txt-muted)">${esc(p.type)} · ${p.beds?p.beds+' dorm · ':''}${fmtNum(Math.round(p.area))} m²</div></div>
            <div style="text-align:right;min-width:100px"><div style="font-weight:700">$${fmtNum(p.price)}</div><div style="font-weight:700;color:${clr};font-size:.78rem">$${fmtNum(Math.round(p.ppm2))}/m²</div></div>
            <div style="display:flex;flex-direction:column;gap:2px;flex-shrink:0;font-size:.72rem"><span style="color:var(--primary);cursor:pointer" onclick="event.stopPropagation();_dmNav('posicion',undefined,undefined,'${esc(p.id).replace(/'/g,"\\'")}')">Posición →</span><span style="color:var(--amber);cursor:pointer" onclick="event.stopPropagation();_dmNav('gap',undefined,undefined,'${esc(p.id).replace(/'/g,"\\'")}')">Brecha →</span></div>
          </div>`;
        }).join(''):'<div class="dm-empty"><p>Sin propiedades en este distrito</p></div>'}
        ${props.length>30?'<div style="padding:10px 14px;font-size:.72rem;color:var(--txt-muted);text-align:center">Mostrando 30 de '+fmtNum(props.length)+'</div>':''}
      </div>
    </div>

    ${_dmTrust(conf,nSrc,n,rawPm2.length-pm2.length,distSel+(_dmTipo?' · '+_dmTipo:''))}`;
}

// ── I-06: Market Position ──
function _dmRenderPosicion(){
  if(!_dmDist){_dmView='distrito';return _dmRenderDistrito();}

  const props=_pubs.filter(p=>p.op==='Venta'&&p.district===_dmDist&&p.cur==='$'&&p.price>0&&p.area>0)
    .map(p=>({id:p.id,address:p.address||p.desc||'Sin dirección',type:p.type||'Otro',price:p.price,area:p.area,ppm2:p.price/p.area,beds:p.beds||0}))
    .sort((a,b)=>a.ppm2-b.ppm2);
  if(!props.length)return'<div class="dm-empty"><p>No hay propiedades en '+esc(_dmDist)+' para analizar posición.</p></div>';

  const selId=_dmPropId||props[0].id;
  const prop=props.find(p=>p.id===selId)||props[0];

  // Build benchmark from district data
  let vDist=_pubs.filter(p=>p.op==='Venta'&&p.district===_dmDist&&p.cur==='$'&&p.price>0&&p.area>0);
  const sameType=vDist.filter(p=>p.type===prop.type);
  const useType=sameType.length>=10;
  const benchPop=useType?sameType:vDist;
  const rawPm2=benchPop.map(p=>p.price/p.area);
  const pm2=_dmClean(rawPm2);
  const n=pm2.length;

  const propSel=`<div class="filter-bar" style="margin-bottom:20px">
    <select onchange="_dmNav('posicion',undefined,undefined,this.value)" style="padding:6px 12px;border:1px solid var(--border);border-radius:var(--r);font-size:.82rem;background:var(--bg-card);color:var(--txt);max-width:500px">
      ${props.map(p=>`<option value="${esc(p.id)}"${p.id===selId?' selected':''}>${esc(truncate(p.address,40))} — $${fmtNum(Math.round(p.ppm2))}/m²</option>`).join('')}
    </select>
  </div>`;

  if(n<10){
    return propSel+`<div class="section-card"><div class="card-body"><div class="dm-empty">
      <p><strong>Datos insuficientes</strong></p>
      <p>Se requieren al menos 10 propiedades comparables para determinar posición de mercado en ${esc(_dmDist)}.</p>
      <p style="margin-top:8px">${_dmSBadge(n)}</p>
    </div></div></div>`;
  }

  const med=_mktMedian(pm2);
  const p25=_mktPct(pm2,.25),p75=_mktPct(pm2,.75);
  const p10=_mktPct(pm2,.1),p90=_mktPct(pm2,.9);
  const iqr=p75-p25;
  const disp=med>0?(iqr/med*100):0;
  const dispFlag=disp>40;
  const ppm2=prop.ppm2;

  // Calculate percentile
  const sorted=[...pm2].sort((a,b)=>a-b);
  let rank=0;
  for(let i=0;i<sorted.length;i++){if(sorted[i]<=ppm2)rank=i+1;}
  const pctile=Math.round((rank/sorted.length)*100);
  const diffPct=((ppm2-med)/med*100);

  // Statistical zone (never evaluative)
  let zone,zoneClr;
  if(pctile<=10){zone='Significativamente por debajo de la mediana del distrito';zoneClr='var(--blue)';}
  else if(pctile<=25){zone='Por debajo de la mediana del distrito';zoneClr='var(--blue)';}
  else if(pctile<=75){zone='Dentro del rango central del mercado (P25–P75)';zoneClr='var(--green)';}
  else if(pctile<=90){zone='Por encima de la mediana del distrito';zoneClr='var(--amber)';}
  else{zone='Significativamente por encima de la mediana del distrito';zoneClr='var(--amber)';}

  // Gauge visualization
  const gaugeMin=Math.max(0,p10*.85);
  const gaugeMax=p90*1.15;
  const gaugeRange=gaugeMax-gaugeMin;
  const propPos=Math.max(0,Math.min(100,((ppm2-gaugeMin)/gaugeRange)*100));
  const medPos=((med-gaugeMin)/gaugeRange)*100;
  const p25Pos=((p25-gaugeMin)/gaugeRange)*100;
  const p75Pos=((p75-gaugeMin)/gaugeRange)*100;

  const nSrc=1;
  const qPct=rawPm2.length?(pm2.length/rawPm2.length*100):0;
  const conf=_dmConf(n,nSrc,'distrito',90,qPct);

  return propSel+`
    <div class="section-card" style="margin-bottom:20px">
      <div class="card-header"><h3>Propiedad Seleccionada</h3></div>
      <div class="card-body">
        <div style="display:grid;grid-template-columns:1fr auto;gap:20px;align-items:center">
          <div>
            <div style="font-weight:700;font-size:1rem">${esc(prop.address)}</div>
            <div style="color:var(--txt-muted);font-size:.82rem;margin-top:4px">${esc(prop.type)} · ${prop.beds?prop.beds+' dorm · ':''}${fmtNum(Math.round(prop.area))} m² · $${fmtNum(prop.price)}</div>
          </div>
          <div style="text-align:right">
            <div style="font-size:2rem;font-weight:800;color:${zoneClr}">$${fmtNum(Math.round(ppm2))}</div>
            <div style="font-size:.72rem;color:var(--txt-muted);font-weight:600">USD/m²</div>
          </div>
        </div>
      </div>
    </div>

    <div class="section-card" style="margin-bottom:20px">
      <div class="card-header"><h3>Posición en el Mercado</h3><span style="font-size:.68rem;color:var(--txt-muted)">${esc(_dmDist)} · ${useType?esc(prop.type):'Todos los tipos'} · ${_dmSBadge(n)}</span></div>
      <div class="card-body">
        <div style="text-align:center;margin-bottom:16px">
          <div style="font-size:1.4rem;font-weight:800;color:${zoneClr}">Percentil ${pctile}</div>
          <div style="font-size:.88rem;color:var(--txt-muted);margin-top:4px">${esc(zone)}</div>
          <div style="font-size:.82rem;color:${diffPct>=0?'var(--amber)':'var(--blue)'};font-weight:700;margin-top:4px">${diffPct>=0?'+':''}${diffPct.toFixed(1)}% vs mediana del distrito</div>
        </div>

        <div class="dm-gauge">
          <div class="dm-gauge-bg" style="position:relative">
            <div style="position:absolute;left:${p25Pos}%;top:0;width:${p75Pos-p25Pos}%;height:100%;background:rgba(16,185,129,.15);border:1px dashed var(--green);border-radius:4px" title="Rango P25-P75"></div>
          </div>
          <div class="dm-gauge-md" style="left:${medPos}%" title="Mediana"></div>
          <div class="dm-gauge-mk" style="left:${propPos}%" title="Esta propiedad"></div>
          <div class="dm-gauge-lbl" style="left:${propPos}%;color:${zoneClr}">$${fmtNum(Math.round(ppm2))}</div>
        </div>
        <div style="display:flex;justify-content:space-between;font-size:.68rem;color:var(--txt-muted);margin-top:4px">
          <span>$${fmtNum(Math.round(gaugeMin))}</span>
          <span>P25: $${fmtNum(Math.round(p25))}</span>
          <span>Med: $${fmtNum(Math.round(med))}</span>
          <span>P75: $${fmtNum(Math.round(p75))}</span>
          <span>$${fmtNum(Math.round(gaugeMax))}</span>
        </div>

        <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:12px;margin-top:24px">
          <div style="padding:12px;background:var(--bg);border-radius:var(--r);text-align:center">
            <div style="font-size:.68rem;color:var(--txt-muted);font-weight:600">Esta propiedad</div>
            <div style="font-size:1.2rem;font-weight:800;color:${zoneClr}">$${fmtNum(Math.round(ppm2))}</div>
          </div>
          <div style="padding:12px;background:var(--bg);border-radius:var(--r);text-align:center">
            <div style="font-size:.68rem;color:var(--txt-muted);font-weight:600">Mediana distrito</div>
            <div style="font-size:1.2rem;font-weight:800">$${fmtNum(Math.round(med))}</div>
          </div>
          <div style="padding:12px;background:var(--bg);border-radius:var(--r);text-align:center">
            <div style="font-size:.68rem;color:var(--txt-muted);font-weight:600">Rango P25–P75</div>
            <div style="font-size:1rem;font-weight:700">$${fmtNum(Math.round(p25))} — $${fmtNum(Math.round(p75))}</div>
          </div>
          <div style="padding:12px;background:var(--bg);border-radius:var(--r);text-align:center">
            <div style="font-size:.68rem;color:var(--txt-muted);font-weight:600">Diferencia</div>
            <div style="font-size:1.2rem;font-weight:800;color:${diffPct>=0?'var(--amber)':'var(--blue)'}">${diffPct>=0?'+':''}${diffPct.toFixed(1)}%</div>
          </div>
        </div>

        <div style="margin-top:20px;padding:14px;background:var(--bg);border-radius:var(--r);font-size:.78rem;border-left:3px solid ${zoneClr}">
          <strong>Interpretación estadística:</strong> Esta propiedad se ubica en el <strong>percentil ${pctile}</strong> de las propiedades${useType?' tipo '+esc(prop.type):''} en ${esc(_dmDist)}, con un precio por m² <strong>${diffPct>=0?fmtNum(Math.round(Math.abs(diffPct)))+'% por encima':fmtNum(Math.round(Math.abs(diffPct)))+'% por debajo'}</strong> de la mediana del distrito. ${n>=30?'La muestra es estadísticamente confiable (n='+n+').':'La muestra es indicativa (n='+n+'); interpretar con cautela.'} ${dispFlag?'La alta dispersión ('+disp.toFixed(0)+'%) sugiere un mercado heterogéneo en esta zona.':''}
        </div>
      </div>
    </div>

    <div style="text-align:center;margin-bottom:16px">
      <button class="btn btn-outline btn-sm" onclick="_dmNav('gap',undefined,undefined,'${esc(prop.id).replace(/'/g,"\\'")}')">Ver Brecha de Valoración →</button>
    </div>

    ${_dmTrust(conf,nSrc,n,rawPm2.length-pm2.length,_dmDist+(useType?' · '+prop.type:''))}`;
}

// ── I-04: BCRP Price Trend ──
function _dmRenderTendBcrp(){
  const bcrp=_marketData.bcrp;
  if(!bcrp||!bcrp.data_anual)return'<div class="dm-empty"><p><strong>Sin datos BCRP</strong></p><p>No se encontraron datos de la serie de precios BCRP.</p></div>';
  const anual=bcrp.data_anual;
  const years=Object.keys(anual).filter(y=>!y.includes('est')).sort();
  const estKey=Object.keys(anual).find(y=>y.includes('est'));
  if(years.length<2)return'<div class="dm-empty"><p><strong>Datos insuficientes</strong></p><p>Se requieren al menos 2 periodos anuales para graficar tendencia.</p></div>';

  const vals=years.map(y=>({year:y,price:anual[y].precio_promedio_usd_m2,idx:anual[y].indice,var:anual[y].variacion_anual_pct}));
  const first=vals[0],last=vals[vals.length-1];
  const totalVar=first.price>0?((last.price-first.price)/first.price*100):0;
  const cagr=years.length>1?(Math.pow(last.price/first.price,1/(years.length-1))-1)*100:0;
  const maxP=Math.max(...vals.map(v=>v.price));
  const minP=Math.min(...vals.map(v=>v.price));

  const nSrc=1;
  const conf=_dmConf(years.length,nSrc,'lima',100,100);

  const chartH=180;
  const barW=Math.max(28,Math.min(50,Math.floor(600/(vals.length+1))));
  const chartW=vals.length*(barW+8)+20;
  const bars=vals.map((v,i)=>{
    const h=Math.max(6,Math.round(((v.price-minP*0.85)/(maxP*1.05-minP*0.85))*chartH));
    const clr=v.var>=0?'var(--blue)':'var(--amber)';
    const x=i*(barW+8)+10;
    return`<div style="position:absolute;bottom:0;left:${x}px;width:${barW}px;text-align:center">
      <div style="font-size:.58rem;font-weight:700;color:${clr};margin-bottom:2px">${v.var>=0?'+':''}${v.var.toFixed(1)}%</div>
      <div style="height:${h}px;background:${clr};border-radius:4px 4px 0 0;transition:opacity .2s;cursor:default" title="${v.year}: $${fmtNum(v.price)}/m² (${v.var>=0?'+':''}${v.var.toFixed(1)}%)"></div>
      <div style="font-size:.58rem;color:var(--txt-muted);margin-top:3px">${v.year}</div>
    </div>`;
  }).join('');

  const distKeys=Object.keys(bcrp.por_distrito_2025||{});
  const distSection=distKeys.length?`<div class="section-card" style="margin-bottom:20px">
    <div class="card-header"><h3>Precios por Distrito — BCRP 2025</h3><span style="font-size:.68rem;color:var(--txt-muted)">${distKeys.length} distritos · Mediana USD/m²</span></div>
    <div class="card-body no-pad" style="overflow-x:auto">
      <table class="data-table"><thead><tr><th>Distrito</th><th>Mediana USD/m²</th><th>P25</th><th>P75</th><th>Tx (18m)</th></tr></thead><tbody>
        ${distKeys.sort((a,b)=>(bcrp.por_distrito_2025[b].mediana_usd_m2||0)-(bcrp.por_distrito_2025[a].mediana_usd_m2||0)).map(dk=>{
          const dv=bcrp.por_distrito_2025[dk];
          return`<tr><td><strong>${esc(dk)}</strong></td><td style="font-weight:700">$${fmtNum(dv.mediana_usd_m2)}</td><td>$${fmtNum(dv.p25)}</td><td>$${fmtNum(dv.p75)}</td><td>${fmtNum(dv.tx_18m)}</td></tr>`;
        }).join('')}
      </tbody></table>
    </div>
  </div>`:'';

  return`
    <div class="kpi-grid" style="display:grid;grid-template-columns:repeat(auto-fit,minmax(155px,1fr));gap:14px;margin-bottom:20px">
      <div class="section-card"><div class="card-body" style="text-align:center;padding:16px 12px">
        <div style="font-size:1.8rem;font-weight:800;color:var(--blue)">$${fmtNum(last.price)}</div>
        <div style="font-size:.72rem;color:var(--txt-muted);font-weight:600">Precio Prom. ${last.year} (USD/m²)</div>
      </div></div>
      <div class="section-card"><div class="card-body" style="text-align:center;padding:16px 12px">
        <div style="font-size:1.8rem;font-weight:800;color:${last.var>=0?'var(--green)':'var(--red)'}">${last.var>=0?'+':''}${last.var.toFixed(1)}%</div>
        <div style="font-size:.72rem;color:var(--txt-muted);font-weight:600">Variación ${last.year}</div>
      </div></div>
      <div class="section-card"><div class="card-body" style="text-align:center;padding:16px 12px">
        <div style="font-size:1.8rem;font-weight:800;color:var(--amber)">${totalVar>=0?'+':''}${totalVar.toFixed(1)}%</div>
        <div style="font-size:.72rem;color:var(--txt-muted);font-weight:600">Var. Total ${first.year}–${last.year}</div>
      </div></div>
      <div class="section-card"><div class="card-body" style="text-align:center;padding:16px 12px">
        <div style="font-size:1.8rem;font-weight:800;color:var(--txt)">${cagr>=0?'+':''}${cagr.toFixed(1)}%</div>
        <div style="font-size:.72rem;color:var(--txt-muted);font-weight:600">CAGR Anual</div>
      </div></div>
    </div>

    <div class="section-card" style="margin-bottom:20px">
      <div class="card-header"><h3>${IC.trendUp||IC.chart||''} Evolución Precio Departamentos — Lima Metropolitana</h3><span style="font-size:.68rem;color:var(--txt-muted)">BCRP serie PN01289XM · ${first.year}–${last.year} · USD/m²</span></div>
      <div class="card-body" style="overflow-x:auto">
        <div style="position:relative;height:${chartH+50}px;min-width:${chartW}px">
          ${bars}
        </div>
        ${estKey?`<div style="margin-top:8px;font-size:.68rem;color:var(--txt-muted);font-style:italic">* ${estKey}: $${fmtNum(anual[estKey].precio_promedio_usd_m2)}/m² (estimado BCRP, ${anual[estKey].variacion_anual_pct>=0?'+':''}${anual[estKey].variacion_anual_pct}%)</div>`:''}
      </div>
    </div>

    <div class="section-card" style="margin-bottom:20px">
      <div class="card-header"><h3>Serie Anual Detallada</h3><span style="font-size:.68rem;color:var(--txt-muted)">Índice base 2009 = 100</span></div>
      <div class="card-body no-pad" style="overflow-x:auto">
        <table class="data-table"><thead><tr><th>Año</th><th>Precio USD/m²</th><th>Índice</th><th>Variación</th></tr></thead><tbody>
          ${vals.map(v=>{const vc=v.var>=0?'var(--green)':'var(--red)';return`<tr><td><strong>${v.year}</strong></td><td style="font-weight:700">$${fmtNum(v.price)}</td><td>${v.idx.toFixed(1)}</td><td style="color:${vc};font-weight:600">${v.var>=0?'+':''}${v.var.toFixed(1)}%</td></tr>`;}).join('')}
          ${(()=>{if(!estKey)return'';const ev=anual[estKey];const ec=ev.variacion_anual_pct>=0?'var(--green)':'var(--red)';return`<tr style="opacity:.7"><td><strong>${estKey}</strong> *</td><td style="font-weight:700">$${fmtNum(ev.precio_promedio_usd_m2)}</td><td>${ev.indice.toFixed(1)}</td><td style="color:${ec};font-weight:600">${ev.variacion_anual_pct>=0?'+':''}${ev.variacion_anual_pct}%</td></tr>`;})()}
        </tbody></table>
      </div>
    </div>

    ${distSection}

    <div style="font-size:.72rem;color:var(--txt-muted);margin-bottom:6px"><strong>Fuente:</strong> ${esc(bcrp.metadata?.fuente||'BCRP')} · Serie: ${esc(bcrp.metadata?.serie||'PN01289XM')} · ${esc(bcrp.metadata?.unidad||'USD/m²')}</div>
    <div style="font-size:.68rem;color:var(--txt-muted);font-style:italic;margin-bottom:12px">Datos oficiales del Banco Central. No mezclar con otras poblaciones (R-COMP-01).</div>
    ${_dmTrust(conf,nSrc,years.length,0,'Lima Metropolitana · BCRP')}`;
}

// ── I-03: Tasaciones Trend ──
function _dmRenderTendTas(){
  const tas=_marketData.tasFull;
  if(!tas?.distritos)return'<div class="dm-empty"><p><strong>Sin datos de Tasaciones</strong></p><p>No se encontró tasaciones_full.json.</p></div>';

  const limaDists={};
  for(const[dk,dv]of Object.entries(tas.distritos)){
    if(dv.departamento==='LIMA'&&dv.total_tasaciones>=20){
      limaDists[dk]=dv;
    }
  }
  const distKeys=Object.keys(limaDists).sort();
  if(!distKeys.length)return'<div class="dm-empty"><p><strong>Datos insuficientes</strong></p><p>No hay distritos de Lima con suficientes tasaciones para tendencia.</p></div>';

  // Aggregate Lima-wide trend by year
  const allYears={};
  for(const dv of Object.values(limaDists)){
    for(const[yr,yv]of Object.entries(dv.años||{})){
      if(!allYears[yr])allYears[yr]={meds:[],ns:0,totalN:0};
      if(yv.mediana_usd_m2>0&&yv.n_tasaciones>=5){
        allYears[yr].meds.push({med:yv.mediana_usd_m2,n:yv.n_tasaciones});
        allYears[yr].totalN+=yv.n_tasaciones;
      }
    }
  }

  const yearKeys=Object.keys(allYears).sort();
  const validYears=yearKeys.filter(y=>allYears[y].meds.length>=3&&allYears[y].totalN>=30);
  if(validYears.length<2)return'<div class="dm-empty"><p><strong>Datos insuficientes</strong></p><p>Se requieren al menos 2 periodos con muestra suficiente para graficar tendencia de tasaciones.</p></div>';

  const yearData=validYears.map(y=>{
    const d=allYears[y];
    const totalW=d.meds.reduce((s,m)=>s+m.n,0);
    const wMed=d.meds.reduce((s,m)=>s+m.med*m.n,0)/totalW;
    return{year:y,med:Math.round(wMed),n:d.totalN,nDist:d.meds.length};
  });

  for(let i=1;i<yearData.length;i++){
    yearData[i].var=yearData[i-1].med>0?((yearData[i].med-yearData[i-1].med)/yearData[i-1].med*100):null;
  }
  yearData[0].var=null;

  const first=yearData[0],last=yearData[yearData.length-1];
  const totalVar=first.med>0?((last.med-first.med)/first.med*100):0;
  const maxP=Math.max(...yearData.map(v=>v.med));
  const minP=Math.min(...yearData.map(v=>v.med));

  // District-level detail
  const distData=distKeys.map(dk=>{
    const dv=limaDists[dk];
    const yrs=Object.keys(dv.años||{}).sort();
    const latest=yrs.length?dv.años[yrs[yrs.length-1]]:null;
    const earliest=yrs.length?dv.años[yrs[0]]:null;
    const latestYr=yrs[yrs.length-1]||'';
    const nYrs=yrs.filter(y=>(dv.años[y].n_tasaciones||0)>=5).length;
    const varTotal=earliest&&latest&&earliest.mediana_usd_m2>0?((latest.mediana_usd_m2-earliest.mediana_usd_m2)/earliest.mediana_usd_m2*100):null;
    return{dist:dk,normDist:_dmND(dk,'tas'),total:dv.total_tasaciones,latest:latest?.mediana_usd_m2||0,latestYr,nYrs,varTotal,yrs};
  }).sort((a,b)=>b.total-a.total);

  const nSrc=1;
  const totalN=yearData.reduce((s,y)=>s+y.n,0);
  const conf=_dmConf(totalN,nSrc,'lima',80,90);

  const chartH=180;
  const barW=Math.max(36,Math.min(60,Math.floor(600/(yearData.length+1))));
  const chartW=yearData.length*(barW+10)+20;
  const bars=yearData.map((v,i)=>{
    const h=Math.max(6,Math.round(((v.med-minP*0.85)/(maxP*1.05-minP*0.85))*chartH));
    const x=i*(barW+10)+10;
    const clr=v.var!==null?(v.var>=0?'var(--purple)':'var(--amber)'):'var(--purple)';
    return`<div style="position:absolute;bottom:0;left:${x}px;width:${barW}px;text-align:center">
      ${v.var!==null?`<div style="font-size:.58rem;font-weight:700;color:${clr};margin-bottom:2px">${v.var>=0?'+':''}${v.var.toFixed(1)}%</div>`:'<div style="height:14px"></div>'}
      <div style="height:${h}px;background:var(--purple);border-radius:4px 4px 0 0;opacity:.85;cursor:default" title="${v.year}: $${fmtNum(v.med)}/m² · n=${fmtNum(v.n)} · ${v.nDist} dist."></div>
      <div style="font-size:.58rem;color:var(--txt-muted);margin-top:3px">${v.year}</div>
    </div>`;
  }).join('');

  // Temporal gaps
  const gapYears=[];
  for(let i=1;i<validYears.length;i++){
    const diff=parseInt(validYears[i])-parseInt(validYears[i-1]);
    if(diff>1){for(let g=1;g<diff;g++)gapYears.push(String(parseInt(validYears[i-1])+g));}
  }

  return`
    <div class="kpi-grid" style="display:grid;grid-template-columns:repeat(auto-fit,minmax(155px,1fr));gap:14px;margin-bottom:20px">
      <div class="section-card"><div class="card-body" style="text-align:center;padding:16px 12px">
        <div style="font-size:1.8rem;font-weight:800;color:var(--purple)">$${fmtNum(last.med)}</div>
        <div style="font-size:.72rem;color:var(--txt-muted);font-weight:600">Mediana Pond. ${last.year}</div>
        <div style="margin-top:6px">${_dmSBadge(last.n)}</div>
      </div></div>
      <div class="section-card"><div class="card-body" style="text-align:center;padding:16px 12px">
        <div style="font-size:1.8rem;font-weight:800;color:${totalVar>=0?'var(--green)':'var(--red)'}">${totalVar>=0?'+':''}${totalVar.toFixed(1)}%</div>
        <div style="font-size:.72rem;color:var(--txt-muted);font-weight:600">Var. ${first.year}–${last.year}</div>
      </div></div>
      <div class="section-card"><div class="card-body" style="text-align:center;padding:16px 12px">
        <div style="font-size:1.8rem;font-weight:800;color:var(--txt)">${fmtNum(totalN)}</div>
        <div style="font-size:.72rem;color:var(--txt-muted);font-weight:600">Tasaciones Totales</div>
      </div></div>
      <div class="section-card"><div class="card-body" style="text-align:center;padding:16px 12px">
        <div style="font-size:1.8rem;font-weight:800;color:var(--txt)">${distKeys.length}</div>
        <div style="font-size:.72rem;color:var(--txt-muted);font-weight:600">Distritos Lima</div>
      </div></div>
    </div>

    <div class="section-card" style="margin-bottom:20px">
      <div class="card-header"><h3>${IC.chart||''} Tendencia Tasaciones — Lima Metropolitana</h3><span style="font-size:.68rem;color:var(--txt-muted)">${first.year}–${last.year} · Mediana ponderada USD/m²</span></div>
      <div class="card-body" style="overflow-x:auto">
        <div style="position:relative;height:${chartH+50}px;min-width:${chartW}px">
          ${bars}
        </div>
        ${gapYears.length?'<div style="margin-top:8px;font-size:.68rem;color:var(--amber);font-style:italic">Gaps temporales: '+gapYears.join(', ')+' — sin muestra suficiente, no se interpoló.</div>':''}
      </div>
    </div>

    <div class="section-card" style="margin-bottom:20px">
      <div class="card-header"><h3>Serie Anual Detallada</h3><span style="font-size:.68rem;color:var(--txt-muted)">Mediana ponderada por muestra distrital</span></div>
      <div class="card-body no-pad" style="overflow-x:auto">
        <table class="data-table"><thead><tr><th>Año</th><th>Mediana USD/m²</th><th>Tasaciones</th><th>Distritos</th><th>Variación</th></tr></thead><tbody>
          ${yearData.map(v=>{const vc=v.var!==null?(v.var>=0?'var(--green)':'var(--red)'):'';return`<tr><td><strong>${v.year}</strong></td><td style="font-weight:700">$${fmtNum(v.med)}</td><td>${fmtNum(v.n)}</td><td>${v.nDist}</td><td>${v.var!==null?'<span style="color:'+vc+';font-weight:600">'+(v.var>=0?'+':'')+v.var.toFixed(1)+'%</span>':'—'}</td></tr>`;}).join('')}
        </tbody></table>
      </div>
    </div>

    <div class="section-card" style="margin-bottom:20px">
      <div class="card-header"><h3>Cobertura por Distrito</h3><span style="font-size:.68rem;color:var(--txt-muted)">${distData.length} distritos con ≥20 tasaciones</span></div>
      <div class="card-body no-pad" style="overflow-x:auto;max-height:400px;overflow-y:auto">
        <table class="data-table"><thead><tr><th>Distrito</th><th>Total</th><th>Última Med.</th><th>Año</th><th>Periodos</th><th>Var. Total</th></tr></thead><tbody>
          ${distData.map(d=>{const dc=d.varTotal!==null?(d.varTotal>=0?'var(--green)':'var(--red)'):'';return`<tr><td><strong>${esc(d.normDist||d.dist)}</strong></td><td>${fmtNum(d.total)}</td><td style="font-weight:700">${d.latest?'$'+fmtNum(d.latest):'—'}</td><td>${d.latestYr}</td><td>${d.nYrs}</td><td>${d.varTotal!==null?'<span style="color:'+dc+';font-weight:600">'+(d.varTotal>=0?'+':'')+d.varTotal.toFixed(1)+'%</span>':'—'}</td></tr>`;}).join('')}
        </tbody></table>
      </div>
    </div>

    <div style="font-size:.72rem;color:var(--txt-muted);margin-bottom:6px"><strong>Fuente:</strong> ${esc(tas.metadata?.fuente||'Tasaciones')} · Periodo: ${esc(tas.metadata?.periodo||'')} · ${fmtNum(tas.metadata?.total_registros_con_valor_unitario||0)} registros con valor unitario</div>
    <div style="font-size:.68rem;color:var(--txt-muted);font-style:italic;margin-bottom:12px">Valores de tasación representan valor referencial de mercado. No mezclar con precios de oferta (R-COMP-01). Periodos sin muestra suficiente omitidos (sin interpolación).</div>
    ${_dmTrust(conf,nSrc,totalN,0,'Lima Metropolitana · Tasaciones')}`;
}

// ── I-05: Valuation Gap ──
function _dmRenderGap(){
  if(!_dmDist){_dmView='distrito';return _dmRenderDistrito();}

  const props=_pubs.filter(p=>p.op==='Venta'&&p.district===_dmDist&&p.cur==='$'&&p.price>0&&p.area>0)
    .map(p=>({id:p.id,address:p.address||p.desc||'Sin dirección',type:p.type||'Otro',price:p.price,area:p.area,ppm2:p.price/p.area,beds:p.beds||0}))
    .sort((a,b)=>a.ppm2-b.ppm2);
  if(!props.length)return'<div class="dm-empty"><p>No hay propiedades en '+esc(_dmDist)+' para analizar brecha.</p></div>';

  const selId=_dmPropId||props[0].id;
  const prop=props.find(p=>p.id===selId)||props[0];

  // Build benchmark from I-02 district data (reuse same logic)
  let vDist=_pubs.filter(p=>p.op==='Venta'&&p.district===_dmDist&&p.cur==='$'&&p.price>0&&p.area>0);
  const sameType=vDist.filter(p=>p.type===prop.type);
  const useType=sameType.length>=10;
  const benchPop=useType?sameType:vDist;
  const rawPm2=benchPop.map(p=>p.price/p.area);
  const pm2=_dmClean(rawPm2);
  const n=pm2.length;

  const propSel=`<div class="filter-bar" style="margin-bottom:20px">
    <select onchange="_dmNav('gap',undefined,undefined,this.value)" style="padding:6px 12px;border:1px solid var(--border);border-radius:var(--r);font-size:.82rem;background:var(--bg-card);color:var(--txt);max-width:500px">
      ${props.map(p=>`<option value="${esc(p.id)}"${p.id===selId?' selected':''}>${esc(truncate(p.address,40))} — $${fmtNum(Math.round(p.ppm2))}/m²</option>`).join('')}
    </select>
  </div>`;

  if(n<10){
    return propSel+`<div class="section-card"><div class="card-body"><div class="dm-empty">
      <p><strong>Datos insuficientes</strong></p>
      <p>Se requieren al menos 10 propiedades comparables para calcular brecha de valoración en ${esc(_dmDist)}.</p>
      <p style="margin-top:8px">${_dmSBadge(n)}</p>
    </div></div></div>`;
  }

  const med=_mktMedian(pm2);
  const p25=_mktPct(pm2,.25),p75=_mktPct(pm2,.75);
  const ppm2=prop.ppm2;
  const diffAbs=ppm2-med;
  const diffPct=med>0?((ppm2-med)/med*100):0;

  // Percentile
  const sorted=[...pm2].sort((a,b)=>a-b);
  let rank=0;
  for(let i=0;i<sorted.length;i++){if(sorted[i]<=ppm2)rank=i+1;}
  const pctile=Math.round((rank/sorted.length)*100);

  // Gather reference benchmarks from other sources
  const refs=[];
  refs.push({label:'Oferta Reco (I-02)',val:med,n:n,source:'Asking prices',color:'var(--blue)'});

  // Tasaciones reference
  const tas=_marketData.tasFull;
  let tasMed=null,tasYr='',tasN=0;
  if(tas?.distritos){
    for(const[tk,tv]of Object.entries(tas.distritos)){
      if(_dmND(tk,'tas')===_dmDist){
        const yrs=Object.keys(tv.años||{}).sort();
        const lat=yrs.length?tv.años[yrs[yrs.length-1]]:null;
        if(lat&&lat.mediana_usd_m2&&lat.n_tasaciones>=10){
          tasMed=lat.mediana_usd_m2;tasYr=yrs[yrs.length-1];tasN=lat.n_tasaciones;
          refs.push({label:'Tasación '+tasYr,val:tasMed,n:tasN,source:'Valor referencial',color:'var(--purple)'});
        }
        break;
      }
    }
  }

  // BCRP reference
  let bcrpMed=null;
  if(_marketData.bcrp?.por_distrito_2025){
    for(const[bk,bv]of Object.entries(_marketData.bcrp.por_distrito_2025)){
      if(_dmND(bk,'bcrp')===_dmDist){
        bcrpMed=bv.mediana_usd_m2;
        refs.push({label:'BCRP 2025',val:bcrpMed,n:null,source:'Mediana departamental',color:'var(--green)'});
        break;
      }
    }
  }

  const nSrc=refs.length;
  const qPct=rawPm2.length?(pm2.length/rawPm2.length*100):0;
  const conf=_dmConf(n,nSrc,'distrito',90,qPct);

  // Gap summary for each reference
  const gapRows=refs.map(r=>{
    const gap=ppm2-r.val;
    const gapPct=r.val>0?((ppm2-r.val)/r.val*100):0;
    return{...r,gap,gapPct};
  });

  // Position label (statistical, never evaluative)
  let posLabel,posClr;
  if(Math.abs(diffPct)<=5){posLabel='Dentro del rango de referencia del mercado';posClr='var(--green)';}
  else if(diffPct>20){posLabel='Significativamente por encima de la referencia';posClr='var(--amber)';}
  else if(diffPct>5){posLabel='Por encima de la referencia del mercado';posClr='var(--amber)';}
  else if(diffPct<-20){posLabel='Significativamente por debajo de la referencia';posClr='var(--blue)';}
  else{posLabel='Por debajo de la referencia del mercado';posClr='var(--blue)';}

  // Gauge for gap
  const gaugeMin=Math.max(0,Math.min(...refs.map(r=>r.val),ppm2)*0.8);
  const gaugeMax=Math.max(...refs.map(r=>r.val),ppm2)*1.15;
  const gaugeRange=gaugeMax-gaugeMin;
  const propPos=Math.max(0,Math.min(100,((ppm2-gaugeMin)/gaugeRange)*100));
  const medPos=((med-gaugeMin)/gaugeRange)*100;

  return propSel+`
    <div class="section-card" style="margin-bottom:20px">
      <div class="card-header"><h3>Propiedad Analizada</h3></div>
      <div class="card-body">
        <div style="display:grid;grid-template-columns:1fr auto;gap:20px;align-items:center">
          <div>
            <div style="font-weight:700;font-size:1rem">${esc(prop.address)}</div>
            <div style="color:var(--txt-muted);font-size:.82rem;margin-top:4px">${esc(prop.type)} · ${prop.beds?prop.beds+' dorm · ':''}${fmtNum(Math.round(prop.area))} m² · $${fmtNum(prop.price)}</div>
          </div>
          <div style="text-align:right">
            <div style="font-size:2rem;font-weight:800;color:${posClr}">$${fmtNum(Math.round(ppm2))}</div>
            <div style="font-size:.72rem;color:var(--txt-muted);font-weight:600">USD/m²</div>
          </div>
        </div>
      </div>
    </div>

    <div class="section-card" style="margin-bottom:20px">
      <div class="card-header"><h3>Brecha de Valoración</h3><span style="font-size:.68rem;color:var(--txt-muted)">${esc(_dmDist)} · ${useType?esc(prop.type):'Todos los tipos'} · Percentil ${pctile}</span></div>
      <div class="card-body">
        <div style="text-align:center;margin-bottom:16px">
          <div style="font-size:1.4rem;font-weight:800;color:${posClr}">${diffPct>=0?'+':''}${diffPct.toFixed(1)}%</div>
          <div style="font-size:.78rem;color:var(--txt-muted);margin-top:2px">vs. mediana de oferta del distrito</div>
          <div style="font-size:.88rem;color:${posClr};margin-top:8px;font-weight:600">${esc(posLabel)}</div>
        </div>

        <div class="dm-gauge">
          <div class="dm-gauge-bg" style="position:relative">
            ${refs.map(r=>{
              const pos=((r.val-gaugeMin)/gaugeRange)*100;
              return'<div style="position:absolute;left:'+pos.toFixed(1)+'%;top:0;width:2px;height:100%;background:'+r.color+';opacity:.6" title="'+esc(r.label)+': $'+fmtNum(Math.round(r.val))+'"></div>';
            }).join('')}
          </div>
          <div class="dm-gauge-mk" style="left:${propPos}%" title="Precio observado"></div>
          <div class="dm-gauge-lbl" style="left:${propPos}%;color:${posClr}">$${fmtNum(Math.round(ppm2))}</div>
        </div>
        <div style="display:flex;justify-content:space-between;font-size:.68rem;color:var(--txt-muted);margin-top:4px">
          <span>$${fmtNum(Math.round(gaugeMin))}</span>
          <span>$${fmtNum(Math.round(gaugeMax))}</span>
        </div>
      </div>
    </div>

    <div class="section-card" style="margin-bottom:20px">
      <div class="card-header"><h3>Comparativa con Referencias (R-CROSS-01)</h3><span style="font-size:.68rem;color:var(--txt-muted)">Diferencia entre precio observado y cada fuente</span></div>
      <div class="card-body no-pad" style="overflow-x:auto">
        <table class="data-table"><thead><tr><th>Referencia</th><th>Valor Ref.</th><th>Precio Obs.</th><th>Diferencia</th><th>%</th><th>Fuente</th></tr></thead><tbody>
          ${gapRows.map(r=>{
            const clr=r.gapPct>=0?'var(--amber)':'var(--blue)';
            return`<tr><td><strong style="color:${r.color}">${esc(r.label)}</strong></td><td style="font-weight:700">$${fmtNum(Math.round(r.val))}</td><td>$${fmtNum(Math.round(ppm2))}</td><td style="font-weight:700;color:${clr}">${r.gap>=0?'+':''}$${fmtNum(Math.abs(Math.round(r.gap)))}</td><td style="font-weight:700;color:${clr}">${r.gapPct>=0?'+':''}${r.gapPct.toFixed(1)}%</td><td style="font-size:.72rem;color:var(--txt-muted)">${esc(r.source)}${r.n?' · n='+fmtNum(r.n):''}</td></tr>`;
          }).join('')}
        </tbody></table>
      </div>
    </div>

    <div style="margin-bottom:20px;padding:14px;background:var(--bg);border-radius:var(--r);font-size:.78rem;border-left:3px solid ${posClr}">
      <strong>Explicación estadística:</strong> El precio observado de esta propiedad ($${fmtNum(Math.round(ppm2))}/m²) se sitúa en el <strong>percentil ${pctile}</strong>${useType?' entre propiedades tipo '+esc(prop.type):''} en ${esc(_dmDist)}, con una diferencia de <strong>${diffPct>=0?'+':''}${diffPct.toFixed(1)}%</strong> respecto a la mediana de oferta del distrito ($${fmtNum(Math.round(med))}/m²).
      ${tasMed!==null?' La referencia de tasaciones ('+tasYr+') para este distrito es $'+fmtNum(Math.round(tasMed))+'/m², diferencia de '+(ppm2-tasMed>=0?'+':'')+((ppm2-tasMed)/tasMed*100).toFixed(1)+'%.':''}
      ${bcrpMed!==null?' El BCRP reporta $'+fmtNum(Math.round(bcrpMed))+'/m² para este distrito.':''}
      ${n>=30?' La muestra es estadísticamente confiable (n='+n+').':' La muestra es indicativa (n='+n+'); interpretar con cautela.'}
      <div style="margin-top:8px;font-style:italic;color:var(--txt-muted)">Cada fuente refleja una población diferente (R-COMP-01). Las diferencias no implican valoración correcta o incorrecta; son posiciones relativas respecto a cada referencia.</div>
    </div>

    ${_dmTrust(conf,nSrc,n,rawPm2.length-pm2.length,_dmDist+(useType?' · '+prop.type:''))}`;
}

// ── I-07: Ratio Market / Arancelario ──
function _dmRenderRatio(){
  const mef=_marketData.mef;
  if(!mef?.lima_zonas)return'<div class="dm-empty"><p><strong>Sin datos arancelarios</strong></p><p>No se encontraron datos de valores arancelarios MEF.</p></div>';

  // Group arancelario zones by district
  const aranByDist={};
  for(const[k,v]of Object.entries(mef.lima_zonas)){
    if(!aranByDist[v.distrito])aranByDist[v.distrito]={zones:[],vals:[]};
    aranByDist[v.distrito].zones.push({key:k,val:v.valor_usd_m2,uso:v.uso,zona:v.zona_arancel});
    aranByDist[v.distrito].vals.push(v.valor_usd_m2);
  }

  // Calculate ratio for each district with governance
  const rows=[];
  const insufficient=[];
  for(const[dist,aran]of Object.entries(aranByDist)){
    const dProps=_pubs.filter(p=>p.op==='Venta'&&p.district===dist&&p.cur==='$'&&p.price>0&&p.area>0);
    const rawPm2=dProps.map(p=>p.price/p.area);
    const pm2=_dmClean(rawPm2);
    const n=pm2.length;
    if(n<10){insufficient.push({dist,n,rawN:rawPm2.length});continue;}

    const mktMed=_mktMedian(pm2);
    const aranMed=_mktMedian(aran.vals);
    if(aranMed<=0)continue;
    const ratio=mktMed/aranMed;
    const diffAbs=mktMed-aranMed;
    const diffPct=(diffAbs/aranMed)*100;
    const p25=_mktPct(pm2,.25),p75=_mktPct(pm2,.75);
    const iqr=p75-p25;
    const disp=mktMed>0?(iqr/mktMed*100):0;
    const nSrc=2;
    const qPct=rawPm2.length?(pm2.length/rawPm2.length*100):0;
    const conf=_dmConf(n,nSrc,'distrito',90,qPct);
    rows.push({dist,n,rawN:rawPm2.length,mktMed,aranMed,ratio,diffAbs,diffPct,p25,p75,disp,conf,zones:aran.zones,outliers:rawPm2.length-pm2.length});
  }
  rows.sort((a,b)=>b.ratio-a.ratio);

  if(!rows.length)return'<div class="dm-empty"><p><strong>Datos insuficientes</strong></p><p>Ningún distrito cumple los requisitos mínimos de muestra (n≥10) para calcular el ratio.</p></div>';

  const avgRatio=rows.reduce((s,r)=>s+r.ratio,0)/rows.length;
  const maxRatio=rows[0];
  const minRatio=rows[rows.length-1];
  const totalN=rows.reduce((s,r)=>s+r.n,0);

  const overallConf=_dmConf(totalN,2,'lima',90,90);

  // Ratio category (descriptive, not evaluative)
  const ratioLabel=(r)=>{
    if(r>=3)return{label:'Mercado >3x arancelario',clr:'var(--red)'};
    if(r>=2)return{label:'Mercado 2-3x arancelario',clr:'var(--amber)'};
    if(r>=1.5)return{label:'Mercado 1.5-2x arancelario',clr:'var(--amber2,var(--amber))'};
    if(r>=1)return{label:'Mercado cercano al arancelario',clr:'var(--green)'};
    return{label:'Mercado por debajo del arancelario',clr:'var(--blue)'};
  };

  // Ranking chart
  const maxR=Math.max(...rows.map(r=>r.ratio));
  const rankBars=rows.map(r=>{
    const rl=ratioLabel(r.ratio);
    const w=Math.max(8,Math.round((r.ratio/maxR)*100));
    return`<div class="stat-row" style="cursor:pointer" onclick="_dmNav('distrito','${esc(r.dist).replace(/'/g,"\\'")}')">
      <div class="stat-label" style="min-width:130px" title="${esc(r.dist)}">${esc(r.dist.length>18?r.dist.slice(0,16)+'…':r.dist)}</div>
      <div class="stat-bar-track"><div class="stat-bar-fill" style="width:${w}%;background:${rl.clr}"></div></div>
      <div class="stat-val" style="min-width:50px;font-weight:700">${r.ratio.toFixed(2)}x</div>
    </div>`;
  }).join('');

  return`
    <div class="kpi-grid" style="display:grid;grid-template-columns:repeat(auto-fit,minmax(165px,1fr));gap:14px;margin-bottom:20px">
      <div class="section-card"><div class="card-body" style="text-align:center;padding:16px 12px">
        <div style="font-size:1.8rem;font-weight:800;color:var(--amber)">${avgRatio.toFixed(2)}x</div>
        <div style="font-size:.72rem;color:var(--txt-muted);font-weight:600">Ratio Promedio</div>
        <div style="font-size:.66rem;color:var(--txt-muted);margin-top:4px">Mercado / Arancelario</div>
      </div></div>
      <div class="section-card"><div class="card-body" style="text-align:center;padding:16px 12px">
        <div style="font-size:1.8rem;font-weight:800;color:var(--red)">${maxRatio.ratio.toFixed(2)}x</div>
        <div style="font-size:.72rem;color:var(--txt-muted);font-weight:600">Ratio Máximo</div>
        <div style="font-size:.66rem;color:var(--txt-muted);margin-top:4px">${esc(maxRatio.dist)}</div>
      </div></div>
      <div class="section-card"><div class="card-body" style="text-align:center;padding:16px 12px">
        <div style="font-size:1.8rem;font-weight:800;color:var(--green)">${minRatio.ratio.toFixed(2)}x</div>
        <div style="font-size:.72rem;color:var(--txt-muted);font-weight:600">Ratio Mínimo</div>
        <div style="font-size:.66rem;color:var(--txt-muted);margin-top:4px">${esc(minRatio.dist)}</div>
      </div></div>
      <div class="section-card"><div class="card-body" style="text-align:center;padding:16px 12px">
        <div style="font-size:1.8rem;font-weight:800;color:var(--txt)">${rows.length}/${rows.length+insufficient.length}</div>
        <div style="font-size:.72rem;color:var(--txt-muted);font-weight:600">Distritos Disponibles</div>
        <div style="margin-top:6px">${_dmSBadge(totalN)}</div>
      </div></div>
    </div>

    <div class="section-card" style="margin-bottom:20px">
      <div class="card-header"><h3>${IC.chart||''} Ranking Ratio Mercado / Arancelario</h3><span style="font-size:.68rem;color:var(--txt-muted)">${rows.length} distritos · Valor de oferta / valor arancelario MEF 2025</span></div>
      <div class="card-body">
        ${rankBars}
      </div>
    </div>

    <div class="section-card" style="margin-bottom:20px">
      <div class="card-header"><h3>Detalle por Distrito</h3><span style="font-size:.68rem;color:var(--txt-muted)">Ratio = Mediana oferta USD/m² / Mediana arancelario USD/m²</span></div>
      <div class="card-body no-pad" style="overflow-x:auto">
        <table class="data-table"><thead><tr><th>Distrito</th><th>Mercado (med.)</th><th>Arancelario (med.)</th><th>Ratio</th><th>Diferencia</th><th>n</th><th>Confianza</th></tr></thead><tbody>
          ${rows.map(r=>{const rl=ratioLabel(r.ratio);return`<tr style="cursor:pointer" onclick="_dmNav('distrito','${esc(r.dist).replace(/'/g,"\\'")}')">
            <td><strong>${esc(r.dist)}</strong></td>
            <td style="font-weight:700">$${fmtNum(Math.round(r.mktMed))}</td>
            <td>$${fmtNum(Math.round(r.aranMed))}</td>
            <td style="font-weight:800;color:${rl.clr}">${r.ratio.toFixed(2)}x</td>
            <td style="color:${r.diffPct>=0?'var(--amber)':'var(--blue)'};font-weight:600">${r.diffPct>=0?'+':''}${r.diffPct.toFixed(0)}%</td>
            <td>${_dmSBadge(r.n)}</td>
            <td>${_dmCBadge(r.conf)}</td>
          </tr>`;}).join('')}
        </tbody></table>
      </div>
    </div>

    ${rows.length>=3?`<div class="section-card" style="margin-bottom:20px">
      <div class="card-header"><h3>Zonas Arancelarias por Distrito</h3><span style="font-size:.68rem;color:var(--txt-muted)">Detalle de zonas MEF utilizadas en el cálculo</span></div>
      <div class="card-body no-pad" style="overflow-x:auto;max-height:400px;overflow-y:auto">
        <table class="data-table"><thead><tr><th>Distrito</th><th>Zona</th><th>Arancel.</th><th>Uso</th><th>Zona MEF</th></tr></thead><tbody>
          ${rows.map(r=>r.zones.map(z=>'<tr><td><strong>'+esc(r.dist)+'</strong></td><td>'+esc(z.key.replace(/_/g,' '))+'</td><td style="font-weight:700">$'+fmtNum(z.val)+'</td><td style="font-size:.72rem;color:var(--txt-muted)">'+esc(z.uso)+'</td><td>'+esc(z.zona)+'</td></tr>').join('')).join('')}
        </tbody></table>
      </div>
    </div>`:''}

    ${insufficient.length?`<div class="section-card" style="margin-bottom:20px">
      <div class="card-header"><h3>Distritos No Disponibles</h3><span style="font-size:.68rem;color:var(--txt-muted)">${insufficient.length} distritos con muestra insuficiente (n<10)</span></div>
      <div class="card-body no-pad" style="overflow-x:auto">
        <table class="data-table"><thead><tr><th>Distrito</th><th>Propiedades</th><th>Estado</th></tr></thead><tbody>
          ${insufficient.sort((a,b)=>b.n-a.n).map(r=>'<tr><td>'+esc(r.dist)+'</td><td>'+r.rawN+'</td><td>'+_dmSBadge(r.n)+'</td></tr>').join('')}
        </tbody></table>
      </div>
    </div>`:''}

    <div style="margin-bottom:20px;padding:14px;background:var(--bg);border-radius:var(--r);font-size:.78rem;border-left:3px solid var(--amber)">
      <strong>Metodología:</strong> El ratio se calcula como Mediana de oferta USD/m² (fuente: publicaciones Reco) dividido por Mediana de valor arancelario USD/m² (fuente: MEF RM N°255-2025-EF/15, vigencia 2025). Cada fuente representa una población diferente: los valores arancelarios son valores de referencia oficiales para autoavalúo, mientras que los precios de oferta son asking prices del mercado (R-CROSS-02). El ratio describe cuántas veces el valor observado de mercado representa respecto al valor arancelario oficial. Se aplicó remoción de outliers por IQR y un mínimo de 10 registros por distrito.
      <div style="margin-top:8px;font-style:italic;color:var(--txt-muted)">Nota B2B: Los ratios con mayor diferencia sugieren zonas donde los valores oficiales están más desactualizados respecto al mercado. No implica valoración correcta o incorrecta de ninguna fuente.</div>
    </div>

    <div style="font-size:.72rem;color:var(--txt-muted);margin-bottom:6px"><strong>Fuente arancelario:</strong> ${esc(mef.metadata?.fuente||'MEF')} · ${esc(mef.metadata?.resolucion||'')} · Vigencia: ${esc(mef.metadata?.vigencia||'')}</div>
    <div style="font-size:.72rem;color:var(--txt-muted);margin-bottom:6px"><strong>Fuente mercado:</strong> Publicaciones Reco · Tipo: asking prices · Moneda: USD/m² · TC ref: ${mef.metadata?.tipo_cambio_ref||'N/A'}</div>
    <div style="font-size:.68rem;color:var(--txt-muted);font-style:italic;margin-bottom:12px">I-10 Propiedades Similares → V2 (pendiente). Comparable Finder no implementado en este sprint.</div>
    ${_dmTrust(overallConf,2,totalN,rows.reduce((s,r)=>s+r.outliers,0),'Lima Metropolitana · Ratio Market/Arancelario')}`;
}

// MARKET DATA (Admin Raw — preserved original)
// ═══════════════════════════════════════════════════════════════
let _marketTab='resumen';
let _mktFilters={tipo:'',distrito:'',departamento:''};

function _mktMedian(arr){if(!arr.length)return 0;const s=[...arr].sort((a,b)=>a-b);const m=Math.floor(s.length/2);return s.length%2?s[m]:(s[m-1]+s[m])/2;}

function _mktPct(arr,p){if(!arr.length)return 0;const s=[...arr].sort((a,b)=>a-b);const i=Math.floor(s.length*p);return s[Math.min(i,s.length-1)];}

function _mktSetFilter(key,val){_mktFilters[key]=val;renderMarket(document.getElementById('mainContent'));}

function _mktFilterBar(opts){
  const tipos=(opts.tipos||[]).sort();
  const distritos=(opts.distritos||[]).sort();
  const departamentos=(opts.departamentos||[]).sort();
  const parts=[];
  if(tipos.length>1)parts.push(`<select onchange="_mktSetFilter('tipo',this.value)" style="padding:6px 10px;border:1px solid var(--border);border-radius:var(--r);font-size:.78rem;background:var(--bg-card);color:var(--txt)"><option value="">Todos los tipos</option>${tipos.map(t=>`<option value="${esc(t)}"${_mktFilters.tipo===t?' selected':''}>${esc(t)}</option>`).join('')}</select>`);
  if(departamentos.length>1)parts.push(`<select onchange="_mktSetFilter('departamento',this.value)" style="padding:6px 10px;border:1px solid var(--border);border-radius:var(--r);font-size:.78rem;background:var(--bg-card);color:var(--txt)"><option value="">Todos los departamentos</option>${departamentos.map(d=>`<option value="${esc(d)}"${_mktFilters.departamento===d?' selected':''}>${esc(d)}</option>`).join('')}</select>`);
  if(distritos.length>1){
    const filtered=_mktFilters.departamento?distritos.filter(d=>(opts.distDept||{})[d]===_mktFilters.departamento):distritos;
    parts.push(`<select onchange="_mktSetFilter('distrito',this.value)" style="padding:6px 10px;border:1px solid var(--border);border-radius:var(--r);font-size:.78rem;background:var(--bg-card);color:var(--txt)"><option value="">Todos los distritos</option>${filtered.map(d=>`<option value="${esc(d)}"${_mktFilters.distrito===d?' selected':''}>${esc(d)}</option>`).join('')}</select>`);
  }
  const hasFilter=_mktFilters.tipo||_mktFilters.distrito||_mktFilters.departamento;
  if(hasFilter)parts.push(`<button onclick="_mktFilters={tipo:'',distrito:'',departamento:''};renderMarket(document.getElementById('mainContent'))" class="btn btn-outline btn-sm" style="font-size:.72rem">Limpiar filtros</button>`);
  if(!parts.length)return'';
  return`<div class="filter-bar" style="display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px">${parts.join('')}${opts.countLabel?`<span style="margin-left:auto;font-size:.72rem;color:var(--txt-muted);align-self:center">${opts.countLabel}</span>`:''}</div>`;
}

function _mktApplyFilters(items,getType,getDist,getDept){
  let r=items;
  if(_mktFilters.tipo)r=r.filter(x=>getType(x)===_mktFilters.tipo);
  if(_mktFilters.departamento)r=r.filter(x=>getDept(x)===_mktFilters.departamento);
  if(_mktFilters.distrito)r=r.filter(x=>getDist(x)===_mktFilters.distrito);
  return r;
}

function computeMarketAnalytics(){
  const ventas=_pubs.filter(p=>p.op==='Venta');
  const alquileres=_pubs.filter(p=>p.op==='Alquiler');
  const hist=_historicos;
  const d=_marketData;
  const tasFull=d.tasFull;
  const tas=tasFull||d.tasaciones;
  const bcrp=d.bcrp;
  const histMarket=d.histMarket;

  const ventasUsd=ventas.filter(p=>p.cur==='$'&&p.price>0);
  const ventasArea=ventasUsd.filter(p=>p.area>0);
  const ventasPpm2=ventasArea.map(p=>p.price/p.area).filter(v=>v>10&&v<50000);

  const alqUsd=alquileres.filter(p=>p.cur==='$'&&p.price>0&&p.price<20000);
  const alqPen=alquileres.filter(p=>p.cur==='S/'&&p.price>0&&p.price<50000);

  const byDistrict={};
  ventasUsd.forEach(p=>{const dd=p.district||'Otro';if(!byDistrict[dd])byDistrict[dd]={ventas:[],alq:[],ppm2:[],count:0};byDistrict[dd].ventas.push(p.price);byDistrict[dd].count++;if(p.area>0){const pm=p.price/p.area;if(pm>10&&pm<50000)byDistrict[dd].ppm2.push(pm);}});
  alqUsd.forEach(p=>{const dd=p.district||'Otro';if(!byDistrict[dd])byDistrict[dd]={ventas:[],alq:[],ppm2:[],count:0};byDistrict[dd].alq.push(p.price);});

  const byType={};
  ventas.forEach(p=>{const t=p.type||'Otro';byType[t]=(byType[t]||0)+1;});

  const byBeds={};
  ventas.filter(p=>p.beds>0&&p.beds<=6).forEach(p=>{const b=p.beds>=5?'5+':String(p.beds);byBeds[b]=(byBeds[b]||0)+1;});

  let totalTas=0,totalDistritos=0;
  const tasDistData=[];
  if(tas&&tas.distritos){
    const distNames=Object.keys(tas.distritos);
    totalDistritos=distNames.length;
    distNames.forEach(name=>{
      const dd=tas.distritos[name];
      const yrs=Object.keys(dd.años||{}).sort();
      const total=dd.total_tasaciones||0;
      totalTas+=total;
      const latestYr=yrs[yrs.length-1]||'';
      const latest=latestYr?(dd.años||{})[latestYr]:null;
      const prevYrs=yrs.filter(y=>y<latestYr);
      const prevYr=prevYrs[prevYrs.length-1]||'';
      const prev=prevYr?(dd.años||{})[prevYr]:null;
      tasDistData.push({name,dep:dd.departamento||'',total,latestYr,latest,prevYr,prev,years:yrs});
    });
  }

  const histData=histMarket?.historicos||[];
  const histWithPm2=histData.filter(h=>h.precio_m2_usd>0);
  const histByDistrict={};
  const histByYear={};
  const histByType={};
  histData.forEach(h=>{
    const dd=h.distrito||'Otro';
    if(!histByDistrict[dd])histByDistrict[dd]={count:0,pm2:[],prices:[],dept:h.departamento};
    histByDistrict[dd].count++;
    if(h.precio_m2_usd>0)histByDistrict[dd].pm2.push(h.precio_m2_usd);
    if(h.precio_prop_usd>0)histByDistrict[dd].prices.push(h.precio_prop_usd);
    const ym=(h.fecha_venta||'').match(/(\d{4})/);
    const yr=ym?ym[1]:'?';
    if(!histByYear[yr])histByYear[yr]={count:0,pm2:[],prices:[]};
    histByYear[yr].count++;
    if(h.precio_m2_usd>0)histByYear[yr].pm2.push(h.precio_m2_usd);
    if(h.precio_prop_usd>0)histByYear[yr].prices.push(h.precio_prop_usd);
    const t=h.tipo||'Otro';
    if(!histByType[t])histByType[t]={count:0,pm2:[]};
    histByType[t].count++;
    if(h.precio_m2_usd>0)histByType[t].pm2.push(h.precio_m2_usd);
  });

  const priceRanges=[{label:'< $50K',min:0,max:50000},{label:'$50K-150K',min:50000,max:150000},{label:'$150K-300K',min:150000,max:300000},{label:'$300K-500K',min:300000,max:500000},{label:'$500K-1M',min:500000,max:1000000},{label:'> $1M',min:1000000,max:Infinity}];
  const priceRangeCounts=priceRanges.map(r=>({label:r.label,count:ventasUsd.filter(p=>p.price>=r.min&&p.price<r.max).length}));

  return{ventas,alquileres,hist,ventasUsd,ventasPpm2,alqUsd,alqPen,byDistrict,byType,byBeds,
    totalTas:tas?.metadata?.total_registros_raw||totalTas,totalDistritos,tasDistData,
    priceRangeCounts,bcrp,tas,mef:d.mef,zoni:d.zoni,
    histData,histWithPm2,histByDistrict,histByYear,histByType,histMarket};
}

function renderMarket(el){
  const tabs=[
    {id:'panorama',label:'Panorama'},
    {id:'distrito',label:'Distrito'},
    {id:'posicion',label:'Posición'},
    {id:'tendBcrp',label:'Tendencia BCRP'},
    {id:'tendTas',label:'Tendencia Tas.'},
    {id:'gap',label:'Brecha'},
    {id:'ratio',label:'Ratio M/A'},
    {id:'raw',label:'Admin Raw'}
  ];
  const tabBtns=tabs.map(t=>`<button class="tab-btn${_dmView===t.id?' active':''}" onclick="_dmNav('${t.id}')">${t.label}</button>`).join('');
  const escD=_dmDist?_dmDist.replace(/'/g,"\\'"):'';
  const crumb=_dmView==='distrito'&&_dmDist?`<div class="dm-crumb"><a href="#" onclick="_dmNav('panorama');return false">Panorama</a><span class="sep">›</span>${_dmDist}${_dmTipo?' · '+_dmTipo:''}</div>`:
    _dmView==='posicion'?`<div class="dm-crumb"><a href="#" onclick="_dmNav('panorama');return false">Panorama</a><span class="sep">›</span>${_dmDist?`<a href="#" onclick="_dmNav('distrito','${escD}');return false">${_dmDist}</a><span class="sep">›</span>`:''} Posición</div>`:
    _dmView==='gap'?`<div class="dm-crumb"><a href="#" onclick="_dmNav('panorama');return false">Panorama</a><span class="sep">›</span>${_dmDist?`<a href="#" onclick="_dmNav('distrito','${escD}');return false">${_dmDist}</a><span class="sep">›</span>`:''} Brecha</div>`:'';

  el.innerHTML=`
    <div class="main-header">
      <div><h1>Data de Mercado</h1><div class="subtitle">Inteligencia de mercado inmobiliario — análisis multi-fuente con gobernanza de datos</div></div>
    </div>
    <div class="main-body">
      <div class="tab-bar" style="flex-wrap:wrap">${tabBtns}</div>
      ${crumb}
      <div id="dmContent"></div>
    </div>`;

  const ct=document.getElementById('dmContent');
  if(!ct)return;
  if(_dmView==='panorama')ct.innerHTML=_dmRenderPanorama();
  else if(_dmView==='distrito')ct.innerHTML=_dmRenderDistrito();
  else if(_dmView==='posicion')ct.innerHTML=_dmRenderPosicion();
  else if(_dmView==='tendBcrp')ct.innerHTML=_dmRenderTendBcrp();
  else if(_dmView==='tendTas')ct.innerHTML=_dmRenderTendTas();
  else if(_dmView==='gap')ct.innerHTML=_dmRenderGap();
  else if(_dmView==='ratio')ct.innerHTML=_dmRenderRatio();
  else if(_dmView==='raw')ct.innerHTML=_dmRenderRaw();
}

function renderMarketTab(a){
  if(_marketTab==='resumen')return renderMktResumen(a);
  if(_marketTab==='venta')return renderMktVenta(a);
  if(_marketTab==='alquiler')return renderMktAlquiler(a);
  if(_marketTab==='transacciones')return renderMktTransacciones(a);
  if(_marketTab==='tasaciones')return renderMktTasaciones(a);
  if(_marketTab==='tendencias')return renderMktTendencias(a);
  if(_marketTab==='valorizacion')return renderMktValorizacion(a);
  return'';
}

function renderMktResumen(a){
  const medPpm2=_mktMedian(a.ventasPpm2);
  const bcrpYears=a.bcrp?Object.keys(a.bcrp.data_anual||{}).sort():[];
  const latestBcrp=bcrpYears.length?a.bcrp.data_anual[bcrpYears[bcrpYears.length-1]]:null;
  const histPm2=a.histWithPm2.map(h=>h.precio_m2_usd);
  const medHistPm2=_mktMedian(histPm2);

  const srcCards=[
    {label:'Oferta Venta',count:a.ventas.length,color:'var(--blue)',detail:`${fmtNum(a.ventasUsd.length)} en USD`},
    {label:'Oferta Alquiler',count:a.alquileres.length,color:'var(--green)',detail:`${fmtNum(a.alqUsd.length)} USD · ${fmtNum(a.alqPen.length)} PEN`},
    {label:'Transacciones Hist.',count:a.histData.length,color:'var(--amber)',detail:`${fmtNum(a.histWithPm2.length)} con precio/m²`},
    {label:'Tasaciones',count:a.totalTas,color:'var(--purple)',detail:`${fmtNum(a.totalDistritos)} distritos`},
    {label:'Mediana Venta USD/m²',count:0,color:'var(--blue)',val:'$'+fmtNum(Math.round(medPpm2)),detail:`${fmtNum(a.ventasPpm2.length)} con área`},
    {label:'Mediana Hist. USD/m²',count:0,color:'var(--amber)',val:'$'+fmtNum(Math.round(medHistPm2)),detail:'Transacciones cerradas'},
  ];

  const typeBreakdown={};
  a.ventas.forEach(p=>{const t=p.type||'Otro';if(!typeBreakdown[t])typeBreakdown[t]={venta:0,alquiler:0,hist:0};typeBreakdown[t].venta++;});
  a.alquileres.forEach(p=>{const t=p.type||'Otro';if(!typeBreakdown[t])typeBreakdown[t]={venta:0,alquiler:0,hist:0};typeBreakdown[t].alquiler++;});
  a.histData.forEach(h=>{const t=h.tipo||'Otro';if(!typeBreakdown[t])typeBreakdown[t]={venta:0,alquiler:0,hist:0};typeBreakdown[t].hist++;});
  const typeRows=Object.entries(typeBreakdown).sort((x,y)=>(y[1].venta+y[1].alquiler+y[1].hist)-(x[1].venta+x[1].alquiler+x[1].hist));

  const topApprec=a.tasDistData.filter(d=>d.latest&&d.prev&&d.total>=50).map(d=>({name:d.name,var:((d.latest.mediana_usd_m2||0)/(d.prev.mediana_usd_m2||1)-1)*100,median:d.latest.mediana_usd_m2||0,total:d.total})).filter(d=>Math.abs(d.var)<200).sort((x,y)=>y.var-x.var);
  const topUp=topApprec.slice(0,5);
  const topDown=topApprec.filter(d=>d.var<0).sort((x,y)=>x.var-y.var).slice(0,5);

  return`
    <div class="kpi-grid" style="display:grid;grid-template-columns:repeat(auto-fit,minmax(155px,1fr));gap:14px;margin-bottom:20px">
      ${srcCards.map(c=>`<div class="section-card"><div class="card-body" style="text-align:center;padding:18px 12px">
        <div style="font-size:1.8rem;font-weight:800;color:${c.color}">${c.val||fmtNum(c.count)}</div>
        <div style="font-size:.72rem;color:var(--txt-muted);font-weight:600">${c.label}</div>
        <div style="font-size:.68rem;color:var(--txt-muted)">${c.detail}</div>
      </div></div>`).join('')}
    </div>
    <div class="section-card" style="margin-bottom:20px">
      <div class="card-header"><h3>${IC.chart} Distribución por Tipo y Fuente</h3><span style="font-size:.68rem;color:var(--txt-muted)">Cruce tipo de propiedad × fuente de datos</span></div>
      <div class="card-body no-pad" style="overflow-x:auto">
        <table class="data-table"><thead><tr><th>Tipo</th><th>Venta</th><th>Alquiler</th><th>Históricos</th><th>Total</th></tr></thead><tbody>
          ${typeRows.map(([t,c])=>{const tot=c.venta+c.alquiler+c.hist;return`<tr>
            <td><strong>${esc(t)}</strong></td>
            <td style="color:var(--blue);font-weight:600">${fmtNum(c.venta)}</td>
            <td style="color:var(--green);font-weight:600">${fmtNum(c.alquiler)}</td>
            <td style="color:var(--amber);font-weight:600">${fmtNum(c.hist)}</td>
            <td style="font-weight:700">${fmtNum(tot)}</td>
          </tr>`;}).join('')}
        </tbody></table>
      </div>
    </div>
    <div class="grid-2">
      <div class="section-card">
        <div class="card-header"><h3>${IC.trendUp} Mayor Apreciación</h3><span style="font-size:.68rem;color:var(--txt-muted)">Variación interanual (≥50 tasaciones)</span></div>
        <div class="card-body">${topUp.length?topUp.map(d=>`<div class="stat-row"><div class="stat-label">${esc(d.name)}</div><div class="stat-bar-track"><div class="stat-bar-fill" style="width:${Math.min(100,Math.max(5,d.var*2))}%;background:linear-gradient(90deg,var(--green),#34d399)"></div></div><div class="stat-val" style="color:var(--green);font-weight:700">+${d.var.toFixed(1)}%</div></div>`).join(''):'<p style="color:var(--txt-muted);font-size:.82rem">Sin datos suficientes</p>'}</div>
      </div>
      <div class="section-card">
        <div class="card-header"><h3>${IC.chart} Mayor Depreciación</h3><span style="font-size:.68rem;color:var(--txt-muted)">Alertas para evaluación de riesgo</span></div>
        <div class="card-body">${topDown.length?topDown.map(d=>`<div class="stat-row"><div class="stat-label">${esc(d.name)}</div><div class="stat-bar-track"><div class="stat-bar-fill" style="width:${Math.min(100,Math.max(5,Math.abs(d.var)*2))}%;background:linear-gradient(90deg,var(--red),#f87171)"></div></div><div class="stat-val" style="color:var(--red);font-weight:700">${d.var.toFixed(1)}%</div></div>`).join(''):'<p style="color:var(--txt-muted);font-size:.82rem">Sin datos suficientes</p>'}</div>
      </div>
    </div>`;
}
