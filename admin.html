    </div>
    <div class="main-body">
      <div class="grid-2">
        <div class="section-card">
          <div class="card-header"><h3>${IC.shield} Gestionar Admin Claims</h3></div>
          <div class="card-body">
            <p style="color:var(--txt-muted);font-size:.82rem;margin-bottom:16px">Otorga o revoca permisos de administrador. Emails semilla: ${ADMIN_EMAILS.map(e=>'<code>'+esc(e)+'</code>').join(', ')}</p>
            <div style="display:flex;gap:10px;align-items:flex-end;flex-wrap:wrap">
              <div style="flex:1;min-width:200px"><label style="display:block;font-size:.76rem;font-weight:600;color:var(--txt-muted);margin-bottom:4px">Email</label><input id="adminClaimEmail" type="email" placeholder="usuario@ejemplo.com" style="width:100%;padding:9px 13px;border:1.5px solid var(--border);border-radius:var(--r)"/></div>
              <button class="btn btn-success" onclick="setAdminClaimFn(true)">${IC.check} Otorgar</button>
              <button class="btn btn-error" onclick="setAdminClaimFn(false)">${IC.x} Revocar</button>
            </div>
            <div id="adminClaimResult" style="margin-top:12px;font-size:.85rem"></div>
          </div>
        </div>
        <div class="section-card">
          <div class="card-header"><h3>${IC.shield} Admins Semilla</h3></div>
          <div class="card-body">
            ${ADMIN_EMAILS.map(e=>`<div style="display:flex;align-items:center;gap:10px;padding:10px 14px;background:var(--bg);border-radius:var(--r);margin-bottom:8px">
              <div style="width:32px;height:32px;border-radius:50%;background:linear-gradient(135deg,var(--blue),var(--blue2));color:#fff;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:.72rem">${initials(e.split('@')[0])}</div>
              <div style="flex:1"><strong style="font-size:.84rem">${esc(e)}</strong><br><span style="font-size:.7rem;color:var(--txt-muted)">Admin permanente</span></div>
              <span class="badge badge-admin">Admin</span>
            </div>`).join('')}
          </div>
        </div>
      </div>
      <div class="section-card" style="margin-top:20px">
        <div class="card-header"><h3>${IC.chart} Actividad de Administradores</h3></div>
        <div class="card-body">
          ${adminList.length?`<div style="overflow-x:auto"><table class="data-table">
            <thead><tr><th>Admin</th><th>Total</th><th>Última Acción</th><th>Fecha</th></tr></thead>
            <tbody>${adminList.map(([email,data])=>`<tr>
              <td><strong>${esc(email)}</strong></td>
              <td>${data.count}</td>
              <td><span class="badge badge-info">${esc(data.lastAction||'—')}</span></td>
              <td style="font-size:.72rem">${data.lastDate?new Date(data.lastDate).toLocaleDateString('es-PE',{day:'numeric',month:'short',year:'numeric',hour:'2-digit',minute:'2-digit'}):'—'}</td>
            </tr>`).join('')}</tbody>
          </table></div>`:'<div class="empty-state"><p>Sin actividad registrada</p></div>'}
        </div>
      </div>
    </div>`;
}

async function setAdminClaimFn(grant){
  const email=document.getElementById('adminClaimEmail').value.trim();
  if(!email){toast('Ingresa un email');return;}
  if(!confirm(`¿${grant?'Otorgar':'Revocar'} admin para ${email}?`))return;
  const result=document.getElementById('adminClaimResult');
  result.innerHTML='<div class="spinner"></div> Procesando...';
  try{
    const fn=fns.httpsCallable('setAdminClaim');
    const res=await fn({email,admin:grant});
    result.innerHTML=`<span style="color:var(--green)">Admin ${grant?'otorgado':'revocado'} para ${esc(email)} (uid: ${esc(res.data.targetUid)})</span>`;
    toast(grant?'Admin otorgado':'Admin revocado');
  }catch(e){result.innerHTML=`<span style="color:var(--red)">Error: ${esc(e.message)}</span>`;}
}

// ═══════════════════════════════════════════════════════════════
// MARKET DATA
// ═══════════════════════════════════════════════════════════════
let _marketTab='bcrp';

function renderMarket(el){
  el.innerHTML=`
    <div class="main-header">
      <div><h1>Datos de Mercado</h1><div class="subtitle">Precios, valores arancelarios y zonificación de Lima</div></div>
    </div>
    <div class="main-body">
      <div class="tab-bar">
        <button class="tab-btn${_marketTab==='bcrp'?' active':''}" onclick="_marketTab='bcrp';renderMarket(document.getElementById('mainContent'))">BCRP Precios</button>
        <button class="tab-btn${_marketTab==='tasaciones'?' active':''}" onclick="_marketTab='tasaciones';renderMarket(document.getElementById('mainContent'))">Tasaciones</button>
        <button class="tab-btn${_marketTab==='mef'?' active':''}" onclick="_marketTab='mef';renderMarket(document.getElementById('mainContent'))">Valores MEF</button>
        <button class="tab-btn${_marketTab==='zoni'?' active':''}" onclick="_marketTab='zoni';renderMarket(document.getElementById('mainContent'))">Zonificación</button>
      </div>
      ${renderMarketTab()}
    </div>`;
}

function renderMarketTab(){
  const d=_marketData;
  if(_marketTab==='bcrp'){
    if(!d.bcrp)return'<div class="empty-state"><p>Datos BCRP no disponibles</p></div>';
    const anual=d.bcrp.data_anual||{};
    const years=Object.keys(anual).sort();
    const priceEntries=years.map(y=>[y,anual[y].precio_promedio_usd_m2||0]);
    const indexEntries=years.map(y=>[y,anual[y].indice||0]);
    return`
      <div class="grid-2">
        <div class="section-card">
          <div class="card-header"><h3>${IC.chart} Precio Promedio USD/m²</h3></div>
          <div class="card-body">${priceEntries.length?renderBarChart(priceEntries):'Sin datos'}</div>
        </div>
        <div class="section-card">
          <div class="card-header"><h3>${IC.trendUp} Índice BCRP</h3></div>
          <div class="card-body">${indexEntries.length?renderBarChart(indexEntries,'var(--green)'):'Sin datos'}</div>
        </div>
      </div>
      <div class="section-card" style="margin-top:20px">
        <div class="card-header"><h3>Serie Anual Completa</h3><span style="font-size:.72rem;color:var(--txt-muted)">${esc(d.bcrp.metadata?.fuente||'')} — Base: ${esc(d.bcrp.metadata?.base||'')}</span></div>
        <div class="card-body no-pad" style="overflow-x:auto">
          <table class="data-table"><thead><tr><th>Año</th><th>Índice</th><th>Precio USD/m²</th><th>Var. Anual</th></tr></thead><tbody>
            ${years.map(y=>{const v=anual[y];const vc=(v.variacion_anual_pct||0)>=0?'var(--green)':'var(--red)';return`<tr><td><strong>${y}</strong></td><td>${v.indice||'—'}</td><td>$${fmtNum(v.precio_promedio_usd_m2||0)}</td><td style="color:${vc};font-weight:600">${(v.variacion_anual_pct||0)>=0?'+':''}${v.variacion_anual_pct||0}%</td></tr>`;}).join('')}
          </tbody></table>
        </div>
      </div>`;
  }
  if(_marketTab==='tasaciones'){
    if(!d.tasaciones)return'<div class="empty-state"><p>Datos de tasaciones no disponibles</p></div>';
    const distritos=d.tasaciones.distritos||{};
    const names=Object.keys(distritos).sort();
    const summary=names.map(name=>{
      const dist=distritos[name];const yrs=Object.keys(dist.años||dist.anos||{}).sort();
      const latest=yrs.length?(dist.años||dist.anos)[yrs[yrs.length-1]]:null;
      return{name,total:dist.total_tasaciones||0,latest,latestYear:yrs[yrs.length-1]||''};
    }).sort((a,b)=>b.total-a.total);
    const topByPrice=summary.filter(s=>s.latest&&s.latest.mediana_usd_m2).sort((a,b)=>(b.latest.mediana_usd_m2||0)-(a.latest.mediana_usd_m2||0)).slice(0,15);
    return`
      <div class="section-card" style="margin-bottom:20px">
        <div class="card-header"><h3>${IC.chart} Top Distritos por Precio (Mediana USD/m²)</h3></div>
        <div class="card-body">${topByPrice.length?renderHorizBars(topByPrice.map(s=>[s.name,s.latest.mediana_usd_m2||0])):'Sin datos'}</div>
      </div>
      <div class="section-card">
        <div class="card-header"><h3>Tasaciones por Distrito</h3><span style="font-size:.72rem;color:var(--txt-muted)">${fmtNum(d.tasaciones.metadata?.total_registros||0)} registros</span></div>
        <div class="card-body no-pad" style="overflow-x:auto;max-height:500px">
          <table class="data-table"><thead><tr><th>Distrito</th><th>Total</th><th>Año</th><th>Mediana</th><th>Promedio</th><th>Min</th><th>Max</th></tr></thead><tbody>
            ${summary.slice(0,60).map(s=>`<tr>
              <td><strong>${esc(s.name)}</strong></td>
              <td>${fmtNum(s.total)}</td>
              <td>${esc(s.latestYear)}</td>
              <td><strong>${s.latest?'$'+fmtNum(s.latest.mediana_usd_m2||0):'—'}</strong></td>
              <td>${s.latest?'$'+fmtNum(Math.round(s.latest.promedio_usd_m2||0)):'—'}</td>
              <td>${s.latest?'$'+fmtNum(s.latest.min||0):'—'}</td>
              <td>${s.latest?'$'+fmtNum(s.latest.max||0):'—'}</td>
            </tr>`).join('')}
          </tbody></table>
        </div>
      </div>`;
  }
  if(_marketTab==='mef'){
    if(!d.mef)return'<div class="empty-state"><p>Datos MEF no disponibles</p></div>';
    const zonas=d.mef.lima_zonas||{};
    const entries=Object.entries(zonas).sort((a,b)=>(b[1].valor_usd_m2||0)-(a[1].valor_usd_m2||0));
    return`<div class="section-card">
      <div class="card-header"><h3>${IC.home} Valores Arancelarios MEF</h3><span style="font-size:.72rem;color:var(--txt-muted)">${esc(d.mef.metadata?.resolucion||'')}</span></div>
      <div class="card-body no-pad" style="overflow-x:auto">
        <table class="data-table"><thead><tr><th>Zona</th><th>Distrito</th><th>Uso</th><th>Zona Arancel</th><th>USD/m²</th></tr></thead><tbody>
          ${entries.map(([key,z])=>`<tr><td><strong>${esc(key.replace(/_/g,' '))}</strong></td><td>${esc(z.distrito||'—')}</td><td>${esc(z.uso||'—')}</td><td><span class="badge badge-info">${esc(z.zona_arancel||'—')}</span></td><td><strong>$${fmtNum(z.valor_usd_m2||0)}</strong></td></tr>`).join('')}
        </tbody></table>
      </div>
    </div>`;
  }
  if(_marketTab==='zoni'){
    if(!d.zoni)return'<div class="empty-state"><p>Datos de zonificación no disponibles</p></div>';
    const tipos=d.zoni.tipos_zonificacion||{};
    const entries=Object.entries(tipos);
    return`<div class="section-card">
      <div class="card-header"><h3>${IC.home} Zonificación Lima (IMP)</h3></div>
      <div class="card-body no-pad" style="overflow-x:auto">
        <table class="data-table"><thead><tr><th>Código</th><th>Nombre</th><th>Densidad</th><th>Lote mín</th><th>Frente</th><th>Altura</th><th>Coef.</th><th>Área Libre</th><th>Distritos</th></tr></thead><tbody>
          ${entries.map(([code,z])=>`<tr>
            <td><strong>${esc(code)}</strong></td>
            <td>${esc(z.nombre||'—')}</td>
            <td>${fmtNum(z.densidad_neta_hab_ha||0)} hab/ha</td>
            <td>${fmtNum(z.area_lote_min_m2||0)} m²</td>
            <td>${z.frente_min_m||'—'} m</td>
            <td>${z.altura_max_pisos||'—'} pisos</td>
            <td>${z.coeficiente_edificacion||'—'}</td>
            <td>${z.porcentaje_area_libre||'—'}%</td>
            <td style="max-width:200px;font-size:.72rem">${(z.distritos_tipicos||[]).map(d=>esc(d)).join(', ')}</td>
          </tr>`).join('')}
        </tbody></table>
      </div>
    </div>`;
  }
  return'';
}

// ═══════════════════════════════════════════════════════════════
// AUDIT LOG
// ═══════════════════════════════════════════════════════════════
let _auditFilter='';
let _auditPage=0;
const AUDIT_PAGE_SIZE=50;

function renderAudit(el){
  let filtered=_auditLog;
  if(_auditFilter){const q=_auditFilter.toLowerCase();filtered=filtered.filter(e=>(e.action||'').toLowerCase().includes(q)||(e.adminEmail||'').toLowerCase().includes(q)||(e.targetId||'').toLowerCase().includes(q)||(e.targetType||'').toLowerCase().includes(q));}

  const totalPages=Math.ceil(filtered.length/AUDIT_PAGE_SIZE);
  if(_auditPage>=totalPages)_auditPage=Math.max(0,totalPages-1);
  const paged=filtered.slice(_auditPage*AUDIT_PAGE_SIZE,(_auditPage+1)*AUDIT_PAGE_SIZE);

  el.innerHTML=`
    <div class="main-header">
      <div><h1>Audit Log</h1><div class="subtitle">${_auditLog.length} entradas (máx 200)</div></div>
      <div class="header-actions">
        <button class="btn btn-outline" onclick="exportAudit()">Exportar</button>
        <button class="btn btn-outline" onclick="refreshAudit()">${IC.refresh} Actualizar</button>
      </div>
    </div>
    <div class="main-body">
      <div class="filter-bar">
        <div class="search-input">${IC.search}<input placeholder="Filtrar por acción, email, target..." value="${esc(_auditFilter)}" oninput="_auditFilter=this.value;_auditPage=0;renderAudit(document.getElementById('mainContent'))"/></div>
      </div>
      ${paged.length===0?'<div class="section-card"><div class="card-body"><div class="empty-state"><p>Sin entradas que coincidan.</p></div></div></div>':
      `<div class="section-card"><div class="card-body no-pad" style="overflow-x:auto">
        <table class="data-table"><thead><tr><th>Fecha</th><th>Acción</th><th>Admin</th><th>Target</th><th></th></tr></thead><tbody>
          ${paged.map(e=>{
            const ts=e.createdAt&&e.createdAt.toMillis?new Date(e.createdAt.toMillis()).toLocaleString('es-PE',{dateStyle:'short',timeStyle:'short'}):'—';
            const isSystem=e.adminUid==='system';
            const isReject=(e.action||'').includes('reject');
            const isApprove=(e.action||'').includes('approve');
            const isMail=(e.action||'').startsWith('mail.');
            const badgeClass=isReject?'badge-rejected':isApprove?'badge-approved':isMail?'badge-pending':isSystem?'badge-system':'badge-info';
            const target=e.targetId?esc(e.targetType||'?')+' / '+esc(truncate(e.targetId,18)):(e.targetType||'—');
            return`<tr>
              <td style="white-space:nowrap;font-size:.72rem">${ts}</td>
              <td><span class="badge ${badgeClass}">${esc(e.action||'—')}</span></td>
              <td style="font-size:.78rem">${isSystem?'<span style="color:var(--txt-muted)">Sistema</span>':esc(e.adminEmail||e.adminUid||'—')}</td>
              <td style="font-family:var(--mono);font-size:.7rem">${target}</td>
              <td>${e.extras?`<button class="btn-icon" onclick="showAuditDetail('${esc(e.id)}')" title="Ver detalle">${IC.eye}</button>`:'—'}</td>
            </tr>`;}).join('')}
        </tbody></table>
      </div></div>
      ${totalPages>1?`<div class="pagination">
        <button class="btn btn-outline btn-sm" onclick="_auditPage=Math.max(0,_auditPage-1);renderAudit(document.getElementById('mainContent'))" ${_auditPage===0?'disabled':''}>‹ Anterior</button>
        <span class="page-info">${_auditPage+1} / ${totalPages}</span>
        <button class="btn btn-outline btn-sm" onclick="_auditPage=Math.min(${totalPages-1},_auditPage+1);renderAudit(document.getElementById('mainContent'))" ${_auditPage>=totalPages-1?'disabled':''}>Siguiente ›</button>
      </div>`:''}`}
    </div>`;
}

function showAuditDetail(id){
  const e=_auditLog.find(x=>x.id===id);if(!e)return;
  openModal(`
    <h3>Detalle de Audit Log</h3>
    <div class="detail-pane">
      <div class="detail-row"><div class="dlabel">ID</div><div class="dvalue" style="font-family:var(--mono);font-size:.72rem">${esc(e.id)}</div></div>
      <div class="detail-row"><div class="dlabel">Acción</div><div class="dvalue">${esc(e.action||'—')}</div></div>
      <div class="detail-row"><div class="dlabel">Admin UID</div><div class="dvalue" style="font-family:var(--mono);font-size:.72rem">${esc(e.adminUid||'—')}</div></div>
      <div class="detail-row"><div class="dlabel">Admin Email</div><div class="dvalue">${esc(e.adminEmail||'—')}</div></div>
      <div class="detail-row"><div class="dlabel">Target</div><div class="dvalue">${esc(e.targetType||'—')} / <span style="font-family:var(--mono);font-size:.72rem">${esc(e.targetId||'—')}</span></div></div>
      <div class="detail-row"><div class="dlabel">Fecha</div><div class="dvalue">${fmtDate(e.createdAt)}</div></div>
    </div>
    ${e.extras?`<div style="margin-top:12px"><strong style="font-size:.82rem">Extras:</strong><pre style="font-size:.72rem;background:var(--bg);padding:14px;border-radius:var(--r);overflow-x:auto;white-space:pre-wrap;word-break:break-all;margin-top:6px">${esc(JSON.stringify(e.extras,null,2))}</pre></div>`:''}
    <div class="modal-actions"><button class="btn btn-outline" onclick="closeModal()">Cerrar</button></div>
  `);
}

async function refreshAudit(){
  try{const snap=await db.collection('adminAuditLog').orderBy('createdAt','desc').limit(200).get();_auditLog=snap.docs.map(d=>({id:d.id,...d.data()}));renderAudit(document.getElementById('mainContent'));toast('Audit log actualizado');}catch(e){toast('Error: '+e.message);}
}

function exportAudit(){
  const headers=['Fecha','Acción','Admin','TargetType','TargetID'];
  const rows=_auditLog.map(e=>[e.createdAt?new Date(tsMs(e.createdAt)).toISOString():'',e.action||'',e.adminEmail||e.adminUid||'',e.targetType||'',e.targetId||'']);
  const csv=[headers.join(','),...rows.map(r=>r.map(v=>'"'+String(v).replace(/"/g,'""')+'"').join(','))].join('\n');
  const blob=new Blob(['﻿'+csv],{type:'text/csv;charset=utf-8'});
  const url=URL.createObjectURL(blob);
  const a=document.createElement('a');a.href=url;a.download='reco_audit_'+new Date().toISOString().slice(0,10)+'.csv';a.click();URL.revokeObjectURL(url);
  toast('Audit log exportado');
}
</script>
</body>
