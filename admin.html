function renderMktAlquiler(a){
  const allA=a.alquileres;
  const tipos=[...new Set(allA.map(p=>p.type||'Otro'))];
  const dists=[...new Set(allA.map(p=>p.district).filter(Boolean))];
  const depts=[...new Set(allA.map(p=>p.department).filter(Boolean))];
  const distDept={};allA.forEach(p=>{if(p.district&&p.department)distDept[p.district]=p.department;});

  const filt=_mktApplyFilters(allA,p=>p.type||'Otro',p=>p.district||'',p=>p.department||'');
  const filtUsd=filt.filter(p=>p.cur==='$'&&p.price>0&&p.price<20000);
  const filtPen=filt.filter(p=>p.cur==='S/'&&p.price>0&&p.price<50000);
  const medAlqUsd=_mktMedian(filtUsd.map(p=>p.price));
  const medAlqPen=_mktMedian(filtPen.map(p=>p.price));

  const alqByType={};
  filt.filter(p=>p.cur==='$'&&p.price>0&&p.price<20000).forEach(p=>{const t=p.type||'Otro';if(!alqByType[t])alqByType[t]=[];alqByType[t].push(p.price);});
  const typeYield=Object.entries(alqByType).map(([type,prices])=>({type,median:Math.round(_mktMedian(prices)),count:prices.length})).sort((x,y)=>y.median-x.median);

  const distYield=[];
  const distAlq={};
  filtUsd.forEach(p=>{const dd=p.district||'Otro';if(!distAlq[dd])distAlq[dd]={alq:[],count:0};distAlq[dd].alq.push(p.price);distAlq[dd].count++;});
  Object.entries(distAlq).forEach(([name,d])=>{
    const medAlq=_mktMedian(d.alq);
    const distVentas=a.byDistrict[name];
    if(distVentas&&distVentas.ventas.length>=2){
      const medVenta=_mktMedian(distVentas.ventas);
      if(medVenta>0&&medAlq>0){
        const grossYield=(medAlq*12/medVenta)*100;
        if(grossYield>0&&grossYield<30)distYield.push({name,medVenta,medAlq,grossYield,nVenta:distVentas.ventas.length,nAlq:d.count});
      }
    }
  });
  distYield.sort((x,y)=>y.grossYield-x.grossYield);

  const medVentaGlobal=_mktMedian(a.ventasUsd.map(p=>p.price));
  const globalYield=medVentaGlobal>0?(medAlqUsd*12/medVentaGlobal)*100:0;

  return`
    ${_mktFilterBar({tipos,distritos:dists,departamentos:depts,distDept,countLabel:fmtNum(filt.length)+' de '+fmtNum(allA.length)+' propiedades'})}
    <div class="kpi-grid" style="display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:14px;margin-bottom:20px">
      <div class="section-card"><div class="card-body" style="text-align:center;padding:16px 10px">
        <div style="font-size:1.6rem;font-weight:800;color:var(--green)">${fmtNum(filt.length)}</div>
        <div style="font-size:.72rem;color:var(--txt-muted);font-weight:600">En Alquiler</div>
        <div style="font-size:.68rem;color:var(--txt-muted)">${fmtNum(filtUsd.length)} USD · ${fmtNum(filtPen.length)} PEN</div>
      </div></div>
      <div class="section-card"><div class="card-body" style="text-align:center;padding:16px 10px">
        <div style="font-size:1.6rem;font-weight:800;color:var(--blue)">$${fmtNum(Math.round(medAlqUsd))}</div>
        <div style="font-size:.72rem;color:var(--txt-muted);font-weight:600">Mediana USD/mes</div>
      </div></div>
      <div class="section-card"><div class="card-body" style="text-align:center;padding:16px 10px">
        <div style="font-size:1.6rem;font-weight:800;color:var(--amber)">S/${fmtNum(Math.round(medAlqPen))}</div>
        <div style="font-size:.72rem;color:var(--txt-muted);font-weight:600">Mediana PEN/mes</div>
      </div></div>
      <div class="section-card"><div class="card-body" style="text-align:center;padding:16px 10px">
        <div style="font-size:1.6rem;font-weight:800;color:var(--purple)">${globalYield.toFixed(1)}%</div>
        <div style="font-size:.72rem;color:var(--txt-muted);font-weight:600">Rent. Bruta Global</div>
        <div style="font-size:.68rem;color:var(--txt-muted)">Alquiler×12 / Precio venta</div>
      </div></div>
    </div>
    <div class="grid-2" style="margin-bottom:20px">
      <div class="section-card">
        <div class="card-header"><h3>Alquiler Mediano por Tipo (USD)</h3></div>
        <div class="card-body">${typeYield.length?renderHorizBars(typeYield.map(t=>[t.type+' ('+t.count+')',t.median]),null,'linear-gradient(90deg,var(--green),#34d399)'):'Sin datos'}</div>
      </div>
      <div class="section-card">
        <div class="card-header"><h3>${IC.chart} Distribución por Tipo</h3></div>
        <div class="card-body">${filt.length?renderPieChart(Object.entries(alqByType).map(([t,p])=>[t,p.length]).sort((a,b)=>b[1]-a[1]),120):'Sin datos'}</div>
      </div>
    </div>
    ${distYield.length?`<div class="section-card">
      <div class="card-header"><h3>${IC.trendUp} Rentabilidad Bruta por Distrito</h3><span style="font-size:.68rem;color:var(--txt-muted)">Distritos con oferta de venta y alquiler · Rent = (Alquiler×12) / Precio venta</span></div>
      <div class="card-body no-pad" style="overflow-x:auto">
        <table class="data-table"><thead><tr><th>Distrito</th><th>Rent. Bruta</th><th>Med. Venta</th><th>Med. Alquiler</th><th>Propiedades</th></tr></thead><tbody>
          ${distYield.map(d=>{const yc=d.grossYield>=6?'var(--green)':d.grossYield>=4?'var(--amber)':'var(--red)';return`<tr>
            <td><strong>${esc(d.name)}</strong></td>
            <td style="font-weight:800;color:${yc}">${d.grossYield.toFixed(1)}%</td>
            <td>$${fmtNum(Math.round(d.medVenta))}</td>
            <td>$${fmtNum(Math.round(d.medAlq))}/mes</td>
            <td style="font-size:.72rem">${d.nVenta} venta · ${d.nAlq} alq.</td>
          </tr>`;}).join('')}
        </tbody></table>
      </div>
    </div>`:`<div class="section-card"><div class="card-body"><div class="empty-state"><p>Se requiere oferta de venta y alquiler en un mismo distrito para calcular rentabilidad.</p></div></div></div>`}`;
}

function renderMktTransacciones(a){
  if(!a.histData.length)return'<div class="empty-state"><p>Datos de transacciones históricas no disponibles. Ejecuta <code>node scripts/enrich-historicos.js</code> para procesar.</p></div>';

  const allH=a.histData;
  const tipos=[...new Set(allH.map(h=>h.tipo||'Otro'))];
  const dists=[...new Set(allH.map(h=>h.distrito).filter(Boolean))];
  const depts=[...new Set(allH.map(h=>h.departamento).filter(Boolean))];
  const distDept={};allH.forEach(h=>{if(h.distrito&&h.departamento)distDept[h.distrito]=h.departamento;});

  const filt=_mktApplyFilters(allH,h=>h.tipo||'Otro',h=>h.distrito||'',h=>h.departamento||'');
  const filtPm2=filt.filter(h=>h.precio_m2_usd>0);
  const pm2All=filtPm2.map(h=>h.precio_m2_usd);
  const medPm2=_mktMedian(pm2All);
  const pricesAll=filt.filter(h=>h.precio_prop_usd>0).map(h=>h.precio_prop_usd);
  const medPrice=_mktMedian(pricesAll);
  const penConverted=a.histMarket?.metadata?.convertidos_pen_a_usd||0;

  const filtByYear={};
  filt.forEach(h=>{
    const ym=(h.fecha_venta||'').match(/(\d{4})/);
    const yr=ym?ym[1]:'?';
    if(!filtByYear[yr])filtByYear[yr]={count:0,pm2:[]};
    filtByYear[yr].count++;
    if(h.precio_m2_usd>0)filtByYear[yr].pm2.push(h.precio_m2_usd);
  });
  const yearKeys=Object.keys(filtByYear).filter(y=>y!=='?').sort();
  const yearVolumeEntries=yearKeys.map(y=>[y,filtByYear[y].count]);
  const yearPriceEntries=yearKeys.filter(y=>filtByYear[y].pm2.length>=3).map(y=>[y,Math.round(_mktMedian(filtByYear[y].pm2))]);

  const filtByType={};

function renderMktTendencias(a){

  const priceEntries=years.map(y=>[y.replace('_est','*'),anual[y].precio_promedio_usd_m2||0]);
  const indexEntries=years.map(y=>[y.replace('_est','*'),anual[y].indice||0]);

  const tasYearTotals={};
  a.tasDistData.forEach(d=>{
    d.years.forEach(y=>{
      const yd=(d.latest&&d.latestYr===y?d.latest:(d.prev&&d.prevYr===y?d.prev:null));
      if(!yd)return;
      const n=yd.n_tasaciones||0;
      tasYearTotals[y]=(tasYearTotals[y]||0)+n;
    });
  });
  const tasVolumeEntries=Object.entries(tasYearTotals).sort((x,y)=>x[0].localeCompare(y[0]));

  const histYearKeys=Object.keys(a.histByYear).filter(y=>y!=='?').sort();

  const cycleAnalysis=years.filter(y=>!y.includes('est')).map(y=>{const d=anual[y];return{year:y,price:d.precio_promedio_usd_m2||0,var:d.variacion_anual_pct||0,index:d.indice||0};});
  const upYears=cycleAnalysis.filter(c=>c.var>0).length;
  const downYears=cycleAnalysis.filter(c=>c.var<0).length;

  return`

            <div style="padding:10px;background:var(--bg);border-radius:var(--r);text-align:center"><div style="color:var(--txt-muted);font-size:.72rem">Años al alza / baja</div><div style="font-weight:700"><span style="color:var(--green)">${upYears}</span> / <span style="color:var(--red)">${downYears}</span></div></div>
            <div style="padding:10px;background:var(--bg);border-radius:var(--r);text-align:center"><div style="color:var(--txt-muted);font-size:.72rem">Precio mín / máx</div><div style="font-weight:700">$${fmtNum(Math.min(...cycleAnalysis.map(c=>c.price)))} / $${fmtNum(Math.max(...cycleAnalysis.map(c=>c.price)))}</div></div>

function renderMktValorizacion(a){
  let mefHtml='';
  if(a.mef){
    const zonas=a.mef.lima_zonas||{};
    const entries=Object.entries(zonas).sort((x,y)=>(y[1].valor_usd_m2||0)-(x[1].valor_usd_m2||0));
    const byDist={};
    entries.forEach(([key,z])=>{const d=z.distrito||'Otro';if(!byDist[d])byDist[d]={min:Infinity,max:0,zones:[]};byDist[d].min=Math.min(byDist[d].min,z.valor_usd_m2||0);byDist[d].max=Math.max(byDist[d].max,z.valor_usd_m2||0);byDist[d].zones.push({key:key.replace(/_/g,' '),uso:z.uso,zona:z.zona_arancel,val:z.valor_usd_m2});});
    const distList=Object.entries(byDist).sort((x,y)=>y[1].max-x[1].max);

    mefHtml=`<div class="section-card" style="margin-bottom:20px">
      <div class="card-header"><h3>${IC.home} Valores Arancelarios MEF por Distrito</h3><span style="font-size:.68rem;color:var(--txt-muted)">${esc(a.mef.metadata?.resolucion||'')} · Valores de referencia para autoavalúo</span></div>

            <td>${d.zones.length}</td>
            <td style="font-size:.72rem">${d.zones.map(z=>'<span class="badge badge-info" style="margin:1px">'+esc(z.zona)+': $'+fmtNum(z.val)+'</span>').join(' ')}</td>

  }

  let gapHtml='';
  if(a.bcrp&&a.bcrp.por_distrito_2025&&a.mef){
    const bcrpDist=a.bcrp.por_distrito_2025;
    const mefZones=a.mef.lima_zonas||{};
    const mefByDist={};
    Object.entries(mefZones).forEach(([k,z])=>{const d=z.distrito;if(!mefByDist[d])mefByDist[d]=[];mefByDist[d].push(z.valor_usd_m2||0);});

    const gaps=[];
    Object.entries(bcrpDist).forEach(([name,b])=>{
      const mefVals=mefByDist[name];
      if(!mefVals||!mefVals.length)return;
      const mefMax=Math.max(...mefVals);
      const gap=b.mediana_usd_m2-mefMax;
      const gapPct=mefMax>0?((b.mediana_usd_m2/mefMax-1)*100):0;
      gaps.push({name,bcrp:b.mediana_usd_m2,mef:mefMax,gap,gapPct});
    });
    gaps.sort((x,y)=>y.gapPct-x.gapPct);

    if(gaps.length){
      gapHtml=`<div class="section-card" style="margin-bottom:20px">
        <div class="card-header"><h3>${IC.trendUp} Brecha Mercado vs. Arancel (Oportunidad)</h3><span style="font-size:.68rem;color:var(--txt-muted)">Precio mercado (BCRP) vs. valor arancelario MEF — mayor brecha = mayor potencial de plusvalía fiscal</span></div>
        <div class="card-body no-pad" style="overflow-x:auto">
          <table class="data-table"><thead><tr><th>Distrito</th><th>Mercado (BCRP)</th><th>Arancel (MEF)</th><th>Brecha</th><th>% sobre arancel</th></tr></thead><tbody>
            ${gaps.map(g=>{const gc=g.gapPct>50?'var(--green)':g.gapPct>20?'var(--amber)':'var(--txt-muted)';return`<tr>
              <td><strong>${esc(g.name)}</strong></td>
              <td style="font-weight:700">$${fmtNum(g.bcrp)}</td>
              <td>$${fmtNum(g.mef)}</td>
              <td style="font-weight:700;color:var(--green)">+$${fmtNum(g.gap)}</td>
              <td><span style="color:${gc};font-weight:700">+${g.gapPct.toFixed(0)}%</span></td>
            </tr>`;}).join('')}
          </tbody></table>
        </div>
      </div>`;
    }
  }

  let zoniHtml='';
  if(a.zoni){
    const tipos=a.zoni.tipos_zonificacion||{};
    const entries=Object.entries(tipos);
    zoniHtml=`<div class="section-card">
      <div class="card-header"><h3>${IC.home} Parámetros de Zonificación Lima (IMP)</h3><span style="font-size:.68rem;color:var(--txt-muted)">Potencial de edificación por zona</span></div>
      <div class="card-body no-pad" style="overflow-x:auto">
        <table class="data-table"><thead><tr><th>Código</th><th>Nombre</th><th>Densidad</th><th>Lote mín</th><th>Altura</th><th>Coef. Edif.</th><th>Área Libre</th><th>Distritos</th></tr></thead><tbody>
          ${entries.map(([code,z])=>`<tr>
            <td><strong>${esc(code)}</strong></td>
            <td>${esc(z.nombre||'—')}</td>
            <td>${fmtNum(z.densidad_neta_hab_ha||0)} hab/ha</td>
            <td>${fmtNum(z.area_lote_min_m2||0)} m²</td>
            <td>${z.altura_max_pisos||'—'} pisos</td>
            <td style="font-weight:700">${z.coeficiente_edificacion||'—'}</td>
            <td>${z.porcentaje_area_libre||'—'}%</td>
            <td style="max-width:200px;font-size:.72rem">${(z.distritos_tipicos||[]).map(d=>esc(d)).join(', ')}</td>
          </tr>`).join('')}
        </tbody></table>
      </div>
    </div>`;
  }

  return(mefHtml||'')+gapHtml+(zoniHtml||'')+(!mefHtml&&!zoniHtml?'<div class="empty-state"><p>Datos MEF/Zonificación no disponibles. Carga los archivos JSON en /data/.</p></div>':'');
}
// ═══════════════════════════════════════════════════════════════
// AUDIT LOG
// ═══════════════════════════════════════════════════════════════
let _auditFilter='';
let _auditPage=0;
const AUDIT_PAGE_SIZE=50;

function renderAudit(el){
  let filtered=_auditLog;
  if(_auditFilter){const q=_auditFilter.toLowerCase();filtered=filtered.filter(e=>(e.action||'').toLowerCase().includes(q)||(e.adminEmail||'').toLowerCase().includes(q)||(e.targetId||'').toLowerCase().includes(q)||(e.targetType||'').toLowerCase().includes(q));}

  const totalPages=Math.ceil(filtered.length/AUDIT_PAGE_SIZE);
  if(_auditPage>=totalPages)_auditPage=Math.max(0,totalPages-1);
  const paged=filtered.slice(_auditPage*AUDIT_PAGE_SIZE,(_auditPage+1)*AUDIT_PAGE_SIZE);

  el.innerHTML=`
    <div class="main-header">
      <div><h1>Audit Log</h1><div class="subtitle">${_auditLog.length} entradas (máx 200)</div></div>
      <div class="header-actions">
        <button class="btn btn-outline" onclick="exportAudit()">Exportar</button>
        <button class="btn btn-outline" onclick="refreshAudit()">${IC.refresh} Actualizar</button>
      </div>
    </div>
    <div class="main-body">
      <div class="filter-bar">
        <div class="search-input">${IC.search}<input placeholder="Filtrar por acción, email, target..." value="${esc(_auditFilter)}" oninput="_auditFilter=this.value;_auditPage=0;renderAudit(document.getElementById('mainContent'))"/></div>
      </div>
      ${paged.length===0?'<div class="section-card"><div class="card-body"><div class="empty-state"><p>Sin entradas que coincidan.</p></div></div></div>':
      `<div class="section-card"><div class="card-body no-pad" style="overflow-x:auto">
        <table class="data-table"><thead><tr><th>Fecha</th><th>Acción</th><th>Admin</th><th>Target</th><th></th></tr></thead><tbody>
          ${paged.map(e=>{
            const ts=e.createdAt&&e.createdAt.toMillis?new Date(e.createdAt.toMillis()).toLocaleString('es-PE',{dateStyle:'short',timeStyle:'short'}):'—';
            const isSystem=e.adminUid==='system';
            const isReject=(e.action||'').includes('reject');
            const isApprove=(e.action||'').includes('approve');
            const isMail=(e.action||'').startsWith('mail.');
            const badgeClass=isReject?'badge-rejected':isApprove?'badge-approved':isMail?'badge-pending':isSystem?'badge-system':'badge-info';
            const target=e.targetId?esc(e.targetType||'?')+' / '+esc(truncate(e.targetId,18)):(e.targetType||'—');
            return`<tr>
              <td style="white-space:nowrap;font-size:.72rem">${ts}</td>
              <td><span class="badge ${badgeClass}">${esc(e.action||'—')}</span></td>
              <td style="font-size:.78rem">${isSystem?'<span style="color:var(--txt-muted)">Sistema</span>':esc(e.adminEmail||e.adminUid||'—')}</td>
              <td style="font-family:var(--mono);font-size:.7rem">${target}</td>
              <td>${e.extras?`<button class="btn-icon" onclick="showAuditDetail('${esc(e.id)}')" title="Ver detalle">${IC.eye}</button>`:'—'}</td>
            </tr>`;}).join('')}
        </tbody></table>
      </div></div>
      ${totalPages>1?`<div class="pagination">
        <button class="btn btn-outline btn-sm" onclick="_auditPage=Math.max(0,_auditPage-1);renderAudit(document.getElementById('mainContent'))" ${_auditPage===0?'disabled':''}>‹ Anterior</button>
        <span class="page-info">${_auditPage+1} / ${totalPages}</span>
        <button class="btn btn-outline btn-sm" onclick="_auditPage=Math.min(${totalPages-1},_auditPage+1);renderAudit(document.getElementById('mainContent'))" ${_auditPage>=totalPages-1?'disabled':''}>Siguiente ›</button>
      </div>`:''}`}
    </div>`;
}

function showAuditDetail(id){
  const e=_auditLog.find(x=>x.id===id);if(!e)return;
  openModal(`
    <h3>Detalle de Audit Log</h3>
    <div class="detail-pane">
      <div class="detail-row"><div class="dlabel">ID</div><div class="dvalue" style="font-family:var(--mono);font-size:.72rem">${esc(e.id)}</div></div>
      <div class="detail-row"><div class="dlabel">Acción</div><div class="dvalue">${esc(e.action||'—')}</div></div>
      <div class="detail-row"><div class="dlabel">Admin UID</div><div class="dvalue" style="font-family:var(--mono);font-size:.72rem">${esc(e.adminUid||'—')}</div></div>
      <div class="detail-row"><div class="dlabel">Admin Email</div><div class="dvalue">${esc(e.adminEmail||'—')}</div></div>
      <div class="detail-row"><div class="dlabel">Target</div><div class="dvalue">${esc(e.targetType||'—')} / <span style="font-family:var(--mono);font-size:.72rem">${esc(e.targetId||'—')}</span></div></div>
      <div class="detail-row"><div class="dlabel">Fecha</div><div class="dvalue">${fmtDate(e.createdAt)}</div></div>
    </div>
    ${e.extras?`<div style="margin-top:12px"><strong style="font-size:.82rem">Extras:</strong><pre style="font-size:.72rem;background:var(--bg);padding:14px;border-radius:var(--r);overflow-x:auto;white-space:pre-wrap;word-break:break-all;margin-top:6px">${esc(JSON.stringify(e.extras,null,2))}</pre></div>`:''}
    <div class="modal-actions"><button class="btn btn-outline" onclick="closeModal()">Cerrar</button></div>
  `);
}

async function refreshAudit(){
  try{const snap=await db.collection('adminAuditLog').orderBy('createdAt','desc').limit(200).get();_auditLog=snap.docs.map(d=>({id:d.id,...d.data()}));renderAudit(document.getElementById('mainContent'));toast('Audit log actualizado');}catch(e){toast('Error: '+e.message);}
}

function exportAudit(){
  const headers=['Fecha','Acción','Admin','TargetType','TargetID'];
  const rows=_auditLog.map(e=>[e.createdAt?new Date(tsMs(e.createdAt)).toISOString():'',e.action||'',e.adminEmail||e.adminUid||'',e.targetType||'',e.targetId||'']);
  const csv=[headers.join(','),...rows.map(r=>r.map(v=>'"'+String(v).replace(/"/g,'""')+'"').join(','))].join('\n');
  const blob=new Blob(['﻿'+csv],{type:'text/csv;charset=utf-8'});
  const url=URL.createObjectURL(blob);
  const a=document.createElement('a');a.href=url;a.download='reco_audit_'+new Date().toISOString().slice(0,10)+'.csv';a.click();URL.revokeObjectURL(url);
  toast('Audit log exportado');
}
</script>
</body>
</html>
