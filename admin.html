<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<meta name="referrer" content="strict-origin-when-cross-origin"/>
<title>Reco Admin</title>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-storage-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-functions-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-check-compat.js"></script>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --blue:#0891b2;--blue2:#06b6d4;--blue-dark:#0e7490;
  --amber:#f59e0b;--amber2:#d97706;--green:#10b981;--green-dark:#065f46;
  --red:#ef4444;--red-dark:#991b1b;--purple:#8b5cf6;--purple-dark:#5b21b6;
  --bg:#f1f5f9;--bg-card:#ffffff;--bg-sidebar:#0f172a;--bg-hover:#f8fafc;
  --txt:#0f172a;--txt-muted:#64748b;--txt-sidebar:#94a3b8;--txt-sidebar-active:#ffffff;
  --border:#e2e8f0;--border-cyan:#cffafe;
  --primary:var(--blue);--primary-hover:var(--blue-dark);--primary-light:#ecfeff;
  --success:var(--green);--success-light:#d1fae5;--success-dark:var(--green-dark);
  --warning:var(--amber);--warning-light:#fef3c7;--warning-dark:#92400e;
  --error:var(--red);--error-light:#fef2f2;--error-dark:var(--red-dark);
  --r:10px;--r-lg:14px;
  --sh:0 1px 3px rgba(0,0,0,.08),0 4px 16px rgba(0,0,0,.06);
  --sh2:0 8px 32px rgba(0,0,0,.12);
  --font:'Segoe UI',system-ui,-apple-system,sans-serif;
  --mono:ui-monospace,SFMono-Regular,'SF Mono',Menlo,monospace;
  --sidebar-w:260px;
}
html,body{height:100%;font-family:var(--font);background:var(--bg);color:var(--txt);font-size:14px;line-height:1.5}
a{color:var(--primary);text-decoration:none}
a:hover{text-decoration:underline}
button{font-family:var(--font);cursor:pointer}
input,select,textarea{font-family:var(--font);font-size:.875rem}

/* ── Login ── */
#loginGate{display:flex;align-items:center;justify-content:center;height:100vh;background:linear-gradient(135deg,#ecfeff 0%,#f1f5f9 50%,#f0f9ff 100%)}
.login-box{background:var(--bg-card);border-radius:var(--r-lg);padding:44px 40px;box-shadow:var(--sh2);max-width:420px;width:92%;text-align:center;border:1px solid var(--border-cyan)}
.login-box h1{font-size:1.6rem;font-weight:800;letter-spacing:-.02em;margin-bottom:2px;color:var(--txt)}
.login-box .brand-tag{color:var(--primary);font-size:.78rem;font-weight:600;letter-spacing:.05em;text-transform:uppercase;margin-bottom:4px}
.login-box p{color:var(--txt-muted);font-size:.85rem;margin-bottom:28px}
.login-box .logo-img{height:40px;margin-bottom:20px}
.login-btn{display:flex;align-items:center;justify-content:center;gap:10px;width:100%;padding:12px;border:1.5px solid var(--border);border-radius:var(--r);background:var(--bg-card);font-size:.88rem;font-weight:600;transition:all .15s;color:var(--txt)}
.login-btn:hover{border-color:var(--primary);background:var(--primary-light)}
.login-btn svg{width:20px;height:20px;flex-shrink:0}
.login-error{margin-top:16px;padding:10px 14px;border-radius:var(--r);background:var(--error-light);color:var(--error-dark);font-size:.82rem;display:none}
.login-divider{display:flex;align-items:center;gap:12px;margin:22px 0;color:var(--txt-muted);font-size:.78rem}
.login-divider::before,.login-divider::after{content:'';flex:1;height:1px;background:var(--border)}
.login-form{text-align:left}
.login-form label{display:block;font-size:.78rem;font-weight:600;color:var(--txt-muted);margin-bottom:4px;margin-top:14px}
.login-form input{width:100%;padding:11px 14px;border:1.5px solid var(--border);border-radius:var(--r);font-size:.88rem;background:var(--bg-card);color:var(--txt);outline:none;transition:border-color .15s,box-shadow .15s}
.login-form input:focus{border-color:var(--primary);box-shadow:0 0 0 3px rgba(8,145,178,.1)}
.login-form .submit-btn{width:100%;margin-top:18px;padding:12px;border:none;border-radius:var(--r);background:linear-gradient(135deg,var(--blue),var(--blue2));color:#fff;font-size:.9rem;font-weight:700;transition:opacity .15s;box-shadow:0 2px 8px rgba(8,145,178,.3)}
.login-form .submit-btn:hover{opacity:.92}
.login-form .submit-btn:disabled{opacity:.5;cursor:not-allowed}

/* ── Shell ── */
#adminShell{display:none;height:100vh}
.shell{display:flex;height:100%}

/* ── Sidebar ── */
.sidebar{width:var(--sidebar-w);min-width:var(--sidebar-w);background:var(--bg-sidebar);display:flex;flex-direction:column;overflow-y:auto;flex-shrink:0}
.sidebar-brand{padding:22px 20px 18px;border-bottom:1px solid rgba(255,255,255,.08)}
.sidebar-brand h2{color:#fff;font-size:1.15rem;font-weight:800;letter-spacing:-.01em;display:flex;align-items:center;gap:8px}
.sidebar-brand h2 svg{width:24px;height:24px;color:var(--blue2)}
.sidebar-brand span{color:var(--txt-sidebar);font-size:.72rem;margin-top:4px;display:block}
.sidebar-nav{flex:1;padding:14px 10px}
.nav-section{color:var(--txt-sidebar);font-size:.62rem;font-weight:700;text-transform:uppercase;letter-spacing:.1em;padding:18px 12px 6px;opacity:.5}
.nav-item{display:flex;align-items:center;gap:10px;padding:10px 14px;border-radius:var(--r);color:var(--txt-sidebar);font-size:.84rem;font-weight:500;transition:all .15s;border:none;background:none;width:100%;text-align:left}
.nav-item:hover{background:rgba(255,255,255,.06);color:#e2e8f0}
.nav-item.active{background:rgba(8,145,178,.18);color:var(--txt-sidebar-active);font-weight:600}
.nav-item svg{width:18px;height:18px;flex-shrink:0;opacity:.7}
.nav-item.active svg{opacity:1}
.nav-item .badge{margin-left:auto;background:var(--red);color:#fff;font-size:.62rem;font-weight:700;padding:2px 7px;border-radius:99px;min-width:18px;text-align:center}
.sidebar-user{padding:16px;border-top:1px solid rgba(255,255,255,.08);display:flex;align-items:center;gap:10px}
.sidebar-user .avatar{width:34px;height:34px;border-radius:50%;background:linear-gradient(135deg,var(--blue),var(--blue2));color:#fff;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:.78rem;flex-shrink:0}
.sidebar-user .info{flex:1;min-width:0}
.sidebar-user .name{color:#fff;font-size:.8rem;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sidebar-user .email{color:var(--txt-sidebar);font-size:.68rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sidebar-user .logout-btn{background:none;border:none;color:var(--txt-sidebar);font-size:.82rem;padding:6px;opacity:.5;transition:opacity .15s;border-radius:var(--r)}
.sidebar-user .logout-btn:hover{opacity:1;background:rgba(255,255,255,.06)}

/* ── Main ── */
.main{flex:1;overflow-y:auto;padding:0}
.main-header{padding:22px 30px;border-bottom:1px solid var(--border);background:var(--bg-card);display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:10}
.main-header h1{font-size:1.3rem;font-weight:800;letter-spacing:-.02em}
.main-header .subtitle{color:var(--txt-muted);font-size:.82rem;margin-top:2px}
.main-body{padding:26px 30px}
.header-actions{display:flex;gap:8px;align-items:center}

/* ── KPI ── */
.kpi-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:16px;margin-bottom:24px}
.kpi-card{background:var(--bg-card);border-radius:var(--r-lg);padding:20px 22px;box-shadow:var(--sh);border:1px solid var(--border);position:relative;overflow:hidden}
.kpi-card::before{content:'';position:absolute;top:0;left:0;bottom:0;width:3px}
.kpi-card.accent-blue::before{background:var(--blue)}
.kpi-card.accent-green::before{background:var(--green)}
.kpi-card.accent-amber::before{background:var(--amber)}
.kpi-card.accent-red::before{background:var(--red)}
.kpi-card.accent-purple::before{background:var(--purple)}
.kpi-card .kpi-icon{position:absolute;top:16px;right:18px;width:42px;height:42px;border-radius:10px;display:flex;align-items:center;justify-content:center;opacity:.9}
.kpi-card.accent-blue .kpi-icon{background:var(--primary-light);color:var(--blue)}
.kpi-card.accent-green .kpi-icon{background:var(--success-light);color:var(--green)}
.kpi-card.accent-amber .kpi-icon{background:var(--warning-light);color:var(--amber)}
.kpi-card.accent-red .kpi-icon{background:var(--error-light);color:var(--red)}
.kpi-card.accent-purple .kpi-icon{background:#f3e8ff;color:var(--purple)}
.kpi-card .kpi-icon svg{width:20px;height:20px}
.kpi-label{font-size:.72rem;color:var(--txt-muted);font-weight:600;text-transform:uppercase;letter-spacing:.04em;margin-bottom:10px}
.kpi-value{font-size:1.8rem;font-weight:800;color:var(--txt);line-height:1}
.kpi-sub{font-size:.72rem;color:var(--txt-muted);margin-top:6px;display:flex;align-items:center;gap:4px}
.kpi-trend-up{color:var(--green);font-weight:700}
.kpi-trend-down{color:var(--red);font-weight:700}

/* ── Cards ── */
.section-card{background:var(--bg-card);border-radius:var(--r-lg);box-shadow:var(--sh);border:1px solid var(--border);margin-bottom:20px;overflow:hidden}
.section-card .card-header{padding:16px 22px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;gap:12px}
.section-card .card-header h3{font-size:.95rem;font-weight:700;display:flex;align-items:center;gap:8px}
.section-card .card-body{padding:18px 22px}
.section-card .card-body.no-pad{padding:0}

/* ── Tables ── */
.data-table{width:100%;border-collapse:collapse;font-size:.82rem}
.data-table th{text-align:left;padding:10px 14px;font-weight:600;color:var(--txt-muted);font-size:.7rem;text-transform:uppercase;letter-spacing:.04em;background:var(--bg);border-bottom:1px solid var(--border);position:sticky;top:0;white-space:nowrap;cursor:default}
.data-table th.sortable{cursor:pointer;user-select:none}
.data-table th.sortable:hover{color:var(--txt)}
.data-table td{padding:10px 14px;border-bottom:1px solid var(--border);vertical-align:middle}
.data-table tbody tr:hover{background:var(--bg-hover)}
.data-table tbody tr:last-child td{border-bottom:none}

/* ── Badges ── */
.badge{display:inline-flex;align-items:center;gap:4px;padding:3px 10px;border-radius:99px;font-size:.7rem;font-weight:700;letter-spacing:.02em}
.badge-pending{background:var(--warning-light);color:var(--warning-dark)}
.badge-approved{background:var(--success-light);color:var(--success-dark)}
.badge-rejected{background:var(--error-light);color:var(--error-dark)}
.badge-new{background:#dbeafe;color:#1e40af}
.badge-handled{background:var(--success-light);color:var(--success-dark)}
.badge-info{background:var(--primary-light);color:var(--blue-dark)}
.badge-system{background:#f3e8ff;color:#6b21a8}
.badge-admin{background:linear-gradient(135deg,var(--primary-light),#e0f2fe);color:var(--blue-dark);border:1px solid var(--border-cyan)}
.badge-historico{background:#fef3c7;color:#92400e}

/* ── Buttons ── */
.btn{display:inline-flex;align-items:center;gap:6px;padding:8px 16px;border-radius:var(--r);font-size:.82rem;font-weight:600;border:none;transition:all .15s}
.btn-primary{background:linear-gradient(135deg,var(--blue),var(--blue2));color:#fff;box-shadow:0 2px 6px rgba(8,145,178,.25)}
.btn-primary:hover{opacity:.9}
.btn-success{background:var(--green);color:#fff}
.btn-success:hover{background:#059669}
.btn-error{background:var(--red);color:#fff}
.btn-error:hover{background:#dc2626}
.btn-warning{background:var(--amber);color:#fff}
.btn-warning:hover{background:var(--amber2)}
.btn-outline{background:transparent;border:1.5px solid var(--border);color:var(--txt)}
.btn-outline:hover{border-color:var(--primary);color:var(--primary);background:var(--primary-light)}
.btn-sm{padding:5px 11px;font-size:.75rem}
.btn-xs{padding:3px 8px;font-size:.7rem}
.btn-icon{padding:7px;border-radius:var(--r);background:none;border:none;color:var(--txt-muted);font-size:.9rem;display:inline-flex;align-items:center;justify-content:center;transition:all .12s}
.btn-icon:hover{background:var(--bg);color:var(--txt)}
.btn-icon svg{width:16px;height:16px}
.btn-group{display:flex;gap:0;border-radius:var(--r);overflow:hidden;border:1.5px solid var(--border)}
.btn-group .btn-seg{padding:7px 14px;border:none;background:var(--bg-card);color:var(--txt-muted);font-size:.78rem;font-weight:600;transition:all .12s}
.btn-group .btn-seg:not(:last-child){border-right:1px solid var(--border)}
.btn-group .btn-seg.active{background:var(--blue);color:#fff}
.btn-group .btn-seg:hover:not(.active){background:var(--bg)}

/* ── Filter ── */
.filter-bar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:16px}
.filter-bar input,.filter-bar select{padding:8px 14px;border:1.5px solid var(--border);border-radius:var(--r);font-size:.82rem;background:var(--bg-card);color:var(--txt);outline:none;transition:border-color .15s,box-shadow .15s}
.filter-bar input:focus,.filter-bar select:focus{border-color:var(--primary);box-shadow:0 0 0 3px rgba(8,145,178,.08)}
.filter-bar input{min-width:220px}
.search-input{position:relative}
.search-input svg{position:absolute;left:12px;top:50%;transform:translateY(-50%);width:15px;height:15px;color:var(--txt-muted);pointer-events:none}
.search-input input{padding-left:36px}

/* ── Tabs ── */
.tab-bar{display:flex;gap:0;border-bottom:2px solid var(--border);margin-bottom:20px}
.tab-btn{padding:10px 18px;font-size:.82rem;font-weight:600;color:var(--txt-muted);background:none;border:none;border-bottom:2px solid transparent;margin-bottom:-2px;transition:all .15s}
.tab-btn:hover{color:var(--txt)}
.tab-btn.active{color:var(--primary);border-bottom-color:var(--primary)}

/* ── Empty ── */
.empty-state{text-align:center;padding:48px 20px;color:var(--txt-muted)}
.empty-state svg{width:48px;height:48px;margin-bottom:14px;opacity:.4}
.empty-state p{font-size:.88rem}

/* ── Toast ── */
#toast{position:fixed;bottom:24px;right:24px;background:var(--bg-sidebar);color:#fff;padding:12px 22px;border-radius:var(--r);font-size:.85rem;font-weight:500;box-shadow:var(--sh2);transform:translateY(80px);opacity:0;transition:all .25s;z-index:9999;max-width:440px;display:flex;align-items:center;gap:8px}
#toast.show{transform:translateY(0);opacity:1}

/* ── Modal ── */
.modal-backdrop{position:fixed;inset:0;background:rgba(15,23,42,.5);backdrop-filter:blur(4px);z-index:100;display:flex;align-items:center;justify-content:center;opacity:0;pointer-events:none;transition:opacity .2s}
.modal-backdrop.open{opacity:1;pointer-events:auto}
.modal{background:var(--bg-card);border-radius:var(--r-lg);box-shadow:var(--sh2);max-width:640px;width:92%;max-height:88vh;overflow-y:auto;padding:28px;border:1px solid var(--border)}
.modal.modal-lg{max-width:800px}
.modal.modal-xl{max-width:1000px}
.modal h3{font-size:1.15rem;font-weight:800;margin-bottom:18px;letter-spacing:-.01em}
.modal label{display:block;font-size:.76rem;font-weight:600;color:var(--txt-muted);margin-bottom:4px;margin-top:14px}
.modal input,.modal select,.modal textarea{width:100%;padding:9px 13px;border:1.5px solid var(--border);border-radius:var(--r);font-size:.85rem;background:var(--bg-card);color:var(--txt);outline:none;transition:border-color .15s,box-shadow .15s}
.modal input:focus,.modal select:focus,.modal textarea:focus{border-color:var(--primary);box-shadow:0 0 0 3px rgba(8,145,178,.08)}
.modal textarea{resize:vertical;min-height:80px}
.modal-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:22px;padding-top:18px;border-top:1px solid var(--border)}

/* ── Detail ── */
.detail-pane{background:var(--bg);border-radius:var(--r);padding:16px 20px;margin-bottom:16px}
.detail-row{display:flex;gap:8px;padding:7px 0;border-bottom:1px solid var(--border);font-size:.82rem}
.detail-row:last-child{border-bottom:none}
.detail-row .dlabel{color:var(--txt-muted);font-weight:600;min-width:140px;flex-shrink:0;font-size:.78rem}
.detail-row .dvalue{color:var(--txt);word-break:break-word;flex:1}

/* ── Photo gallery ── */
.photo-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:8px;margin-bottom:16px}
.photo-grid img{width:100%;aspect-ratio:4/3;object-fit:cover;border-radius:8px;cursor:pointer;transition:transform .15s,box-shadow .15s;border:1px solid var(--border)}
.photo-grid img:hover{transform:scale(1.03);box-shadow:var(--sh2)}
.lightbox{position:fixed;inset:0;background:rgba(0,0,0,.9);z-index:200;display:flex;align-items:center;justify-content:center;cursor:zoom-out;opacity:0;pointer-events:none;transition:opacity .2s}
.lightbox.open{opacity:1;pointer-events:auto}
.lightbox img{max-width:92vw;max-height:88vh;border-radius:8px;object-fit:contain}

/* ── Photo manager ── */
.photo-manager{border:2px dashed var(--border);border-radius:var(--r);padding:16px;margin-top:8px}
.photo-manager .pm-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(100px,1fr));gap:10px;margin-bottom:12px}
.photo-manager .pm-item{position:relative;border-radius:8px;overflow:hidden;border:1px solid var(--border);aspect-ratio:4/3}
.photo-manager .pm-item img{width:100%;height:100%;object-fit:cover}
.photo-manager .pm-item .pm-actions{position:absolute;top:4px;right:4px;display:flex;gap:3px}
.photo-manager .pm-item .pm-btn{width:24px;height:24px;border-radius:50%;border:none;display:flex;align-items:center;justify-content:center;cursor:pointer;font-size:.65rem;color:#fff}
.photo-manager .pm-item .pm-del{background:var(--red)}
.photo-manager .pm-item .pm-left,.photo-manager .pm-item .pm-right{background:rgba(0,0,0,.6)}
.photo-manager .pm-item .pm-order{position:absolute;bottom:4px;left:4px;background:rgba(0,0,0,.6);color:#fff;font-size:.6rem;padding:2px 6px;border-radius:4px}
.photo-manager .pm-upload{display:flex;align-items:center;gap:8px}
.photo-manager .pm-upload input[type=file]{font-size:.78rem}

/* ── Charts ── */
.chart-bars{display:flex;align-items:flex-end;gap:4px;height:160px;padding:0 4px}
.chart-bar{flex:1;background:linear-gradient(180deg,var(--blue),var(--blue2));border-radius:4px 4px 0 0;min-width:10px;position:relative;transition:opacity .15s}
.chart-bar:hover{opacity:.85}
.chart-bar .bar-tip{position:absolute;bottom:100%;left:50%;transform:translateX(-50%);background:var(--bg-sidebar);color:#fff;padding:3px 9px;border-radius:6px;font-size:.65rem;white-space:nowrap;opacity:0;transition:opacity .15s;pointer-events:none;margin-bottom:4px}
.chart-bar:hover .bar-tip{opacity:1}
.chart-labels{display:flex;gap:4px;padding:6px 4px 0;font-size:.6rem;color:var(--txt-muted)}
.chart-labels span{flex:1;text-align:center;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

/* ── Pie chart ── */
.pie-container{display:flex;align-items:center;gap:20px;justify-content:center}
.pie-legend{display:flex;flex-direction:column;gap:6px}
.pie-legend-item{display:flex;align-items:center;gap:8px;font-size:.78rem}
.pie-legend-dot{width:10px;height:10px;border-radius:50%;flex-shrink:0}

/* ── Stat list ── */
.stat-row{display:flex;align-items:center;gap:12px;padding:10px 0;border-bottom:1px solid var(--border);font-size:.82rem}
.stat-row:last-child{border-bottom:none}
.stat-row .stat-bar-track{flex:1;height:6px;background:var(--bg);border-radius:3px;overflow:hidden}
.stat-row .stat-bar-fill{height:100%;background:linear-gradient(90deg,var(--blue),var(--blue2));border-radius:3px;transition:width .4s}
.stat-row .stat-label{min-width:120px;font-weight:500}
.stat-row .stat-val{min-width:50px;text-align:right;font-weight:700;color:var(--txt)}

/* ── Spinner ── */
.spinner{display:inline-block;width:20px;height:20px;border:2.5px solid var(--border);border-top-color:var(--primary);border-radius:50%;animation:spin .6s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.loading-center{display:flex;align-items:center;justify-content:center;padding:48px;gap:10px;color:var(--txt-muted);font-size:.85rem}

/* ── Pagination ── */
.pagination{display:flex;align-items:center;justify-content:center;gap:8px;padding:16px 0}
.pagination .btn{min-width:36px;justify-content:center}
.pagination .page-info{font-size:.78rem;color:var(--txt-muted)}

/* ── Grid layouts ── */
.grid-2{display:grid;grid-template-columns:1fr 1fr;gap:20px}
.grid-3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:20px}
@media(max-width:900px){.grid-2,.grid-3{grid-template-columns:1fr}}

/* ── Activity feed ── */
.activity-feed{max-height:360px;overflow-y:auto}
.activity-item{display:flex;gap:12px;padding:10px 0;border-bottom:1px solid var(--border);font-size:.82rem}
.activity-item:last-child{border-bottom:none}
.activity-dot{width:8px;height:8px;border-radius:50%;margin-top:5px;flex-shrink:0}
.activity-dot.dot-blue{background:var(--blue)}
.activity-dot.dot-green{background:var(--green)}
.activity-dot.dot-amber{background:var(--amber)}
.activity-dot.dot-red{background:var(--red)}
.activity-content{flex:1;min-width:0}
.activity-time{font-size:.7rem;color:var(--txt-muted);margin-top:2px}

/* ── User card ── */
.user-row{display:flex;align-items:center;gap:12px;padding:12px 14px;border-bottom:1px solid var(--border);transition:background .1s;cursor:pointer}
.user-row:hover{background:var(--bg-hover)}
.user-row:last-child{border-bottom:none}
.u-avatar{width:36px;height:36px;border-radius:50%;background:linear-gradient(135deg,var(--blue),var(--blue2));color:#fff;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:.72rem;flex-shrink:0}
.user-row .u-info{flex:1;min-width:0}
.user-row .u-name{font-weight:600;font-size:.84rem}
.user-row .u-email{font-size:.72rem;color:var(--txt-muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.user-row .u-meta{display:flex;gap:8px;align-items:center;flex-shrink:0}

/* ── Check / toggle ── */
input[type=checkbox]{accent-color:var(--blue);width:15px;height:15px}

/* ── Feature tags grid ── */
.feat-section-title{font-size:.78rem;font-weight:700;color:var(--txt-muted);margin:12px 0 6px;text-transform:uppercase;letter-spacing:.04em}
.feat-grid{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:8px}
.feat-grid label{display:flex;align-items:center;gap:5px;font-size:.78rem;padding:4px 10px;background:var(--bg);border-radius:var(--r);cursor:pointer;border:1px solid var(--border);transition:all .12s;user-select:none}
.feat-grid label:hover{background:var(--primary-light);border-color:var(--primary)}

/* ── Full detail view (platform-like) ── */
.full-detail{max-width:900px;margin:0 auto}
.full-detail .fd-hero{position:relative;height:320px;border-radius:var(--r-lg);overflow:hidden;margin-bottom:20px;background:linear-gradient(135deg,#ecfeff,#f0f9ff)}
.full-detail .fd-hero img{width:100%;height:100%;object-fit:cover}
.full-detail .fd-hero-overlay{position:absolute;bottom:0;left:0;right:0;padding:20px 24px;background:linear-gradient(transparent,rgba(0,0,0,.7));color:#fff}
.full-detail .fd-hero-title{font-size:1.2rem;font-weight:800}
.full-detail .fd-hero-sub{font-size:.85rem;opacity:.85;margin-top:2px}
.full-detail .fd-price-row{display:flex;align-items:baseline;gap:16px;margin-bottom:20px;padding:16px 20px;background:var(--bg-card);border-radius:var(--r-lg);border:1px solid var(--border);box-shadow:var(--sh)}
.full-detail .fd-price{font-size:1.8rem;font-weight:800;color:var(--txt)}
.full-detail .fd-price-sqm{font-size:.88rem;color:var(--txt-muted)}
.full-detail .fd-specs{display:grid;grid-template-columns:repeat(auto-fit,minmax(100px,1fr));gap:12px;margin-bottom:20px}
.full-detail .fd-spec{background:var(--bg-card);border:1px solid var(--border);border-radius:var(--r);padding:14px;text-align:center;box-shadow:var(--sh)}
.full-detail .fd-spec .sv{font-size:1.2rem;font-weight:800;color:var(--txt)}
.full-detail .fd-spec .sk{font-size:.7rem;color:var(--txt-muted);text-transform:uppercase;letter-spacing:.04em;margin-top:2px}

/* ── PDF list ── */
.pdf-list{display:flex;flex-direction:column;gap:6px}
.pdf-item{display:flex;align-items:center;gap:10px;padding:8px 12px;background:var(--bg);border-radius:var(--r);font-size:.82rem}
.pdf-item a{color:var(--primary);font-weight:600}

/* ── Scrollbar ── */
::-webkit-scrollbar{width:5px;height:5px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:#cbd5e1;border-radius:99px}
::-webkit-scrollbar-thumb:hover{background:var(--txt-muted)}

/* ── Data de Mercado ── */
.dm-conf-high{background:var(--success-light);color:var(--success-dark)}
.dm-conf-med{background:#dbeafe;color:#1e40af}
.dm-conf-low{background:var(--warning-light);color:var(--warning-dark)}
.dm-conf-none{background:var(--error-light);color:var(--error-dark)}
.dm-sample-ok{background:var(--success-light);color:var(--success-dark)}
.dm-sample-ind{background:var(--warning-light);color:var(--warning-dark)}
.dm-sample-low{background:var(--error-light);color:var(--error-dark)}
.dm-trust{background:var(--bg);border-radius:var(--r);padding:14px 18px;margin-top:20px;font-size:.72rem;color:var(--txt-muted);border:1px solid var(--border)}
.dm-trust strong{color:var(--txt);font-weight:700}
.dm-gauge{position:relative;height:28px;border-radius:var(--r);overflow:visible;margin:20px 0 36px}
.dm-gauge-bg{height:100%;border-radius:var(--r);background:linear-gradient(90deg,#dbeafe,var(--success-light) 25%,var(--success-light) 75%,#fef3c7)}
.dm-gauge-mk{position:absolute;top:-4px;width:3px;height:36px;background:var(--txt);border-radius:2px;z-index:2}
.dm-gauge-md{position:absolute;top:0;width:2px;height:28px;background:var(--txt-muted);opacity:.5}
.dm-gauge-lbl{position:absolute;top:34px;font-size:.68rem;font-weight:700;white-space:nowrap}
.dm-cross{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:12px;margin:16px 0}
.dm-src{padding:14px;background:var(--bg);border-radius:var(--r);text-align:center;border:1px solid var(--border)}
.dm-src .src-lbl{font-size:.68rem;color:var(--txt-muted);font-weight:600;text-transform:uppercase;letter-spacing:.04em;margin-bottom:6px}
.dm-src .src-val{font-size:1.3rem;font-weight:800}
.dm-src .src-sub{font-size:.68rem;color:var(--txt-muted);margin-top:4px}
.dm-crumb{display:flex;align-items:center;gap:6px;font-size:.82rem;color:var(--txt-muted);margin-bottom:16px}
.dm-crumb a{cursor:pointer;color:var(--primary);font-weight:600}
.dm-crumb .sep{color:var(--border)}
.dm-prop-row{display:flex;align-items:center;gap:12px;padding:10px 14px;border-bottom:1px solid var(--border);cursor:pointer;transition:background .1s;font-size:.82rem}
.dm-prop-row:hover{background:var(--bg-hover)}
.dm-prop-row:last-child{border-bottom:none}
.dm-empty{text-align:center;padding:40px 20px;color:var(--txt-muted)}
.dm-empty p{font-size:.88rem;margin-top:8px}

/* ── Responsive ── */
@media(max-width:900px){
  .sidebar{position:fixed;left:calc(-1*var(--sidebar-w));z-index:50;height:100%;transition:left .25s}
  .sidebar.open{left:0}
  .mobile-menu{display:flex!important}
  .main-header{padding:16px 18px}
  .main-body{padding:16px 18px}
  .kpi-grid{grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
}
.mobile-menu{display:none;align-items:center;justify-content:center;width:36px;height:36px;border-radius:var(--r);border:1.5px solid var(--border);background:none;color:var(--txt);margin-right:8px}
</style>
</head>
<body>

  <div class="login-box">

<div class="shell">
  <aside class="sidebar" id="sidebar">

<script>
// ═══════════════════════════════════════════════════════════════
// Firebase Init
// ═══════════════════════════════════════════════════════════════
const firebaseConfig={apiKey:"AIzaSyCri1KjwpUKfYMhjYf0nPU9KD1LipVbh3M",authDomain:"reco-5a5dd.firebaseapp.com",projectId:"reco-5a5dd",storageBucket:"reco-5a5dd.firebasestorage.app",messagingSenderId:"553146114942",appId:"1:553146114942:web:3dcba5bb9bd1276c6b892f"};
firebase.initializeApp(firebaseConfig);
const auth=firebase.auth();
auth.languageCode='es';
const db=firebase.firestore();
const fns=firebase.app().functions('southamerica-east1');
const storage=firebase.storage();

// ═══════════════════════════════════════════════════════════════
// Utility
// ═══════════════════════════════════════════════════════════════
function esc(s){if(s==null)return'';return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;');}
function fmtDate(ts){if(!ts)return'—';const d=ts.toDate?ts.toDate():new Date(ts);if(isNaN(d))return'—';return d.toLocaleDateString('es-PE',{day:'numeric',month:'short',year:'numeric',hour:'2-digit',minute:'2-digit'});}
function fmtShortDate(ts){if(!ts)return'—';const d=ts.toDate?ts.toDate():new Date(ts);if(isNaN(d))return'—';return d.toLocaleDateString('es-PE',{day:'numeric',month:'short'});}
function fmtPrice(n,cur){if(!n&&n!==0)return'—';const s=Number(n).toLocaleString('es-PE',{maximumFractionDigits:0});return(cur==='PEN'?'S/ ':'$ ')+s;}
function fmtNum(n){return n!=null?Number(n).toLocaleString('es-PE'):'0';}
function truncate(s,max){if(!s)return'';return s.length>max?s.slice(0,max)+'…':s;}
function kindLabel(k){return k==='arrendador'?'Alquiler':k==='vendedor'?'Compra':k==='asesor_reco'?'Asesoría':'Contacto';}
function tsMs(ts){return ts&&ts.toMillis?ts.toMillis():ts?new Date(ts).getTime():0;}
function daysAgo(n){return Date.now()-n*24*60*60*1000;}
function initials(s){return(s||'?').split(' ').map(w=>w[0]).join('').slice(0,2).toUpperCase();}

let _toastTimer;
function toast(msg,dur){const el=document.getElementById('toast');el.textContent=msg;el.classList.add('show');clearTimeout(_toastTimer);_toastTimer=setTimeout(()=>el.classList.remove('show'),dur||3500);}
function openModal(html,cls){const m=document.getElementById('modalContent');m.className='modal'+(cls?' '+cls:'');m.innerHTML=html;document.getElementById('modalBackdrop').classList.add('open');}
function closeModal(){document.getElementById('modalBackdrop').classList.remove('open');}
function openLightbox(src){document.getElementById('lightboxImg').src=src;document.getElementById('lightbox').classList.add('open');}
function closeLightbox(){document.getElementById('lightbox').classList.remove('open');}

// ═══════════════════════════════════════════════════════════════
// Auth
// ═══════════════════════════════════════════════════════════════
const ADMIN_EMAILS=['webmaster@recosac.com','sebastiand@recosac.com'];
let _adminClaim=false,_currentUser=null;

function isAdmin(){
  if(!_currentUser)return false;
  if(_adminClaim)return true;
  return!!(_currentUser.email&&ADMIN_EMAILS.indexOf(_currentUser.email.toLowerCase())>=0);
}
async function refreshAdminClaim(){
  if(!_currentUser){_adminClaim=false;return false;}
  try{const r=await _currentUser.getIdTokenResult(true);_adminClaim=(r&&r.claims&&r.claims.admin===true);}catch(e){_adminClaim=false;}
  return _adminClaim;
}
function signInWithEmail(){
  const email=document.getElementById('loginEmail').value.trim();
  const password=document.getElementById('loginPassword').value;
  if(!email||!password){showLoginError('Ingresa email y contraseña');return;}
  const btn=document.getElementById('loginSubmitBtn');
  btn.disabled=true;btn.textContent='Ingresando...';
  auth.signInWithEmailAndPassword(email,password).catch(e=>{
    btn.disabled=false;btn.textContent='Iniciar sesión';
    showLoginError(authErrorMsg(e));
  });
}
function signInWithGoogle(){
  const provider=new firebase.auth.GoogleAuthProvider();
  auth.signInWithRedirect(provider).catch(e=>showLoginError(authErrorMsg(e)));
}
auth.getRedirectResult().catch(e=>{if(e.code&&e.code!=='auth/no-auth-event')showLoginError(authErrorMsg(e));});
function resetPassword(){
  const email=document.getElementById('loginEmail').value.trim();
  if(!email){showLoginError('Ingresa tu email primero');return;}
  auth.sendPasswordResetEmail(email).then(()=>{
    const el=document.getElementById('loginError');el.style.display='block';el.style.background='var(--success-light)';el.style.color='var(--success-dark)';el.textContent='Email de recuperación enviado a '+email;
  }).catch(e=>showLoginError(authErrorMsg(e)));
}
function showLoginError(msg){const el=document.getElementById('loginError');el.style.display='block';el.style.background='';el.style.color='';el.textContent=msg;}
function authErrorMsg(e){
  const m={'auth/wrong-password':'Contraseña incorrecta','auth/user-not-found':'No hay cuenta con ese email','auth/invalid-email':'Email inválido','auth/email-already-in-use':'Ya existe una cuenta con ese email','auth/weak-password':'La contraseña debe tener al menos 6 caracteres','auth/too-many-requests':'Demasiados intentos. Espera un momento.','auth/invalid-credential':'Email o contraseña incorrectos','auth/network-request-failed':'Error de red. Verifica tu conexión.'};
  return m[e.code]||e.message||'Error de autenticación';
}
function signOut(){if(confirm('¿Cerrar sesión?'))auth.signOut();}

auth.onAuthStateChanged(async user=>{
  _currentUser=user;
  if(!user){document.getElementById('loginGate').style.display='flex';document.getElementById('adminShell').style.display='none';_adminClaim=false;return;}
  await refreshAdminClaim();
  if(!isAdmin()){document.getElementById('loginGate').style.display='flex';document.getElementById('adminShell').style.display='none';const el=document.getElementById('loginError');el.style.display='block';el.textContent='No tienes permisos de administrador. Contacta al equipo Reco.';return;}
  document.getElementById('loginGate').style.display='none';
  document.getElementById('adminShell').style.display='block';
  document.getElementById('loginError').style.display='none';
  document.getElementById('userAvatar').textContent=initials(user.displayName||user.email);
  document.getElementById('userName').textContent=user.displayName||'Admin';
  document.getElementById('userEmail').textContent=user.email||'';
  loadAllData();
});

// ═══════════════════════════════════════════════════════════════
// Navigation
// ═══════════════════════════════════════════════════════════════
let _currentView='dashboard';
function navigateTo(view){
  _currentView=view;
  document.querySelectorAll('.nav-item').forEach(el=>el.classList.toggle('active',el.dataset.nav===view));
  document.getElementById('sidebar').classList.remove('open');
  renderView();
}
function renderView(){
  const c=document.getElementById('mainContent');
  const views={dashboard:renderDashboard,publications:renderPublications,historicos:renderHistoricos,contacts:renderContacts,users:renderUsers,admins:renderAdmins,market:renderMarket,audit:renderAudit};
  (views[_currentView]||renderDashboard)(c);
}

// ═══════════════════════════════════════════════════════════════
// Data Cache
// ═══════════════════════════════════════════════════════════════
let _pubs=[],_historicos=[],_contacts=[],_auditLog=[],_dataLoaded=false,_marketData={},_usersList=null,_usersPageToken=null;

async function loadAllData(){
  const mc=document.getElementById('mainContent');
  mc.innerHTML='<div class="loading-center"><div class="spinner"></div> Cargando datos de la plataforma...</div>';
  try{
    const[pubSnap,contactSnap,auditSnap]=await Promise.all([
      db.collection('publications').get(),
      db.collection('contactRequests').get(),
      db.collection('adminAuditLog').orderBy('createdAt','desc').limit(200).get()
    ]);
    const allPubs=pubSnap.docs.map(d=>{const o={id:d.id,...d.data()};if(!o.cur&&o.currency)o.cur=o.currency==='PEN'?'S/':'$';return o;});
    _pubs=allPubs.filter(p=>p.op!=='Histórico');
    _historicos=allPubs.filter(p=>p.op==='Histórico');

function updateBadges(){
  const pending=_pubs.filter(p=>p.status==='pending').length;
  const newC=_contacts.filter(c=>c.status==='new').length;
  const pb=document.getElementById('pendingBadge'),cb=document.getElementById('contactsBadge'),hb=document.getElementById('histBadge');
  if(pending>0){pb.textContent=pending;pb.style.display='inline';}else pb.style.display='none';
  if(newC>0){cb.textContent=newC;cb.style.display='inline';}else cb.style.display='none';
  if(hb){hb.textContent=fmtNum(_historicos.length);hb.style.display=_historicos.length>0?'inline':'none';}
}

async function loadMarketData(){
  try{
    const[bcrp,tasaciones,mef,zoni,histMarket,tasFull]=await Promise.all([
      fetch('data/serie_precios_bcrp.json').then(r=>r.ok?r.json():null).catch(()=>null),
      fetch('data/serie_precios_tasaciones.json').then(r=>r.ok?r.json():null).catch(()=>null),
      fetch('data/valores_arancelarios_mef.json').then(r=>r.ok?r.json():null).catch(()=>null),
      fetch('data/zonificacion_lima_imp.json').then(r=>r.ok?r.json():null).catch(()=>null),
      fetch('data/historicos_market.json').then(r=>r.ok?r.json():null).catch(()=>null),
      fetch('data/tasaciones_full.json').then(r=>r.ok?r.json():null).catch(()=>null)
    ]);
    _marketData={bcrp,tasaciones,mef,zoni,histMarket,tasFull};
  }catch(e){console.warn('Market data:',e);}
}

async function refreshPubs(){
  try{const snap=await db.collection('publications').get();const all=snap.docs.map(d=>{const o={id:d.id,...d.data()};if(!o.cur&&o.currency)o.cur=o.currency==='PEN'?'S/':'$';return o;});_pubs=all.filter(p=>p.op!=='Histórico');_historicos=all.filter(p=>p.op==='Histórico');updateBadges();}catch(e){console.error('refreshPubs:',e);}
}
async function refreshContacts(){
  try{const snap=await db.collection('contactRequests').get();_contacts=snap.docs.map(d=>({id:d.id,...d.data()}));updateBadges();}catch(e){console.error('refreshContacts:',e);}
}

function renderBarChart(entries,color){
  if(!entries.length)return'<p style="color:var(--txt-muted);font-size:.82rem">Sin datos</p>';
  const max=Math.max(...entries.map(e=>e[1]),1);
  const c=color||'';
  let bars='',labels='';
  entries.forEach(([label,val])=>{
    const h=Math.max(4,Math.round((val/max)*140));
    bars+=`<div class="chart-bar" style="height:${h}px${c?';background:'+c:''}" title="${esc(label)}: ${val}"><div class="bar-tip">${esc(label)}: ${fmtNum(val)}</div></div>`;
    labels+=`<span title="${esc(label)}">${esc(truncate(label,8))}</span>`;
  });
  return`<div class="chart-bars">${bars}</div><div class="chart-labels">${labels}</div>`;
}

function renderHorizBars(entries,maxVal,color){
  if(!entries.length)return'';
  const mx=maxVal||Math.max(...entries.map(e=>e[1]),1);
  const bg=color||'linear-gradient(90deg,var(--blue),var(--blue2))';
  return entries.map(([label,val])=>`<div class="stat-row"><div class="stat-label">${esc(truncate(label,18))}</div><div class="stat-bar-track"><div class="stat-bar-fill" style="width:${Math.max(2,Math.round((val/mx)*100))}%;background:${bg}"></div></div><div class="stat-val">${fmtNum(val)}</div></div>`).join('');
}

function renderPieChart(entries,size){
  if(!entries.length)return'<p style="color:var(--txt-muted);font-size:.82rem">Sin datos</p>';
  const total=entries.reduce((s,e)=>s+e[1],0);
  if(total===0)return'<p style="color:var(--txt-muted);font-size:.82rem">Sin datos</p>';
  const colors=['#0891b2','#f59e0b','#10b981','#ef4444','#8b5cf6','#ec4899','#06b6d4','#84cc16'];
  const sz=size||140;
  let angle=0;
  const segments=entries.map((e,i)=>{
    const pct=e[1]/total;
    const start=angle;
    angle+=pct*360;
    return{label:e[0],val:e[1],pct,start,end:angle,color:colors[i%colors.length]};
  });
  let gradParts=[];
  segments.forEach(s=>{gradParts.push(`${s.color} ${s.start}deg ${s.end}deg`);});
  const pieStyle=`width:${sz}px;height:${sz}px;border-radius:50%;background:conic-gradient(${gradParts.join(',')})`;
  const legend=segments.map(s=>`<div class="pie-legend-item"><div class="pie-legend-dot" style="background:${s.color}"></div><span>${esc(s.label)}: <strong>${fmtNum(s.val)}</strong> (${Math.round(s.pct*100)}%)</span></div>`).join('');
  return`<div class="pie-container"><div style="${pieStyle}"></div><div class="pie-legend">${legend}</div></div>`;
}

let _pubFilter={status:'all',search:'',type:'all',op:'all',vigencia:'all'};
let _pubSort={key:'createdAt',dir:'desc'};
let _pubPage=0;
const PUB_PAGE_SIZE=25;
const VIGENCIA_DAYS=90;

function _vigenciaDays(p){
  const ref=p.lastConfirmedAt||p.moderatedAt||p.createdAt;
  if(!ref)return 999;
  const ms=ref.toMillis?ref.toMillis():(ref.seconds?ref.seconds*1000:new Date(ref).getTime());
  return Math.floor((Date.now()-ms)/(24*60*60*1000));
}
function _vigenciaStatus(p){
  if(p.status!=='approved')return'na';
  const d=_vigenciaDays(p);
  if(d>=VIGENCIA_DAYS)return'vencida';
  if(d>=VIGENCIA_DAYS-30)return'por_vencer';
  return'vigente';
}
function _vigenciaBadge(p){
  const s=_vigenciaStatus(p);
  const d=_vigenciaDays(p);
  if(s==='na')return'';
  if(s==='vencida')return`<span class="badge badge-rejected" title="${d} días">${d}d</span>`;
  if(s==='por_vencer')return`<span class="badge badge-pending" title="${d} días">${d}d</span>`;
  return`<span class="badge badge-approved" title="${d} días">${d}d</span>`;
}

function renderPublications(el){
  let filtered=_pubs.slice();
  if(_pubFilter.status!=='all')filtered=filtered.filter(p=>p.status===_pubFilter.status);
  if(_pubFilter.type!=='all')filtered=filtered.filter(p=>p.type===_pubFilter.type);
  if(_pubFilter.op!=='all')filtered=filtered.filter(p=>p.op===_pubFilter.op);
  if(_pubFilter.search){
    const q=_pubFilter.search.toLowerCase();
    filtered=filtered.filter(p=>(p.address||'').toLowerCase().includes(q)||(p.district||'').toLowerCase().includes(q)||(p.title||'').toLowerCase().includes(q)||(p.userEmail||'').toLowerCase().includes(q)||(p.userName||'').toLowerCase().includes(q));
  }
  if(_pubFilter.vigencia!=='all')filtered=filtered.filter(p=>_vigenciaStatus(p)===_pubFilter.vigencia);

  filtered.sort((a,b)=>{
    let va,vb;
    switch(_pubSort.key){
      case 'price':va=a.price||0;vb=b.price||0;break;
      case 'area':va=a.area||0;vb=b.area||0;break;
      case 'district':va=(a.district||'').toLowerCase();vb=(b.district||'').toLowerCase();return _pubSort.dir==='asc'?va.localeCompare(vb):vb.localeCompare(va);
      default:va=tsMs(a.createdAt);vb=tsMs(b.createdAt);
    }
    return _pubSort.dir==='asc'?va-vb:vb-va;
  });

  const totalPages=Math.ceil(filtered.length/PUB_PAGE_SIZE);
  if(_pubPage>=totalPages)_pubPage=Math.max(0,totalPages-1);
  const paged=filtered.slice(_pubPage*PUB_PAGE_SIZE,(_pubPage+1)*PUB_PAGE_SIZE);

  const pending=_pubs.filter(p=>p.status==='pending').length;
  const approved=_pubs.filter(p=>p.status==='approved').length;
  const rejected=_pubs.filter(p=>p.status==='rejected').length;
  const vencidas=_pubs.filter(p=>_vigenciaStatus(p)==='vencida').length;
  const porVencer=_pubs.filter(p=>_vigenciaStatus(p)==='por_vencer').length;

  function sortIcon(key){return _pubSort.key===key?(_pubSort.dir==='asc'?' ↑':' ↓'):'';}

  el.innerHTML=`
    <div class="main-header">
      <div><h1>Gesti&oacute;n de Propiedades</h1><div class="subtitle">${_pubs.length} total — ${pending} pendientes, ${approved} aprobadas, ${rejected} rechazadas${vencidas?` · <span style="color:var(--red);font-weight:600">${vencidas} vencidas</span>`:''}</div></div>
      <div class="header-actions">
        ${vencidas?`<button class="btn btn-outline" onclick="bulkVigenciaCheck()" style="color:var(--red)">${IC.mail} Verificar Vencidas (${vencidas})</button>`:''}
        <button class="btn btn-outline" onclick="exportPubs()">Exportar CSV</button>
        <button class="btn btn-outline" onclick="refreshPubs().then(()=>renderPublications(document.getElementById('mainContent')))">${IC.refresh} Actualizar</button>
      </div>
    </div>
    <div class="main-body">
      <div class="filter-bar">
        <div class="search-input">${IC.search}<input placeholder="Buscar direcci&oacute;n, distrito, usuario..." value="${esc(_pubFilter.search)}" oninput="_pubFilter.search=this.value;_pubPage=0;renderPublications(document.getElementById('mainContent'))"/></div>
        <select onchange="_pubFilter.status=this.value;_pubPage=0;renderPublications(document.getElementById('mainContent'))">
          <option value="all"${_pubFilter.status==='all'?' selected':''}>Todos (${_pubs.length})</option>
          <option value="pending"${_pubFilter.status==='pending'?' selected':''}>Pendientes (${pending})</option>
          <option value="approved"${_pubFilter.status==='approved'?' selected':''}>Aprobadas (${approved})</option>
          <option value="rejected"${_pubFilter.status==='rejected'?' selected':''}>Rechazadas (${rejected})</option>
        </select>
        <select onchange="_pubFilter.op=this.value;_pubPage=0;renderPublications(document.getElementById('mainContent'))">
          <option value="all"${_pubFilter.op==='all'?' selected':''}>Todas las ops</option>
          <option value="Venta"${_pubFilter.op==='Venta'?' selected':''}>Venta</option>
          <option value="Alquiler"${_pubFilter.op==='Alquiler'?' selected':''}>Alquiler</option>
        </select>
        <select onchange="_pubFilter.type=this.value;_pubPage=0;renderPublications(document.getElementById('mainContent'))">
          <option value="all"${_pubFilter.type==='all'?' selected':''}>Todos los tipos</option>
          ${PUB_TYPES.map(t=>`<option value="${t}"${_pubFilter.type===t?' selected':''}>${t}</option>`).join('')}
        </select>
        <select onchange="_pubFilter.vigencia=this.value;_pubPage=0;renderPublications(document.getElementById('mainContent'))">
          <option value="all"${_pubFilter.vigencia==='all'?' selected':''}>Toda vigencia</option>
          <option value="vencida"${_pubFilter.vigencia==='vencida'?' selected':''}>Vencidas >${VIGENCIA_DAYS}d (${vencidas})</option>
          <option value="por_vencer"${_pubFilter.vigencia==='por_vencer'?' selected':''}>Por vencer (${porVencer})</option>
          <option value="vigente"${_pubFilter.vigencia==='vigente'?' selected':''}>Vigentes</option>
        </select>
      </div>

      ${paged.length===0?'<div class="section-card"><div class="card-body"><div class="empty-state"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 9l9-7 9 7v11a2 2 0 01-2 2H5a2 2 0 01-2-2z"/></svg><p>No hay propiedades que coincidan con los filtros.</p></div></div></div>':
      `<div class="section-card">
        <div class="card-body no-pad" style="overflow-x:auto">
          <table class="data-table">
            <thead><tr>
              <th>Estado</th>
              <th>Propiedad</th>
              <th class="sortable" onclick="togglePubSort('district')">Distrito${sortIcon('district')}</th>
              <th>Tipo</th><th>Op</th>
              <th class="sortable" onclick="togglePubSort('price')">Precio${sortIcon('price')}</th>
              <th class="sortable" onclick="togglePubSort('area')">&Aacute;rea${sortIcon('area')}</th>
              <th>$/m²</th>
              <th>Usuario</th>
              <th class="sortable" onclick="togglePubSort('createdAt')">Fecha${sortIcon('createdAt')}</th>
              <th>Vigencia</th>
              <th>Acciones</th>
            </tr></thead>
            <tbody>
              ${paged.map(p=>{
                const pm2=(p.currency==='USD'&&p.price>0&&p.area>0)?Math.round(p.price/p.area):0;
                return`<tr>
                <td><span class="badge badge-${p.status||'pending'}">${p.status==='approved'?'Aprobada':p.status==='rejected'?'Rechazada':'Pendiente'}</span></td>
                <td style="max-width:200px"><strong style="cursor:pointer;color:var(--primary)" onclick="showPubDetail('${esc(p.id)}')">${esc(truncate(p.address||p.title||'—',32))}</strong>${(p.photoUrls||[]).length?'<br><span style="font-size:.65rem;color:var(--txt-muted)">'+(p.photoUrls||[]).length+' fotos</span>':''}</td>
                <td>${esc(p.district||'—')}</td>
                <td><span class="badge badge-info">${esc(p.type||'—')}</span></td>
                <td>${esc(p.op||'—')}</td>
                <td style="white-space:nowrap">${fmtPrice(p.price,p.currency)}</td>
                <td>${p.area?fmtNum(p.area)+' m²':'—'}</td>
                <td>${pm2?'$'+fmtNum(pm2):'—'}</td>
                <td style="max-width:130px;font-size:.72rem;color:var(--txt-muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap" title="${esc(p.userEmail||'')}">${esc(p.userName||p.userEmail||'—')}</td>
                <td style="white-space:nowrap;font-size:.72rem">${fmtShortDate(p.createdAt)}</td>
                <td style="white-space:nowrap;text-align:center">${_vigenciaBadge(p)}${_vigenciaStatus(p)==='vencida'&&!p.vigenciaEmailSentAt?` <button class="btn-icon" onclick="sendVigenciaCheck('${esc(p.id)}')" title="Enviar verificación" style="color:var(--amber)">${IC.mail}</button>`:''}</td>
                <td style="white-space:nowrap">
                  ${p.status==='pending'?`<button class="btn btn-success btn-xs" onclick="approvePub('${esc(p.id)}')">${IC.check}</button> <button class="btn btn-error btn-xs" onclick="rejectPub('${esc(p.id)}')">${IC.x}</button>`:
                   p.status==='approved'?`<button class="btn btn-outline btn-xs" onclick="unapprovePub('${esc(p.id)}')">Despublicar</button>`:
                   `<button class="btn btn-outline btn-xs" onclick="unapprovePub('${esc(p.id)}')">Re-evaluar</button>`}
                  <button class="btn-icon" onclick="showEditPub('${esc(p.id)}')" title="Editar">${IC.edit}</button>
                  <button class="btn-icon" onclick="deletePub('${esc(p.id)}')" title="Eliminar" style="color:var(--red)">${IC.trash}</button>
                </td>
              </tr>`;}).join('')}
            </tbody>
          </table>
        </div>
      </div>
      ${totalPages>1?`<div class="pagination">
        <button class="btn btn-outline btn-sm" onclick="_pubPage=0;renderPublications(document.getElementById('mainContent'))" ${_pubPage===0?'disabled':''}>«</button>
        <button class="btn btn-outline btn-sm" onclick="_pubPage=Math.max(0,_pubPage-1);renderPublications(document.getElementById('mainContent'))" ${_pubPage===0?'disabled':''}>‹</button>
        <span class="page-info">Página ${_pubPage+1} de ${totalPages} (${filtered.length} resultados)</span>
        <button class="btn btn-outline btn-sm" onclick="_pubPage=Math.min(${totalPages-1},_pubPage+1);renderPublications(document.getElementById('mainContent'))" ${_pubPage>=totalPages-1?'disabled':''}>›</button>
        <button class="btn btn-outline btn-sm" onclick="_pubPage=${totalPages-1};renderPublications(document.getElementById('mainContent'))" ${_pubPage>=totalPages-1?'disabled':''}>»</button>
      </div>`:''}`}
    </div>`;
}

function togglePubSort(key){
  if(_pubSort.key===key)_pubSort.dir=_pubSort.dir==='asc'?'desc':'asc';
  else{_pubSort.key=key;_pubSort.dir='desc';}
  renderPublications(document.getElementById('mainContent'));
}

let _editPhotos=[];
function buildPhotoManager(photos,prefix){
  _editPhotos=(photos||[]).slice();
  const id=prefix||'pm';
  let html=`<label>Fotos (${_editPhotos.length})</label><div class="photo-manager"><div class="pm-grid" id="${id}_grid">`;
  _editPhotos.forEach((url,i)=>{
    html+=`<div class="pm-item"><img src="${esc(url)}"/><div class="pm-actions">
      ${i>0?`<button class="pm-btn pm-left" onclick="pmMove(${i},-1,'${id}')" title="Mover izq">◀</button>`:''}
      ${i<_editPhotos.length-1?`<button class="pm-btn pm-right" onclick="pmMove(${i},1,'${id}')" title="Mover der">▶</button>`:''}
      <button class="pm-btn pm-del" onclick="pmRemove(${i},'${id}')" title="Eliminar">✕</button>
    </div><div class="pm-order">#${i+1}</div></div>`;
  });
  html+=`</div><div class="pm-upload"><input type="file" id="${id}_file" accept="image/*" multiple/><button class="btn btn-outline btn-sm" onclick="pmUpload('${id}')">Subir fotos</button></div></div>`;
  return html;
}
function pmMove(idx,dir,prefix){
  const newIdx=idx+dir;
  if(newIdx<0||newIdx>=_editPhotos.length)return;
  const tmp=_editPhotos[idx];_editPhotos[idx]=_editPhotos[newIdx];_editPhotos[newIdx]=tmp;
  document.getElementById(prefix+'_grid').innerHTML=buildPhotoGridInner(prefix);
}
function pmRemove(idx,prefix){
  if(!confirm('¿Eliminar esta foto?'))return;
  _editPhotos.splice(idx,1);
  document.getElementById(prefix+'_grid').innerHTML=buildPhotoGridInner(prefix);
}
function buildPhotoGridInner(prefix){
  let html='';
  _editPhotos.forEach((url,i)=>{
    html+=`<div class="pm-item"><img src="${esc(url)}"/><div class="pm-actions">
      ${i>0?`<button class="pm-btn pm-left" onclick="pmMove(${i},-1,'${prefix}')" title="Mover izq">◀</button>`:''}
      ${i<_editPhotos.length-1?`<button class="pm-btn pm-right" onclick="pmMove(${i},1,'${prefix}')" title="Mover der">▶</button>`:''}
      <button class="pm-btn pm-del" onclick="pmRemove(${i},'${prefix}')" title="Eliminar">✕</button>
    </div><div class="pm-order">#${i+1}</div></div>`;
  });
  return html;
}
async function pmUpload(prefix){
  const input=document.getElementById(prefix+'_file');
  if(!input||!input.files||!input.files.length)return;
  const files=Array.from(input.files);
  toast('Subiendo '+files.length+' foto(s)...');
  for(const file of files){
    try{
      const path='admin_uploads/'+Date.now()+'_'+Math.random().toString(36).slice(2)+'.'+file.name.split('.').pop();
      const ref=storage.ref(path);
      await ref.put(file);
      const url=await ref.getDownloadURL();
      _editPhotos.push(url);
    }catch(e){toast('Error subiendo: '+e.message);}
  }
  document.getElementById(prefix+'_grid').innerHTML=buildPhotoGridInner(prefix);
  input.value='';
  toast('Fotos subidas');
}

async function saveEditPub(id,isHist){
  try{
    const val=s=>document.getElementById(s)?document.getElementById(s).value:'';
    const num=s=>{const el=document.getElementById(s);return el?Number(el.value)||0:0;};
    const chk=s=>{const el=document.getElementById(s);return el?el.checked:false;};
    const latVal=val('ep_lat');
    const lngVal=val('ep_lng');
    const data={
      title:val('ep_title').trim(),
      address:val('ep_address').trim(),
      district:val('ep_district').trim(),
      type:val('ep_type'),
      price:num('ep_price'),
      currency:val('ep_currency'),
      area:num('ep_area'),
      areaTerr:num('ep_areaTerr'),
      beds:num('ep_beds'),
      baths:num('ep_baths'),
      parking:num('ep_parking'),
      age:num('ep_age'),
      floor:num('ep_floor'),
      floors:num('ep_floors'),
      estado:val('ep_estado'),
      ascensor:chk('ep_ascensor'),
      amoblado:chk('ep_amoblado'),
      petFriendly:chk('ep_petFriendly'),
      hideExact:chk('ep_hideExact'),
      features:_editFeatures.slice(),
      desc:val('ep_desc').trim(),
      photoUrls:_editPhotos.slice(),
    };
    if(latVal)data.lat=parseFloat(latVal);
    if(lngVal)data.lng=parseFloat(lngVal);
    if(!isHist)data.op=val('ep_op');
    if(isHist){
      data.priceTotal=num('ep_priceTotal');
      data.priceProp=num('ep_priceProp');
      data.areaTech=num('ep_areaTech');
      data.areaOcup=num('ep_areaOcup');
    }
    await db.collection('publications').doc(id).update(data);
    adminAudit('publication.edit','publication',id,{fields:Object.keys(data)});
    closeModal();toast('Propiedad actualizada');
    await refreshPubs();renderView();
  }catch(e){toast('Error: '+e.message);}
}

async function approvePub(id){
  if(!isAdmin())return;
  try{
    const ref=db.collection('publications').doc(id);const snap=await ref.get();const pub=snap.exists?{id:snap.id,...snap.data()}:null;
    await ref.update({status:'approved',moderatedAt:firebase.firestore.FieldValue.serverTimestamp(),moderatedBy:_currentUser.uid,rejectionReason:firebase.firestore.FieldValue.delete()});
    adminAudit('publication.approve','publication',id,pub?{userId:pub.userId||null}:null);
    if(pub&&pub.userEmail)queueModerationEmail(pub,'approved');
    toast('Publicación aprobada');await refreshPubs();renderView();
  }catch(e){toast('Error al aprobar: '+e.message);}
}

async function rejectPub(id){
  if(!isAdmin())return;
  const reason=prompt('Razón del rechazo (visible para el usuario):','');
  if(reason===null)return;
  try{
    const ref=db.collection('publications').doc(id);const snap=await ref.get();const pub=snap.exists?{id:snap.id,...snap.data()}:null;
    await ref.update({status:'rejected',rejectionReason:reason||'',moderatedAt:firebase.firestore.FieldValue.serverTimestamp(),moderatedBy:_currentUser.uid});
    adminAudit('publication.reject','publication',id,{reason:reason||'',userId:(pub&&pub.userId)||null});
    if(pub&&pub.userEmail)queueModerationEmail(pub,'rejected',reason);
    toast('Publicación rechazada');await refreshPubs();renderView();
  }catch(e){toast('Error al rechazar: '+e.message);}
}

    }catch(e){errors++;console.warn('vigencia mail error:',pub.id,e.message);}
  }
  toast(sent+' emails enviados'+(errors?', '+errors+' errores':''));
  await refreshPubs();renderView();
}

async function confirmVigencia(id){
  if(!isAdmin())return;
  try{
    await db.collection('publications').doc(id).update({
      lastConfirmedAt:firebase.firestore.FieldValue.serverTimestamp(),
      vigenciaEmailSentAt:firebase.firestore.FieldValue.delete()
    });
    adminAudit('vigencia.confirm','publication',id);
    toast('Vigencia confirmada');
    await refreshPubs();renderView();
  }catch(e){toast('Error al confirmar vigencia: '+e.message);}
}

let _histFilter={search:'',type:'all',district:'all'};
let _histSort={key:'createdAt',dir:'desc'};
let _histPage=0;
const HIST_PAGE_SIZE=25;

function renderHistoricos(el){
  let filtered=_historicos.slice();
  if(_histFilter.type!=='all')filtered=filtered.filter(p=>p.type===_histFilter.type);
  if(_histFilter.district!=='all')filtered=filtered.filter(p=>p.district===_histFilter.district);
  if(_histFilter.search){
    const q=_histFilter.search.toLowerCase();
    filtered=filtered.filter(p=>(p.address||'').toLowerCase().includes(q)||(p.district||'').toLowerCase().includes(q)||(p.title||'').toLowerCase().includes(q));
  }

  filtered.sort((a,b)=>{
    let va,vb;
    switch(_histSort.key){
      case 'price':va=a.priceTotal||a.price||0;vb=b.priceTotal||b.price||0;break;
      case 'area':va=a.area||0;vb=b.area||0;break;
      case 'district':va=(a.district||'').toLowerCase();vb=(b.district||'').toLowerCase();return _histSort.dir==='asc'?va.localeCompare(vb):vb.localeCompare(va);
      default:va=tsMs(a.createdAt);vb=tsMs(b.createdAt);
    }
    return _histSort.dir==='asc'?va-vb:vb-va;
  });

  const totalPages=Math.ceil(filtered.length/HIST_PAGE_SIZE);
  if(_histPage>=totalPages)_histPage=Math.max(0,totalPages-1);
  const paged=filtered.slice(_histPage*HIST_PAGE_SIZE,(_histPage+1)*HIST_PAGE_SIZE);

  const districts=[...new Set(_historicos.map(p=>p.district).filter(Boolean))].sort();

  function sortIcon(key){return _histSort.key===key?(_histSort.dir==='asc'?' ↑':' ↓'):'';}

  el.innerHTML=`
    <div class="main-header">
      <div><h1>Gestión de Históricos</h1><div class="subtitle">${fmtNum(_historicos.length)} transacciones históricas (SUNARP)</div></div>
      <div class="header-actions">
        <button class="btn btn-outline" onclick="exportHistoricos()">Exportar CSV</button>
        <button class="btn btn-outline" onclick="refreshPubs().then(()=>renderHistoricos(document.getElementById('mainContent')))">${IC.refresh} Actualizar</button>
      </div>
    </div>
    <div class="main-body">
      <div class="filter-bar">
        <div class="search-input">${IC.search}<input placeholder="Buscar dirección, distrito..." value="${esc(_histFilter.search)}" oninput="_histFilter.search=this.value;_histPage=0;renderHistoricos(document.getElementById('mainContent'))"/></div>
        <select onchange="_histFilter.type=this.value;_histPage=0;renderHistoricos(document.getElementById('mainContent'))">
          <option value="all"${_histFilter.type==='all'?' selected':''}>Todos los tipos</option>
          ${PUB_TYPES.map(t=>`<option value="${t}"${_histFilter.type===t?' selected':''}>${t}</option>`).join('')}
        </select>
        <select onchange="_histFilter.district=this.value;_histPage=0;renderHistoricos(document.getElementById('mainContent'))">
          <option value="all"${_histFilter.district==='all'?' selected':''}>Todos los distritos (${districts.length})</option>
          ${districts.map(d=>`<option value="${esc(d)}"${_histFilter.district===d?' selected':''}>${esc(d)}</option>`).join('')}
        </select>
      </div>

      ${paged.length===0?'<div class="section-card"><div class="card-body"><div class="empty-state"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="22 12 18 12 15 21 9 3 6 12 2 12"/></svg><p>No hay históricos que coincidan.</p></div></div></div>':
      `<div class="section-card">
        <div class="card-body no-pad" style="overflow-x:auto">
          <table class="data-table">
            <thead><tr>
              <th>Dirección</th>
              <th class="sortable" onclick="toggleHistSort('district')">Distrito${sortIcon('district')}</th>
              <th>Tipo</th>
              <th class="sortable" onclick="toggleHistSort('price')">Valor Total${sortIcon('price')}</th>
              <th class="sortable" onclick="toggleHistSort('area')">Área${sortIcon('area')}</th>
              <th>$/m²</th>
              <th>Fotos</th>
              <th class="sortable" onclick="toggleHistSort('createdAt')">Fecha${sortIcon('createdAt')}</th>
              <th>Acciones</th>
            </tr></thead>
            <tbody>
              ${paged.map(p=>{
                const total=p.priceTotal||p.price||0;
                const pm2=(p.currency==='USD'&&total>0&&p.area>0)?Math.round(total/p.area):0;
                const photoCount=(p.photoUrls||[]).length;
                return`<tr>
                <td style="max-width:200px"><strong style="cursor:pointer;color:var(--primary)" onclick="showPubDetail('${esc(p.id)}')">${esc(truncate(p.address||p.title||'—',32))}</strong></td>
                <td>${esc(p.district||'—')}</td>
                <td><span class="badge badge-historico">${esc(p.type||'—')}</span></td>
                <td style="white-space:nowrap">${fmtPrice(total,p.currency)}</td>
                <td>${p.area?fmtNum(p.area)+' m²':'—'}</td>
                <td>${pm2?'$'+fmtNum(pm2):'—'}</td>
                <td style="text-align:center">${photoCount>0?'<span style="color:var(--green)">'+photoCount+'</span>':'—'}</td>
                <td style="white-space:nowrap;font-size:.72rem">${fmtShortDate(p.createdAt)}</td>
                <td style="white-space:nowrap">
                  <button class="btn-icon" onclick="showEditPub('${esc(p.id)}')" title="Editar">${IC.edit}</button>
                  <button class="btn-icon" onclick="showHistPdfs('${esc(p.id)}')" title="PDFs" style="color:var(--amber)">${IC.file}</button>
                  <button class="btn-icon" onclick="deletePub('${esc(p.id)}')" title="Eliminar" style="color:var(--red)">${IC.trash}</button>
                </td>
              </tr>`;}).join('')}
            </tbody>
          </table>
        </div>
      </div>
      ${totalPages>1?`<div class="pagination">
        <button class="btn btn-outline btn-sm" onclick="_histPage=0;renderHistoricos(document.getElementById('mainContent'))" ${_histPage===0?'disabled':''}>«</button>
        <button class="btn btn-outline btn-sm" onclick="_histPage=Math.max(0,_histPage-1);renderHistoricos(document.getElementById('mainContent'))" ${_histPage===0?'disabled':''}>‹</button>
        <span class="page-info">Página ${_histPage+1} de ${totalPages} (${filtered.length} resultados)</span>
        <button class="btn btn-outline btn-sm" onclick="_histPage=Math.min(${totalPages-1},_histPage+1);renderHistoricos(document.getElementById('mainContent'))" ${_histPage>=totalPages-1?'disabled':''}>›</button>
        <button class="btn btn-outline btn-sm" onclick="_histPage=${totalPages-1};renderHistoricos(document.getElementById('mainContent'))" ${_histPage>=totalPages-1?'disabled':''}>»</button>
      </div>`:''}`}
    </div>`;
}

function toggleHistSort(key){
  if(_histSort.key===key)_histSort.dir=_histSort.dir==='asc'?'desc':'asc';
  else{_histSort.key=key;_histSort.dir='desc';}
  renderHistoricos(document.getElementById('mainContent'));
}

function buildHistPhotoGrid(id){
  const photos=(_historicos.find(x=>x.id===id)||{}).photoUrls||[];
  if(!photos.length)return'<p style="color:var(--txt-muted);font-size:.82rem;margin-bottom:12px">Sin fotos</p>';
  return`<div class="photo-grid">${photos.map((u,i)=>`<div style="position:relative;display:inline-block"><img src="${esc(u)}" onclick="event.stopPropagation();openLightbox('${esc(u)}')" loading="lazy" style="cursor:zoom-in"/><button class="btn-icon" onclick="histPhotoRemove('${esc(id)}',${i})" title="Eliminar foto" style="position:absolute;top:4px;right:4px;background:rgba(0,0,0,.6);color:#fff;border-radius:50%;width:24px;height:24px;font-size:.7rem;display:flex;align-items:center;justify-content:center">${IC.trash}</button></div>`).join('')}</div>`;
}

async function histPhotoUpload(id){
  const input=document.getElementById('hist_photo_file');
  if(!input||!input.files||!input.files.length)return;
  const files=Array.from(input.files);
  toast('Subiendo '+files.length+' foto(s)...');
  const p=_historicos.find(x=>x.id===id);
  const current=(p?p.photoUrls:[])||[];
  const updated=current.slice();
  for(const file of files){
    try{
      const path='admin_uploads/'+Date.now()+'_'+Math.random().toString(36).slice(2)+'.'+file.name.split('.').pop();
      const ref=storage.ref(path);
      await ref.put(file);
      const url=await ref.getDownloadURL();
      updated.push(url);
    }catch(e){toast('Error subiendo: '+e.message);}
  }
  await db.collection('publications').doc(id).update({photoUrls:updated});
  adminAudit('historico.photo_upload','publication',id,{count:files.length});
  toast('Fotos subidas');
  await refreshPubs();
  showHistPdfs(id);
}

async function histPhotoRemove(id,idx){
  if(!confirm('¿Eliminar esta foto?'))return;
  try{
    const p=_historicos.find(x=>x.id===id);
    const current=(p?p.photoUrls:[])||[];
    const updated=current.filter((_,i)=>i!==idx);
    await db.collection('publications').doc(id).update({photoUrls:updated});
    adminAudit('historico.photo_delete','publication',id);
    toast('Foto eliminada');
    await refreshPubs();
    showHistPdfs(id);
  }catch(e){toast('Error: '+e.message);}
}

async function uploadHistPdf(id){
  const input=document.getElementById('hist_pdf_file');
  if(!input||!input.files||!input.files.length){toast('Selecciona un PDF');return;}
  const file=input.files[0];
  toast('Subiendo PDF...');
  try{
    const path='admin_uploads/pdfs/'+Date.now()+'_'+file.name;
    const ref=storage.ref(path);
    await ref.put(file);
    const url=await ref.getDownloadURL();
    const p=_historicos.find(x=>x.id===id);
    const current=p?(p.pdfUrls||p.pdfs||[]):[];
    const updated=[...current,{url,label:file.name}];
    await db.collection('publications').doc(id).update({pdfUrls:updated});
    adminAudit('historico.pdf_upload','publication',id,{fileName:file.name});
    toast('PDF subido');
    await refreshPubs();
    showHistPdfs(id);
  }catch(e){toast('Error: '+e.message);}
}

async function pmRemovePdf(id,idx){
  if(!confirm('¿Eliminar este PDF?'))return;
  try{
    const p=_historicos.find(x=>x.id===id);
    const current=p?(p.pdfUrls||p.pdfs||[]):[];
    const updated=current.filter((_,i)=>i!==idx);
    await db.collection('publications').doc(id).update({pdfUrls:updated});
    adminAudit('historico.pdf_delete','publication',id);
    toast('PDF eliminado');
    await refreshPubs();
    showHistPdfs(id);
  }catch(e){toast('Error: '+e.message);}
}

function exportHistoricos(){
  const headers=['ID','Dirección','Distrito','Tipo','Valor Total','Precio Propiedad','Moneda','Área m²','Área terreno','Área Técnica','Área Ocupada','Dormitorios','Baños','Estacionamientos','Antigüedad','Etiquetas','Fotos','PDFs','Fecha'];
  const rows=_historicos.map(p=>[p.id,p.address||'',p.district||'',p.type||'',p.priceTotal||p.price||0,p.priceProp||0,p.currency||'',p.area||0,p.areaTerr||0,p.areaTech||0,p.areaOcup||0,p.beds||0,p.baths||0,p.parking||0,p.age||0,(p.features||[]).join('; '),(p.photoUrls||[]).length,(p.pdfUrls||p.pdfs||[]).length,p.createdAt?new Date(tsMs(p.createdAt)).toISOString():'']);
  const csv=[headers.join(','),...rows.map(r=>r.map(v=>'"'+String(v).replace(/"/g,'""')+'"').join(','))].join('\n');
  const blob=new Blob(['﻿'+csv],{type:'text/csv;charset=utf-8'});
  const url=URL.createObjectURL(blob);
  const a=document.createElement('a');a.href=url;a.download='reco_historicos_'+new Date().toISOString().slice(0,10)+'.csv';a.click();URL.revokeObjectURL(url);
  toast('Históricos exportados');
}

function fmtRelTime(dateStr){
  if(!dateStr)return'—';
  const d=new Date(dateStr);const now=Date.now();const diff=now-d.getTime();
  if(diff<0)return'Ahora';
  const mins=Math.floor(diff/60000);
  if(mins<1)return'Ahora';if(mins<60)return'Hace '+mins+' min';
  const hrs=Math.floor(mins/60);if(hrs<24)return'Hace '+hrs+' h';
  const days=Math.floor(hrs/24);if(days<30)return'Hace '+days+' d';
  const months=Math.floor(days/30);return'Hace '+months+' mes'+(months>1?'es':'');
}

async function loadUsersList(){
  const container=document.getElementById('usersListContainer');
  if(container)container.innerHTML='<div class="loading-center" style="margin-top:12px"><div class="spinner"></div> Cargando usuarios...</div>';
  else toast('Cargando usuarios...');
  try{
    _usersData=[];_usersPageToken=null;
    let hasMore=true;
    while(hasMore){
      const fn=fns.httpsCallable('adminListUsers');
      const res=await fn({limit:100,pageToken:_usersPageToken||undefined});
      _usersData=_usersData.concat(res.data.users||[]);
      _usersPageToken=res.data.nextPageToken||null;
      hasMore=!!_usersPageToken;
    }
    _usersPage=0;
    renderUsers(document.getElementById('mainContent'));
  }catch(e){
    if(e.code==='not-found'||(e.message&&e.message.includes('not found'))){
      const c=container||document.getElementById('mainContent');
      if(c)c.innerHTML='<div style="padding:16px;background:var(--warning-light);border-radius:var(--r);color:var(--warning-dark);font-size:.85rem;margin:20px 30px">El Cloud Function <code>adminListUsers</code> aún no está desplegado. Se habilitará en la fase de integración.</div>';
    }else{toast('Error: '+e.message);}
  }
}

async function toggleUserDisabled(u){
  const action=u.disabled?'activar':'suspender';

  toast(u.disabled?'Activando...':'Suspendiendo...');
  try{
    const fn=fns.httpsCallable('adminDisableUser');
    await fn({uid:u.uid,disabled:!u.disabled});
    toast('Usuario '+(u.disabled?'activado':'suspendido'));
    const user=_usersData.find(x=>x.uid===u.uid);

function exportUsers(){

  const rows=_usersData.map(u=>[u.uid,u.displayName||'',u.email||'',u.emailVerified?'Sí':'No',u.isAdmin?'Sí':'No',u.keysLeft||0,u.favoritesCount||0,u.disabled?'Inactivo':'Activo',u.createdAt||'',u.lastSignIn||'']);
  const csv=[headers.join(','),...rows.map(r=>r.map(v=>'"'+String(v).replace(/"/g,'""')+'"').join(','))].join('\n');
  const blob=new Blob(['﻿'+csv],{type:'text/csv;charset=utf-8'});
  const url=URL.createObjectURL(blob);
  const a=document.createElement('a');a.href=url;a.download='reco_usuarios_'+new Date().toISOString().slice(0,10)+'.csv';a.click();URL.revokeObjectURL(url);
  toast('Usuarios exportados');
}

function renderAdminActivityTable(){
  const adminActions=_auditLog.reduce((acc,e)=>{
    const email=e.adminEmail||e.adminUid||'unknown';
    if(!acc[email])acc[email]={count:0,lastAction:null,lastDate:0};
    acc[email].count++;
    const t=tsMs(e.createdAt);
    if(t>acc[email].lastDate){acc[email].lastDate=t;acc[email].lastAction=e.action;}
    return acc;
  },{});
  const adminList=Object.entries(adminActions).sort((a,b)=>b[1].count-a[1].count);
  if(!adminList.length)return'<div class="empty-state"><p>Sin actividad registrada</p></div>';
  return`<div style="overflow-x:auto"><table class="data-table">
    <thead><tr><th>Admin</th><th>Total</th><th>Última Acción</th><th>Fecha</th></tr></thead>
    <tbody>${adminList.map(([email,data])=>`<tr>
      <td><strong>${esc(email)}</strong></td>
      <td>${data.count}</td>
      <td><span class="badge badge-info">${esc(data.lastAction||'—')}</span></td>

}

    setTimeout(()=>{closeModal();loadAdminsList();},800);
  }catch(e){result.innerHTML=`<span style="color:var(--red)">Error: ${esc(e.message)}</span>`;}
}

async function revokeAdminFn(uid,email){
  if(!confirm(`¿Revocar admin para ${email}?`))return;
  try{
    const fn=fns.httpsCallable('setAdminClaim');
    await fn({email,admin:false});
    toast('Admin revocado para '+email);

  }catch(e){toast('Error: '+e.message);}
}

// MARKET INTELLIGENCE

// ═══════════════════════════════════════════════════════════════
// DATA DE MERCADO — Sprint 1 Core (I-01, I-02, I-06)
// Normalization · Governance · Calculation · UI
// ═══════════════════════════════════════════════════════════════
let _dmView='panorama',_dmDist='',_dmTipo='',_dmPropId='';

// ── District Normalization Layer ──
const _DM_BCRP_MAP={'Surco':'Santiago de Surco','Magdalena':'Magdalena del Mar'};
const _DM_ACCENT_MAP={'JESUS MARIA':'Jesús María','JOSE LUIS BUSTAMANTE Y RIVERO':'José Luis Bustamante y Rivero'};
const _DM_LOWER=['de','del','la','las','los','y','el'];
function _dmTC(s){return s.split(' ').map((w,i)=>{const l=w.toLowerCase();return(i>0&&_DM_LOWER.indexOf(l)>=0)?l:l.charAt(0).toUpperCase()+l.slice(1);}).join(' ');}
function _dmND(n,src){if(!n)return'';const t=n.trim();if(src==='bcrp')return _DM_BCRP_MAP[t]||t;if(src==='tas')return _DM_ACCENT_MAP[t]||_dmTC(t);return t;}

// ── Governance: R-OUT-01 IQR Outlier Removal ──
function _dmClean(a){if(a.length<10)return[...a];const s=[...a].sort((x,y)=>x-y),q1=s[Math.floor(s.length*.25)],q3=s[Math.floor(s.length*.75)],iqr=q3-q1;return a.filter(v=>v>=(q1-1.5*iqr)&&v<=(q3+1.5*iqr));}

// ── Confidence Score (5 dimensions) ──
function _dmConf(n,nSrc,geo,fresh,qual){
  const sv=n>=100?100:n>=50?80:n>=30?60:n>=10?30:0;
  const cv=nSrc>=3?100:nSrc===2?70:nSrc===1?40:0;
  const gv=geo==='distrito'?100:geo==='provincia'?60:30;
  const tv=fresh>=80?100:fresh>=50?60:30;
  const qv=qual>=80?100:qual>=50?60:30;
  return Math.round(sv*.30+cv*.20+gv*.20+tv*.15+qv*.15);
}
function _dmCBadge(sc){
  if(sc>=80)return'<span class="badge dm-conf-high">Confianza Alta ('+sc+')</span>';
  if(sc>=60)return'<span class="badge dm-conf-med">Confianza Media ('+sc+')</span>';
  if(sc>=40)return'<span class="badge dm-conf-low">Confianza Baja ('+sc+')</span>';
  return'<span class="badge dm-conf-none">Datos Insuficientes ('+sc+')</span>';
}
function _dmSBadge(n){
  if(n>=30)return'<span class="badge dm-sample-ok">n='+fmtNum(n)+' · Confiable</span>';
  if(n>=10)return'<span class="badge dm-sample-ind">n='+fmtNum(n)+' · Indicativo</span>';
  return'<span class="badge dm-sample-low">n='+fmtNum(n)+' · Insuficiente</span>';
}
function _dmTrust(conf,nSrc,n,outliers,scope){
  const dt=new Date().toLocaleDateString('es-PE',{day:'numeric',month:'short',year:'numeric'});
  return'<div class="dm-trust"><strong>Data Trust</strong> · '+_dmCBadge(conf)+
    '<div style="margin-top:8px;display:flex;flex-wrap:wrap;gap:16px"><span>Fuentes: '+nSrc+'</span><span>Muestra: '+fmtNum(n)+'</span>'+
    (outliers>0?'<span>Outliers removidos: '+fmtNum(outliers)+' (IQR)</span>':'')+
    '<span>Ámbito: '+esc(scope)+'</span><span>Consulta: '+dt+'</span></div>'+
    '<div style="margin-top:6px;font-style:italic">Los valores de oferta reflejan precios de publicación (asking), no precios de transacción. Medianas y percentiles excluyen outliers según política IQR (R-OUT-01). No se mezclan poblaciones oferta/transacción (R-COMP-01).</div></div>';
}
function _dmNav(view,dist,tipo,propId){
  _dmView=view;if(dist!==undefined)_dmDist=dist;if(tipo!==undefined)_dmTipo=tipo;if(propId!==undefined)_dmPropId=propId;
  renderMarket(document.getElementById('mainContent'));
}

  // District ranking

    const t=p.type||'Otro';byDist[d].types[t]=(byDist[d].types[t]||0)+1;
  });
  const dRank=Object.entries(byDist).map(([name,d])=>{
    const c=_dmClean(d.pm2);
    return{name,med:_mktMedian(c),n:c.length,count:d.n,

  // Type distribution
  const byType={};
  vLima.forEach(p=>{const t=p.type||'Otro';byType[t]=(byType[t]||0)+1;});
